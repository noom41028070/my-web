<script id="separated-readers-v2">
(function(){
    "use strict";
    function ready(fn){
        if(document.readyState === "loading"){
            document.addEventListener("DOMContentLoaded", fn, {once:true});
        }else{
            fn();
        }
    }
    ready(function(){
        function initialize(){
            if(!window.GamebookCore || !window.DualFormatWorkspace){
                setTimeout(initialize, 120);
                return;
            }
            const core = window.GamebookCore;
            const dual = window.DualFormatWorkspace;
            const pixivWorkspace = document.getElementById("pixivWorkspace");
            const htmlWorkspace = document.getElementById("htmlWorkspace");
            if(!pixivWorkspace || !htmlWorkspace || document.getElementById("formatReaderActionsPixiv")) return;

            /* 撤掉舊的全域閱讀按鈕，不影響其他專案工具。 */
            document.querySelectorAll(".pixiv-editor-app > header > button").forEach(function(button){
                const label = (button.textContent || "").replace(/\s+/g, "");
                if(label === "測試閱讀" || label === "輸出HTML閱讀版"){
                    button.remove();
                }
            });

            const escapeHtml = function(value){
                return String(value == null ? "" : value)
                    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
                    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
            };
            const cleanHtml = function(value){
                const template = document.createElement("template");
                template.innerHTML = String(value || "");
                template.content.querySelectorAll("script,iframe,object,embed,form,input,button,style,link,meta").forEach(function(node){ node.remove(); });
                template.content.querySelectorAll("*").forEach(function(element){
                    Array.from(element.attributes).forEach(function(attribute){
                        if(/^on/i.test(attribute.name) || /^javascript:/i.test(attribute.value)) element.removeAttribute(attribute.name);
                    });
                });
                return template.innerHTML;
            };
            function recordFor(page){
                if(!page) return null;
                const records = dual.state.pages;
                const record = records[page.id] || (records[page.id] = {html:"",settings:{},options:[]});
                if(!Array.isArray(record.options)) record.options = [];
                if(!record.settings) record.settings = {};
                return record;
            }
            function settingsFor(record){
                return Object.assign({}, dual.state.settings, record && record.settings || {});
            }

            /* HTML 專用分歧：選項文字獨立，target 仍指向共用 node id。 */
            const ownOptions = document.createElement("section");
            ownOptions.id = "htmlOwnOptions";
            ownOptions.innerHTML =
                '<h4>HTML 分歧選項</h4>' +
                '<p class="html-option-note">只影響 HTML 閱讀版；可保持未設定、建立新頁面，或指定流程畫布上的既有 node。</p>' +
                '<div id="htmlOptionRows"></div>' +
                '<button type="button" id="addHtmlOption">＋ 新增 HTML 選項</button>';
            const choiceSettings = document.getElementById("htmlChoiceSettings");
            htmlWorkspace.insertBefore(ownOptions, choiceSettings || document.getElementById("htmlIntegratedPreview"));
            const rows = ownOptions.querySelector("#htmlOptionRows");

            function pageChoices(selectedId){
                const options = [
                    '<option value="">未設定</option>',
                    '<option value="__create_new__">＋ 建立新頁面</option>'
                ];
                core.pages.forEach(function(page, index){
                    options.push(
                        '<option value="' + escapeHtml(page.id) + '"' +
                        (page.id === selectedId ? " selected" : "") + ">" +
                        (index + 1) + "｜" + escapeHtml(page.title || "未命名 node") +
                        "</option>"
                    );
                });
                return options.join("");
            }
            function saveOwnOptions(){
                const page = core.currentPage;
                const record = recordFor(page);
                if(!record) return;
                record.options = Array.from(rows.querySelectorAll(".html-option-row")).map(function(row){
                    return {
                        text: row.querySelector("input").value,
                        target: row.querySelector("select").value || null
                    };
                });
                dual.renderHtml();
                if(core.notifyChange) core.notifyChange("html-options");
            }
            function renderOwnOptions(){
                const record = recordFor(core.currentPage);
                rows.innerHTML = "";
                if(!record) return;
                record.options.forEach(function(option){
                    const row = document.createElement("div");
                    row.className = "html-option-row";
                    row.innerHTML =
                        '<input type="text" aria-label="HTML 選項文字" placeholder="選項文字" value="' + escapeHtml(option.text || "") + '">' +
                        '<select aria-label="HTML 選項目標">' + pageChoices(option.target) + '</select>' +
                        '<button type="button" aria-label="刪除 HTML 選項">刪除</button>';
                    row.querySelector("input").addEventListener("input", saveOwnOptions);
                    row.querySelector("select").addEventListener("change", function(event){
                        if(event.target.value !== "__create_new__"){
                            saveOwnOptions();
                            return;
                        }
                        const sourcePage = core.currentPage;
                        const sourceRecord = recordFor(sourcePage);
                        const rowIndex = Array.from(rows.querySelectorAll(".html-option-row")).indexOf(row);
                        const newPage = core.createPage({
                            title:"HTML 新頁面",
                            text:"",
                            x:Math.max(0, Number(sourcePage.x || 100) + 280),
                            y:Math.max(0, Number(sourcePage.y || 100) + Math.max(0,rowIndex) * 120)
                        }, {select:false});
                        recordFor(newPage);
                        event.target.innerHTML = pageChoices(newPage.id);
                        event.target.value = newPage.id;
                        if(sourceRecord) saveOwnOptions();
                    });
                    row.querySelector("button").addEventListener("click", function(){
                        row.remove();
                        saveOwnOptions();
                    });
                    rows.appendChild(row);
                });
                dual.renderHtml();
            }
            ownOptions.querySelector("#addHtmlOption").addEventListener("click", function(){
                const record = recordFor(core.currentPage);
                if(!record) return;
                record.options.push({text:"新選項",target:null});
                renderOwnOptions();
                saveOwnOptions();
            });

            function pixivTextToHtml(text){
                let raw = escapeHtml(window.PixivImageAssets ? window.PixivImageAssets.expand(text || "") : (text || ""));
                raw = raw.replace(/\[(?:noback|nosave)\]/gi,"")
                    .replace(/\[savepoint:[^\]]*\]/gi,"");
                raw = raw.replace(/\[chapter:([^\]]*)\]/gi,"<h2>$1</h2>")
                    .replace(/\[h1:(.*?)\]/gis,"<h1>$1</h1>")
                    .replace(/\[h2:(.*?)\]/gis,"<h2>$1</h2>")
                    .replace(/\[h3:(.*?)\]/gis,"<h3>$1</h3>")
                    .replace(/\[h4:(.*?)\]/gis,"<h4>$1</h4>")
                    .replace(/\[b:(.*?)\]/gis,"<strong>$1</strong>")
                    .replace(/\[i:(.*?)\]/gis,"<em>$1</em>")
                    .replace(/\[u:(.*?)\]/gis,"<u>$1</u>")
                    .replace(/\[s:(.*?)\]/gis,"<del>$1</del>")
                    .replace(/\[b\]([\s\S]*?)\[\/b\]/gi,"<strong>$1</strong>")
                    .replace(/\[i\]([\s\S]*?)\[\/i\]/gi,"<em>$1</em>")
                    .replace(/\[u\]([\s\S]*?)\[\/u\]/gi,"<u>$1</u>")
                    .replace(/\[s\]([\s\S]*?)\[\/s\]/gi,"<del>$1</del>")
                    .replace(/\[color:([^:\]]+):(.*?)\]/gis,'<span style="color:$1">$2</span>')
                    .replace(/\[size:(\d+):(.*?)\]/gis,'<span style="font-size:$1px">$2</span>')
                    .replace(/\[quote:([\s\S]*?)\]/gi,"<blockquote>$1</blockquote>")
                    .replace(/\[hr\]/gi,"<hr>")
                    .replace(/\[list\]([\s\S]*?)\[\/list\]/gi,function(_,content){return "<ul>"+content.trim().split(/\n/).filter(Boolean).map(function(item){return "<li>"+item.replace(/^[-*]\s*/,"")+"</li>";}).join("")+"</ul>";})
                    .replace(/\[olist\]([\s\S]*?)\[\/olist\]/gi,function(_,content){return "<ol>"+content.trim().split(/\n/).filter(Boolean).map(function(item){return "<li>"+item.replace(/^\d+[.)]\s*/,"")+"</li>";}).join("")+"</ol>";})
                    .replace(/\[ruby:([^|\]]+)\|([^\]]+)\]/gi,"<ruby>$1<rt>$2</rt></ruby>")
                    .replace(/\[\[rb:([^>\]]+)\s*&gt;\s*([^\]]+)\]\]/gi,"<ruby>$1<rt>$2</rt></ruby>")
                    .replace(/\[link:([^|\]]+)\|([^\]]+)\]/gi,'<a href="$2" target="_blank" rel="noopener">$1</a>')
                    .replace(/\[\[jumpuri:([^>\]]+)\s*&gt;\s*([^\]]+)\]\]/gi,'<a href="$2" target="_blank" rel="noopener">$1</a>')
                    .replace(/\[img:([^\]]+)\]/gi,'<img src="$1" alt="">')
                    .replace(/\[pixivimage:(\d+)(?:-(\d+))?\]/gi,"<p>Pixiv 圖片作品 $1</p>")
                    .replace(/\[(?:jump|next):(\d+)\]/gi,function(_,number){
                        const target = core.getPageByNumber(Number(number));
                        return target
                            ? '<button type="button" class="choice choice-link manual-jump" data-target="' + escapeHtml(target.id) + '">前往第 ' + Number(number) + ' 頁</button>'
                            : '<span>找不到第 ' + Number(number) + ' 頁</span>';
                    })
                    .replace(/\[newpage\]/gi,"<hr>");
                return raw.split(/\n{2,}/).map(function(part){
                    return part.trim() ? "<p>" + part.replace(/\n/g,"<br>") + "</p>" : "";
                }).join("");
            }
            function readerRules(raw){
                const value = String(raw || "");
                const point = value.match(/\[savepoint:([^\]]*)\]/i);
                return {
                    noBack:/\[noback\]/i.test(value),
                    noSave:/\[nosave\]/i.test(value),
                    savePoint:point ? (point[1].trim() || "自動存檔點") : ""
                };
            }
            function stripReaderTags(raw){
                return String(raw || "")
                    .replace(/\[(?:noback|nosave)\]/gi,"")
                    .replace(/\[savepoint:[^\]]*\]/gi,"");
            }
            function serializedReaderData(mode){
                return core.pages.map(function(page){
                    if(mode === "pixiv"){
                        return {
                            id:page.id,
                            title:page.title || "",
                            content:pixivTextToHtml(page.text || ""),
                            rules:readerRules(page.text || ""),
                            settings:{fontSize:16,lineHeight:2,color:"#222222",background:"#ffffff",choiceStyle:"link",choiceColor:"#222222",choiceBackground:"#ffffff",choiceRadius:0},
                            options:(page.options || []).map(function(option){ return {text:option.text || "",target:option.target || null}; })
                        };
                    }
                    const record = recordFor(page);
                    return {
                        id:page.id,
                        title:page.title || "",
                        content:stripReaderTags(cleanHtml(record.html || "")),
                        rules:readerRules(record.html || ""),
                        settings:settingsFor(record),
                        options:(record.options || []).map(function(option){ return {text:option.text || "",target:option.target || null}; })
                    };
                });
            }
            function buildReader(mode){
                const data = JSON.stringify(serializedReaderData(mode)).replace(/</g,"\\u003c");
                const title = mode === "pixiv" ? "Pixiv 測試閱讀" : "HTML 測試閱讀";
                let storyHash = 0;
                for(let i=0;i<data.length;i++) storyHash = ((storyHash << 5) - storyHash + data.charCodeAt(i)) | 0;
                const storageKey = "firehaha_reader_" + mode + "_" + Math.abs(storyHash);
                return '<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">' +
                    '<meta name="viewport" content="width=device-width,initial-scale=1"><title>' + title + '</title>' +
                    '<style>' +
                    '*{box-sizing:border-box}body{margin:0;padding:28px;background:#eef2f6;font-family:system-ui,-apple-system,\"Segoe UI\",sans-serif;color:#222}' +
                    '#reader{max-width:760px;min-height:420px;margin:auto;padding:38px 44px;background:#fff;border-radius:16px;box-shadow:0 12px 35px rgba(20,35,50,.12)}' +
                    'h1{font-size:26px;margin:0 0 26px}.content img{max-width:100%;height:auto}.content p{margin:0 0 1.35em}.choices{display:flex;flex-direction:column;align-items:flex-start;gap:10px;margin-top:30px}' +
                    '.choice{font:inherit;cursor:pointer}.choice-link{padding:4px 0;border:0;border-bottom:1px solid currentColor;background:transparent}.choice-button{padding:11px 18px;border:1px solid currentColor}.choice-card{width:100%;padding:15px 18px;text-align:left;border:1px solid #d3dde6;box-shadow:0 4px 12px rgba(0,0,0,.07)}' +
                    '.end{margin-top:30px;color:#748292;font-size:13px}.back{margin-top:24px;padding:8px 12px;border:1px solid #ccd7e0;border-radius:8px;background:#fff;cursor:pointer}' +

<script id="html-node-connections">
(function(){
    "use strict";
    function ready(fn){
        if(document.readyState === "loading"){
            document.addEventListener("DOMContentLoaded", fn, {once:true});
        }else{
            fn();
        }
    }
    ready(function(){
        function initialize(){
            if(!window.GamebookCore || !window.DualFormatWorkspace){
                setTimeout(initialize,120);
                return;
            }
            const core = window.GamebookCore;
            const dual = window.DualFormatWorkspace;
            const panel = document.getElementById("flowPanel");
            const flowCanvas = document.getElementById("flowCanvas");
            const baseCanvas = document.getElementById("linesCanvas");
            const htmlWorkspace = document.getElementById("htmlWorkspace");
            if(!panel || !flowCanvas || !baseCanvas || !htmlWorkspace || document.getElementById("htmlLinesCanvas")) return;

            const canvas = document.createElement("canvas");
            canvas.id = "htmlLinesCanvas";
            canvas.setAttribute("aria-hidden","true");
            baseCanvas.parentNode.insertBefore(canvas,flowCanvas);

            const legend = document.createElement("div");
            legend.className = "html-connection-legend";
            legend.textContent = "藍色虛線：HTML 分歧";
            panel.parentNode.insertBefore(legend,panel.nextSibling);

            let frame = 0;
            let lastDrawAt = 0;
            function isHtmlMode(){
                return htmlWorkspace.classList.contains("active");
            }
            function arrow(ctx,x1,y1,x2,y2){
                const angle = Math.atan2(y2-y1,x2-x1);
                const size = 8;
                ctx.beginPath();
                ctx.moveTo(x2,y2);
                ctx.lineTo(x2-Math.cos(angle-.55)*size,y2-Math.sin(angle-.55)*size);
                ctx.lineTo(x2-Math.cos(angle+.55)*size,y2-Math.sin(angle+.55)*size);
                ctx.closePath();
                ctx.fill();
            }
            function draw(){
                frame = 0;
                const active = isHtmlMode();
                canvas.classList.toggle("active",active);
                legend.classList.toggle("active",active);
                panel.classList.toggle("html-connection-mode",active);

                if(!active){
                    const hiddenContext = canvas.getContext("2d");
                    hiddenContext.clearRect(0,0,canvas.width,canvas.height);
                    return;
                }

                let width = Math.max(flowCanvas.clientWidth,1200);
                let height = Math.max(flowCanvas.clientHeight,1000);
                core.pages.forEach(function(page){
                    width = Math.max(width,Number(page.x || 0) + 320);
                    height = Math.max(height,Number(page.y || 0) + 220);
                });
                width = Math.ceil(width);
                height = Math.ceil(height);
                if(canvas.width !== width) canvas.width = width;
                if(canvas.height !== height) canvas.height = height;
                const ctx = canvas.getContext("2d");
                ctx.clearRect(0,0,width,height);

                ctx.lineWidth = 3;
                ctx.strokeStyle = "#1976d2";
                ctx.fillStyle = "#1976d2";
                ctx.setLineDash([9,6]);

                core.pages.forEach(function(page){
                    const record = dual.state.pages[page.id];
                    const options = record && Array.isArray(record.options) ? record.options : [];
                    options.forEach(function(option){
                        if(!option || !option.target) return;
                        const target = core.getPageById(option.target);
                        if(!target) return;
                        const x1 = Number(page.x || 0) + 140;
                        const y1 = Number(page.y || 0) + 28;
                        const x2 = Number(target.x || 0);
                        const y2 = Number(target.y || 0) + 28;
                        const bend = Math.max(70,Math.abs(x2-x1)*.45);

                        ctx.beginPath();
                        ctx.moveTo(x1,y1);
                        ctx.bezierCurveTo(x1+bend,y1,x2-bend,y2,x2,y2);
                        ctx.stroke();

                        ctx.save();
                        ctx.setLineDash([]);
                        arrow(ctx,x2-bend*.12,y2,x2,y2);
                        ctx.restore();
                    });
                });
                ctx.setLineDash([]);
            }
            function schedule(force){
                if(!isHtmlMode() && !canvas.classList.contains("active") && force !== true) return;
                if(frame) return;
                const wait = Math.max(0,40 - (performance.now() - lastDrawAt));
                frame = setTimeout(function(){
                    frame = 0;
                    lastDrawAt = performance.now();
                    draw();
                },wait);
            }

            flowCanvas.addEventListener("pointerup",function(){ schedule(true); },{passive:true});
            document.getElementById("formatModeTabs").addEventListener("click",function(){ setTimeout(function(){ schedule(true); },0); });
            window.addEventListener("resize",function(){ schedule(true); },{passive:true});
            const observer = new MutationObserver(schedule);
            observer.observe(flowCanvas,{childList:true,subtree:true,attributes:true,attributeFilter:["style","class"]});

            const originalRenderOptions = window.SeparatedFormatReaders && window.SeparatedFormatReaders.renderOptions;
            if(window.SeparatedFormatReaders){
                window.SeparatedFormatReaders.drawHtmlConnections = schedule;
                if(originalRenderOptions){
                    window.SeparatedFormatReaders.renderOptions = function(){
                        const result = originalRenderOptions.apply(this,arguments);
                        schedule();
                        return result;
                    };
                }
            }
            setInterval(function(){ schedule(false); },900);
            schedule(true);
        }
        initialize();
    });
})();
</script>

<script id="professional-project-manager">
(function(){
    "use strict";
    function ready(fn){
        if(document.readyState === "loading") document.addEventListener("DOMContentLoaded",fn,{once:true});
        else fn();
    }
    ready(function(){
        const LIB_KEY = "PixivNovelLibrary_V2";
        let selectedId = null;
        let query = "";
        let mode = "all";

        function readLibrary(){
            try{
                const value = JSON.parse(safeStorage.getItem(LIB_KEY) || "[]");
                return Array.isArray(value) ? value : [];
            }catch(e){ return []; }
        }
        function writeLibrary(value){
            safeStorage.setItem(LIB_KEY,JSON.stringify(value));
        }
        function esc(value){
            return String(value == null ? "" : value).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
        }
        function stats(project){
            const pages = project && project.data && Array.isArray(project.data.pages) ? project.data.pages : [];
            const chars = pages.reduce(function(total,page){ return total + String(page.text || "").length; },0);
            const choices = pages.reduce(function(total,page){ return total + (Array.isArray(page.options) ? page.options.length : 0); },0);
            return {pages:pages.length,chars:chars,choices:choices};
        }
        function freshPage(name){
            return {id:crypto.randomUUID(),title:name || "開始頁面",text:"",note:"",options:[],x:100,y:100};
        }
        function createWindow(){
            if(document.getElementById("proProjectManager")) return;
            const modal = document.createElement("div");
            modal.id = "proProjectManager";
            modal.innerHTML =
                '<section class="ppm-window" role="dialog" aria-modal="true" aria-labelledby="ppmTitle">' +
                '<header class="ppm-titlebar"><div class="ppm-app-icon">✦</div><div class="ppm-title-copy"><h2 id="ppmTitle">Pixiv 小說專案</h2><p>管理作品、版本與本機專案庫</p></div><div class="ppm-window-controls"><button type="button" id="ppmClose" aria-label="關閉">✕</button></div></header>' +
                '<div class="ppm-body">' +
                '<aside class="ppm-sidebar"><span class="ppm-sidebar-label">建立作品</span><div class="ppm-new-box"><input id="ppmNewName" type="text" placeholder="新作品名稱"><button id="ppmCreate" type="button">＋ 建立專案</button></div>' +
                '<span class="ppm-sidebar-label">專案庫</span><button type="button" class="ppm-side-action active" data-filter="all">▦ 所有作品</button><button type="button" class="ppm-side-action" data-filter="active">● 目前開啟</button><button type="button" class="ppm-side-action" id="ppmImport">⇧ 匯入 JSON</button><input id="ppmImportFile" type="file" accept=".json,application/json" hidden>' +
                '<div class="ppm-storage-note">作品儲存在這台裝置的瀏覽器中。建議定期匯出 JSON 作為備份。</div></aside>' +
                '<main class="ppm-center"><div class="ppm-toolbar"><input class="ppm-search" id="ppmSearch" type="search" placeholder="搜尋作品名稱…"><span class="ppm-count" id="ppmCount"></span></div><div class="ppm-project-list" id="ppmList"></div></main>' +
                '<aside class="ppm-detail" id="ppmDetail"><div class="ppm-detail-empty" id="ppmDetailEmpty">選擇一個作品<br>查看詳細資訊與操作</div><div class="ppm-detail-content" id="ppmDetailContent">' +
                '<h3 id="ppmDetailName"></h3><div class="ppm-detail-id" id="ppmDetailId"></div><div class="ppm-stats"><div class="ppm-stat"><strong id="ppmPages">0</strong><span>頁面</span></div><div class="ppm-stat"><strong id="ppmChars">0</strong><span>Pixiv 字數</span></div><div class="ppm-stat"><strong id="ppmChoices">0</strong><span>分歧選項</span></div><div class="ppm-stat"><strong id="ppmNotes">0</strong><span>便利貼</span></div></div>' +
                '<label class="ppm-field-label" for="ppmRename">作品名稱</label><div class="ppm-rename-row"><input id="ppmRename" type="text"><button id="ppmRenameSave" type="button">儲存</button></div>' +
                '<div class="ppm-detail-actions"><button class="ppm-open" id="ppmOpen" type="button">開啟作品</button><button id="ppmDuplicate" type="button">建立副本</button><button id="ppmExport" type="button">匯出 JSON</button></div></div>' +
                '<div class="ppm-danger"><button class="ppm-delete" id="ppmDelete" type="button">刪除作品</button></div></aside>' +
                '</div></section>';
            document.body.appendChild(modal);
            if(!document.getElementById("project-manager-modal")){
                const legacyModalShim=document.createElement("div");
                legacyModalShim.id="project-manager-modal";
                legacyModalShim.style.display="none";
                document.body.appendChild(legacyModalShim);
            }

            modal.querySelector("#ppmClose").onclick = close;
            modal.addEventListener("mousedown",function(event){ if(event.target === modal) close(); });
            modal.querySelector("#ppmSearch").addEventListener("input",function(event){ query=event.target.value.trim().toLowerCase();render(); });
            modal.querySelectorAll("[data-filter]").forEach(function(button){
                button.onclick=function(){
                    mode=button.dataset.filter;
                    modal.querySelectorAll("[data-filter]").forEach(function(item){item.classList.toggle("active",item===button);});
                    render();
                };
            });
            modal.querySelector("#ppmCreate").onclick = createProject;
            modal.querySelector("#ppmNewName").addEventListener("keydown",function(event){ if(event.key==="Enter")createProject(); });
            modal.querySelector("#ppmOpen").onclick = openSelected;
            modal.querySelector("#ppmRenameSave").onclick = renameSelected;
            modal.querySelector("#ppmDuplicate").onclick = duplicateSelected;
            modal.querySelector("#ppmDelete").onclick = deleteSelected;
            modal.querySelector("#ppmExport").onclick = exportSelected;
            modal.querySelector("#ppmImport").onclick = function(){ modal.querySelector("#ppmImportFile").click(); };
            modal.querySelector("#ppmImportFile").addEventListener("change",importProject);
            document.addEventListener("keydown",function(event){if(event.key==="Escape"&&modal.classList.contains("open"))close();});
        }
        function currentProject(){
            return readLibrary().find(function(project){return project.id===selectedId;}) || null;
        }
        function render(){
            const modal = document.getElementById("proProjectManager");
            if(!modal) return;
            const activeId = window.state && window.state.currentTab;
            let db = readLibrary();
            if(mode === "active") db = db.filter(function(project){return project.id===activeId;});
            if(query) db = db.filter(function(project){return String(project.name||"").toLowerCase().includes(query);});
            modal.querySelector("#ppmCount").textContent = db.length + " 個作品";
            const list = modal.querySelector("#ppmList");
            list.innerHTML = "";
            if(!db.length){
                list.innerHTML = '<div class="ppm-empty">📚<br>目前沒有符合條件的作品</div>';
            }
            db.forEach(function(project){
                const info = stats(project);
                const row = document.createElement("article");
                row.className = "ppm-project-row" + (project.id===selectedId ? " selected" : "");
                row.dataset.id = project.id;
                row.innerHTML = '<div class="ppm-project-icon">📖</div><div><span class="ppm-project-name">'+esc(project.name||"未命名作品")+'</span><div class="ppm-project-meta">'+info.pages+' 頁・'+info.chars.toLocaleString()+' 字・'+info.choices+' 個分歧</div></div>'+(project.id===activeId?'<span class="ppm-active-badge">開啟中</span>':'');
                row.onclick=function(){selectedId=project.id;render();showDetail();};
                row.ondblclick=openSelected;
                list.appendChild(row);
            });
            if(selectedId && !readLibrary().some(function(project){return project.id===selectedId;})) selectedId=null;
            showDetail();
        }
        function showDetail(){
            const modal=document.getElementById("proProjectManager"),project=currentProject();
            const empty=modal.querySelector("#ppmDetailEmpty"),content=modal.querySelector("#ppmDetailContent"),danger=modal.querySelector(".ppm-danger");
            empty.style.display=project?"none":"block";
            content.classList.toggle("visible",!!project);
            danger.style.display=project?"block":"none";
            modal.querySelector("#ppmDetail").classList.toggle("mobile-open",!!project);
            if(!project)return;
            const info=stats(project);
            modal.querySelector("#ppmDetailName").textContent=project.name||"未命名作品";
            modal.querySelector("#ppmDetailId").textContent=project.id;
            modal.querySelector("#ppmPages").textContent=info.pages.toLocaleString();
            modal.querySelector("#ppmChars").textContent=info.chars.toLocaleString();
            modal.querySelector("#ppmChoices").textContent=info.choices.toLocaleString();
            modal.querySelector("#ppmNotes").textContent=((project.data&&project.data.notes)||[]).length.toLocaleString();
            modal.querySelector("#ppmRename").value=project.name||"";
        }
        function createProject(){
            const input=document.getElementById("ppmNewName");
            const name=(input.value||"").trim()||"未命名作品";
            const now=new Date().toISOString();const project={id:crypto.randomUUID(),name:name,createdAt:now,updatedAt:now,data:{pages:[freshPage(name)],notes:[],drawings:[]}};
            const db=readLibrary();db.push(project);writeLibrary(db);selectedId=project.id;input.value="";render();
        }
        function openSelected(){
            const db=readLibrary(),index=db.findIndex(function(project){return project.id===selectedId;});
            if(index<0)return;
            if(typeof window.loadProject==="function")window.loadProject(index);
            close();
        }
        function renameSelected(){
            const name=(document.getElementById("ppmRename").value||"").trim();
            if(!name){alert("作品名稱不能為空。");return;}
            const db=readLibrary(),project=db.find(function(item){return item.id===selectedId;});
            if(!project)return;project.name=name;project.updatedAt=new Date().toISOString();writeLibrary(db);render();
        }
        function duplicateSelected(){
            const project=currentProject();if(!project)return;
            const copy=JSON.parse(JSON.stringify(project));const now=new Date().toISOString();copy.id=crypto.randomUUID();copy.name=(project.name||"未命名作品")+"（副本）";copy.createdAt=now;copy.updatedAt=now;
            const db=readLibrary();db.push(copy);writeLibrary(db);selectedId=copy.id;render();
        }
        async function deleteSelected(){
            const project=currentProject();if(!project)return;
            if(!confirm("確定要永久刪除「"+(project.name||"未命名作品")+"」嗎？此操作無法復原。"))return;
            if(window.IndexedProjectSystem&&typeof IndexedProjectSystem.deleteProject==="function"){
                await IndexedProjectSystem.deleteProject(selectedId);
            }else{
                const db=readLibrary().filter(function(item){return item.id!==selectedId;});writeLibrary(db);
            }
            selectedId=null;render();
        }
        function exportSelected(){
            const project=currentProject();if(!project)return;
            const url=URL.createObjectURL(new Blob([JSON.stringify(project,null,2)],{type:"application/json;charset=utf-8"}));
            const link=document.createElement("a");link.href=url;link.download=(project.name||"pixiv-project").replace(/[\\\\/:*?\"<>|]/g,"_")+".json";link.click();setTimeout(function(){URL.revokeObjectURL(url);},1000);
        }
        function importProject(event){
            const file=event.target.files&&event.target.files[0];if(!file)return;
            const reader=new FileReader();
            reader.onload=function(){
                try{
                    const value=JSON.parse(String(reader.result||""));
                    const project=value&&value.data?value:{id:crypto.randomUUID(),name:file.name.replace(/\\.json$/i,""),data:value};
                    const now=new Date().toISOString();project.id=crypto.randomUUID();project.name=project.name||"匯入作品";project.createdAt=now;project.updatedAt=now;
                    if(!project.data||!Array.isArray(project.data.pages))throw new Error("缺少 pages");
                    const db=readLibrary();db.push(project);writeLibrary(db);selectedId=project.id;render();
                }catch(e){alert("無法匯入：這不是有效的專案 JSON。");}
            };
            reader.readAsText(file);event.target.value="";
        }
        function open(){
            createWindow();
            const modal=document.getElementById("proProjectManager");
            modal.classList.add("open");
            selectedId=(window.state&&window.state.currentTab)||readLibrary()[0]?.id||null;
            query="";mode="all";
            modal.querySelector("#ppmSearch").value="";
            modal.querySelectorAll("[data-filter]").forEach(function(item){item.classList.toggle("active",item.dataset.filter==="all");});
            render();
            setTimeout(function(){modal.querySelector("#ppmSearch").focus();},0);
        }
        function close(){
            const modal=document.getElementById("proProjectManager");
            if(modal)modal.classList.remove("open");
        }
        createWindow();
        window.openProjectSelector=open;
        window.ProfessionalProjectManager={open:open,close:close,render:render};
    });
})();
</script>

<script id="professional-command-header">
(function(){
    "use strict";
    function ready(fn){
        if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",fn,{once:true});
        else fn();
    }
    ready(function(){
        function organize(){
            const header=document.querySelector(".pixiv-editor-app > header");
            if(!header||header.classList.contains("pro-command-header"))return;
            header.classList.add("pro-command-header");

            const originalChildren=Array.from(header.children);
            const main=header.querySelector(":scope > .header-main");
            const allItems=[];
            originalChildren.forEach(function(child){
                if(child===main)return;
                if(child.classList.contains("header-group")){
                    Array.from(child.children).forEach(function(item){allItems.push(item);});
                    child.remove();
                }else{
                    allItems.push(child);
                }
            });

            const chapterButtons=allItems.filter(function(item){
                return item.tagName==="BUTTON"&&(item.textContent||"").replace(/\s+/g,"")==="Chapter設定";
            });
            chapterButtons.slice(0,-1).forEach(function(button){button.classList.add("pro-hidden-duplicate");});

            const top=document.createElement("div");
            top.className="pro-header-top";
            const primary=document.createElement("div");
            primary.className="pro-primary-actions";
            if(main)top.appendChild(main);
            top.appendChild(primary);

            const ribbon=document.createElement("div");
            ribbon.className="pro-ribbon";
            function group(label,className){
                const box=document.createElement("section");
                box.className="pro-tool-group "+className;
                const caption=document.createElement("span");
                caption.className="pro-group-label";
                caption.textContent=label;
                box.appendChild(caption);
                ribbon.appendChild(box);
                return box;
            }
            const work=group("作品","pro-work-group");
            const node=group("NODE","pro-node-group");
            const chapter=group("章節與語言","pro-chapter-group");
            const moreGroup=group("進階","pro-more-group");
            const more=document.createElement("div");
            more.className="pro-more";
            more.innerHTML='<button type="button" class="pro-more-summary">更多工具</button>';
            moreGroup.insertBefore(more,moreGroup.querySelector(".pro-group-label"));
            const morePanel=document.createElement("section");
            morePanel.className="pro-more-panel pro-floating-tools";
            morePanel.innerHTML='<div class="pro-floating-titlebar"><strong>更多工具</strong><button type="button" class="pro-floating-close" aria-label="關閉">✕</button></div>';
            document.body.appendChild(morePanel);

            function place(item,target){
                if(item&&!item.classList.contains("pro-hidden-duplicate"))target.insertBefore(item,target.querySelector(".pro-group-label")||null);
            }
            allItems.forEach(function(item){
                const id=item.id||"";
                const text=(item.textContent||"").replace(/\s+/g,"");
                if(id==="addPage"||id==="saveProject"){place(item,primary);return;}
                if(["exportPixiv","authorMoodBtn","txtExportBtn","txtImportBtn"].includes(id)){place(item,work);return;}
                if(["plug-copy","plug-paste","branch-order","plug-branch","btn-toggle-list","auto-page-select"].includes(id)||item.querySelector&&item.querySelector("#btn-toggle-list,#auto-page-select")){place(item,node);return;}
                if(id==="langSelect"||item.getAttribute("data-i18n")==="language"||text==="Chapter設定"){
                    if(item.tagName==="LABEL")item.classList.add("pro-language-label");
                    place(item,chapter);return;
                }
                morePanel.appendChild(item);
            });

            header.replaceChildren(top,ribbon);
            if(!primary.children.length)primary.remove();
            if(work.children.length===1)work.style.display="none";
            if(node.children.length===1)node.style.display="none";
            if(chapter.children.length===1)chapter.style.display="none";

            const moreButton=more.querySelector(".pro-more-summary");
            const closeButton=morePanel.querySelector(".pro-floating-close");
            moreButton.addEventListener("click",function(){
                morePanel.classList.toggle("open");
                moreButton.classList.toggle("active",morePanel.classList.contains("open"));
            });
            closeButton.addEventListener("click",function(){
                morePanel.classList.remove("open");
                moreButton.classList.remove("active");
            });
            const handle=morePanel.querySelector(".pro-floating-titlebar");
            handle.addEventListener("pointerdown",function(event){
                if(event.target.closest("button")||window.innerWidth<=560)return;
                event.preventDefault();
                handle.setPointerCapture(event.pointerId);
                const rect=morePanel.getBoundingClientRect();
                const startX=event.clientX,startY=event.clientY,startLeft=rect.left,startTop=rect.top;
                function move(e){
                    const maxLeft=Math.max(8,window.innerWidth-morePanel.offsetWidth-8);
                    const maxTop=Math.max(8,window.innerHeight-morePanel.offsetHeight-8);
                    morePanel.style.left=Math.max(8,Math.min(maxLeft,startLeft+e.clientX-startX))+"px";
                    morePanel.style.top=Math.max(8,Math.min(maxTop,startTop+e.clientY-startY))+"px";
                    morePanel.style.right="auto";
                }
                function end(){
                    handle.removeEventListener("pointermove",move);
                    handle.removeEventListener("pointerup",end);
                    handle.removeEventListener("pointercancel",end);
                }
                handle.addEventListener("pointermove",move);
                handle.addEventListener("pointerup",end);
                handle.addEventListener("pointercancel",end);
            });
        }
        setTimeout(organize,300);
    });
})();
</script>

<script id="target-page-dual-format-controller">
(function(){
    "use strict";
    function initialize(){
        const container=document.getElementById("target-page-editor");
        const pageSelect=document.getElementById("targetPageSelect");
        const editor=document.getElementById("targetPageText");
        const saveButton=document.getElementById("saveTargetPage");
        if(!container||!pageSelect||!editor||!saveButton)return;
        if(document.getElementById("targetPageFormat"))return;

        const row=document.createElement("div");
        row.className="target-format-row";
        row.innerHTML='<label for="targetPageFormat">編輯內容</label><select id="targetPageFormat"><option value="pixiv">Pixiv 正文</option><option value="html">HTML 內容</option></select>';
        pageSelect.closest("div").insertAdjacentElement("afterend",row);
        const formatSelect=row.querySelector("select");

        function selectedPage(){
            const list=window.GamebookCore&&Array.isArray(GamebookCore.pages)
                ? GamebookCore.pages
                : (Array.isArray(window.pages)?window.pages:[]);
            return list.find(page=>String(page.id)===String(pageSelect.value))||null;
        }
        function htmlRecord(pageId,create){
            const dual=window.DualFormatWorkspace;
            if(!dual||!dual.state)return null;
            let record=dual.state.pages[pageId];
            if(!record&&create)record=dual.state.pages[pageId]={html:"",settings:{},options:[]};
            return record||null;
        }
        function sanitizeHtml(value){
            const template=document.createElement("template");
            template.innerHTML=String(value||"");
            template.content.querySelectorAll("script,iframe,object,embed,form,input,button,style,link,meta").forEach(node=>node.remove());
            template.content.querySelectorAll("*").forEach(node=>{
                Array.from(node.attributes).forEach(attribute=>{
                    if(/^on/i.test(attribute.name)||/^javascript:/i.test(attribute.value))node.removeAttribute(attribute.name);
                });
            });
            return template.innerHTML;
        }
        function loadSelected(){
            const page=selectedPage();
            const mode=formatSelect.value;
            container.dataset.targetFormat=mode;
            editor.placeholder=mode==="html"
                ?"此處編輯指定 Page 的 HTML 內容"
                :"此處編輯指定 Page 的 Pixiv 正文";
            if(!page){editor.value="";return}
            if(mode==="html"){
                const record=htmlRecord(page.id,false);
                const value=record&&record.html||"";
                editor.value=window.LocalHtmlAssets?LocalHtmlAssets.compact(value):value;
            }else{
                editor.value=String(page.text||"");
            }
        }

        pageSelect.onchange=loadSelected;
        formatSelect.addEventListener("change",loadSelected);
        saveButton.onclick=function(){
            const page=selectedPage();
            if(!page){alert("請先選擇 Page");return}
            if(formatSelect.value==="html"){
                const record=htmlRecord(page.id,true);
                if(!record){alert("HTML 編輯器尚未完成載入，請稍後再試。");return}
                const expanded=window.LocalHtmlAssets?LocalHtmlAssets.expand(editor.value):editor.value;
                record.html=sanitizeHtml(expanded);
                const current=window.GamebookCore&&GamebookCore.currentPage;
                if(current&&String(current.id)===String(page.id)){
                    DualFormatWorkspace.loadHtml();
                    DualFormatWorkspace.renderHtml();
                }
                if(window.GamebookCore&&GamebookCore.notifyChange)GamebookCore.notifyChange("target-page-html-update");
                projectChanged=true;
                editor.value=window.LocalHtmlAssets?LocalHtmlAssets.compact(record.html):record.html;
                alert("指定 Page 的 HTML 內容已更新");
            }else{
                const value=window.PixivImageAssets?PixivImageAssets.compact(editor.value):editor.value;
                page.text=value;
                const current=window.GamebookCore&&GamebookCore.currentPage;
                if(current&&String(current.id)===String(page.id)){
                    const mainEditor=document.getElementById("pageText");
                    if(mainEditor)mainEditor.value=value;
                    if(window.DualFormatWorkspace)DualFormatWorkspace.renderPixiv();
                }
                if(window.GamebookCore&&GamebookCore.notifyChange)GamebookCore.notifyChange("target-page-pixiv-update");
                projectChanged=true;
                editor.value=value;
                alert("指定 Page 的 Pixiv 正文已更新");
            }
        };
        loadSelected();
    }
    if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",initialize,{once:true});
    else initialize();
})();
</script>

<script id="indexeddb-folder-manager">
(function(){
    "use strict";
    const esc=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
    const formatBytes=value=>{
        const bytes=Math.max(0,Number(value)||0);
        if(bytes<1024)return bytes+" B";
        if(bytes<1024*1024)return (bytes/1024).toFixed(1)+" KB";
        return (bytes/1024/1024).toFixed(2)+" MB";
    };
    function imageBytes(data){const value=String(data||"");const comma=value.indexOf(",");return comma<0?value.length:Math.round((value.length-comma-1)*.75)}
    function initialize(){
        if(document.getElementById("indexedDbFolderModal"))return;
        const header=document.querySelector(".pixiv-editor-app > header")||document.querySelector("header");
        const button=document.createElement("button");
        button.id="indexedDbFolderBtn";button.type="button";button.textContent="🗄️ 本機資料庫";button.title="盤查 IndexedDB 專案與圖片";

        document.body.appendChild(modal);
        let lastReport=null;

        async function refresh(){
            const body=modal.querySelector("#idbFolderBody"),summary=modal.querySelector("#idbFolderSummary"),status=modal.querySelector("#idbFolderStatus");
            body.innerHTML='<div class="idb-folder-empty">正在盤查本機資料…</div>';
            try{
                const inspection=await LocalImageVault.inspect();
                const projects=await LocalImageVault.loadProjectLibrary();
                const estimate=navigator.storage&&navigator.storage.estimate?await navigator.storage.estimate():{};
                const imageTotal=inspection.images.reduce((sum,item)=>sum+imageBytes(item.dataUrl),0);
                const projectRows=projects.map(project=>({
                    id:project.id,name:project.name||"未命名作品",updatedAt:project.updatedAt||"",
                    pages:project.data&&Array.isArray(project.data.pages)?project.data.pages.length:0
                }));
                const imageRows=inspection.images.map(item=>({id:item.id,name:item.name||"未命名圖片",bytes:imageBytes(item.dataUrl),updatedAt:item.updatedAt||0,mime:item.mime||""}));
                const recordRows=inspection.records.filter(item=>item.key!=="project-library").map(item=>({key:item.key,updatedAt:item.updatedAt||item.savedAt||0,type:item.key.startsWith("project:")?"專案快照":item.key==="material-library"?"素材庫索引":"系統紀錄"}));
                lastReport={generatedAt:new Date().toISOString(),database:inspection.database,version:inspection.version,storage:{usage:estimate.usage||0,quota:estimate.quota||0},projects:projectRows,images:imageRows,records:recordRows};
                summary.innerHTML=[
                    ["專案",projects.length+" 個"],["圖片",inspection.images.length+" 張"],["圖片容量",formatBytes(imageTotal)],["瀏覽器空間",formatBytes(estimate.usage||0)+" / "+formatBytes(estimate.quota||0)]
                ].map(item=>'<div class="idb-folder-stat"><strong>'+esc(item[1])+'</strong><span>'+esc(item[0])+'</span></div>').join("");
                const projectTable=projectRows.length?'<table class="idb-folder-table"><thead><tr><th>專案名稱</th><th>頁數</th><th>更新時間</th><th>ID</th></tr></thead><tbody>'+projectRows.map(item=>'<tr><td>'+esc(item.name)+'</td><td>'+item.pages+'</td><td>'+esc(item.updatedAt?new Date(item.updatedAt).toLocaleString():"—")+'</td><td class="idb-folder-id" title="'+esc(item.id)+'">'+esc(item.id)+'</td></tr>').join("")+'</tbody></table>':'<div class="idb-folder-empty">IndexedDB 尚無專案</div>';
                const imageTable=imageRows.length?'<table class="idb-folder-table"><thead><tr><th>圖片名稱</th><th>容量</th><th>格式</th><th>更新時間</th><th>資產 ID</th></tr></thead><tbody>'+imageRows.map(item=>'<tr><td>'+esc(item.name)+'</td><td>'+formatBytes(item.bytes)+'</td><td>'+esc(item.mime||"圖片")+'</td><td>'+esc(item.updatedAt?new Date(item.updatedAt).toLocaleString():"—")+'</td><td class="idb-folder-id" title="'+esc(item.id)+'">'+esc(item.id)+'</td></tr>').join("")+'</tbody></table>':'<div class="idb-folder-empty">IndexedDB 尚無本機圖片</div>';
                const recordTable=recordRows.length?'<table class="idb-folder-table"><thead><tr><th>資料類型</th><th>索引鍵</th><th>更新時間</th></tr></thead><tbody>'+recordRows.map(item=>'<tr><td>'+esc(item.type)+'</td><td class="idb-folder-id" title="'+esc(item.key)+'">'+esc(item.key)+'</td><td>'+esc(item.updatedAt?new Date(item.updatedAt).toLocaleString():"—")+'</td></tr>').join("")+'</tbody></table>':'<div class="idb-folder-empty">尚無其他紀錄</div>';

        };
    }
    if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",initialize,{once:true});else initialize();

<script id="indexeddb-project-system">
(function(){
    "use strict";
    const LIBRARY_KEY="PixivNovelLibrary_V2";
    let initialized=false;
    let activeWatchTimer=0;
    function parseLibrary(raw){
        try{const value=JSON.parse(raw||"[]");return Array.isArray(value)?value:[]}catch(error){return[]}
    }
    function projectTime(project){
        const value=project&&project.updatedAt;
        const time=typeof value==="number"?value:(value?Date.parse(value):0);
        return Number.isFinite(time)?time:0;
    }
    function mergeLibraries(cache,indexed,tombstones){
        const merged=new Map();
        [...(indexed||[]),...(cache||[])].forEach(project=>{
            if(!project||!project.id)return;
            const deletedAt=Number(tombstones&&tombstones[project.id])||0;
            if(deletedAt&&deletedAt>=projectTime(project))return;
            const current=merged.get(project.id);
            if(!current||projectTime(project)>=projectTime(current))merged.set(project.id,project);
        });
        return Array.from(merged.values()).sort((a,b)=>projectTime(b)-projectTime(a));
    }
    async function initialize(){
        if(initialized||!window.LocalImageVault||!window.safeStorage||!window.ProjectDataCenter)return;
        initialized=true;
        const originalGet=safeStorage.getItem.bind(safeStorage);
        const originalSet=safeStorage.setItem.bind(safeStorage);
        const originalRemove=safeStorage.removeItem.bind(safeStorage);
        try{
            const cached=parseLibrary(originalGet(LIBRARY_KEY));
            const indexed=await LocalImageVault.loadProjectLibrary();
            const tombstones=await LocalImageVault.loadProjectTombstones();
            const merged=mergeLibraries(cached,indexed,tombstones);
            originalSet(LIBRARY_KEY,JSON.stringify(merged));
            await LocalImageVault.saveProjectLibrary(merged);

            const indexedActive=await LocalImageVault.loadActiveProjectId();
            const currentActive=window.state&&window.state.currentTab;
            const activeId=(currentActive&&merged.some(project=>project.id===currentActive))
                ? currentActive
                : (indexedActive&&merged.some(project=>project.id===indexedActive)?indexedActive:null);
            if(activeId){
                window.state=window.state||{};
                window.state.currentTab=activeId;
                const activeProject=merged.find(project=>project.id===activeId);
                if(activeProject&&activeProject.data){
                    ProjectDataCenter.loadProjectData(activeProject.data,{source:"indexeddb-project-startup",resetMissing:true});
                    if(typeof window.unlockEditor==="function")window.unlockEditor();
                }
            }else{
                window.state=window.state||{};
                window.state.currentTab=null;
                await LocalImageVault.saveActiveProjectId(null);
            }

            safeStorage.setItem=function(key,value){
                const previous=key===LIBRARY_KEY?parseLibrary(originalGet(key)):[];
                originalSet(key,value);
                if(key===LIBRARY_KEY){
                    const projects=parseLibrary(value);
                    const nextIds=new Set(projects.filter(Boolean).map(project=>project.id));
                    const removed=previous.filter(project=>project&&project.id&&!nextIds.has(project.id)).map(project=>project.id);
                    removed.forEach(id=>LocalImageVault.deleteProjectArtifacts(id).catch(()=>{}));
                    const currentId=window.state&&window.state.currentTab;
                    if(currentId&&removed.includes(currentId)){
                        window.state.currentTab=null;
                        LocalImageVault.saveActiveProjectId(null).catch(()=>{});
                    }
                    LocalImageVault.saveProjectLibrary(projects).catch(error=>console.warn("IndexedDB 專案同步失敗",error));
                }
            };
            safeStorage.removeItem=function(key){
                originalRemove(key);
                if(key===LIBRARY_KEY)LocalImageVault.saveProjectLibrary([]).catch(()=>{});
            };
            safeStorage.getItem=function(key){
                return originalGet(key);
            };

            let lastActive=activeId||null;
            activeWatchTimer=window.setInterval(()=>{
                const next=window.state&&window.state.currentTab||null;
                if(next===lastActive)return;
                lastActive=next;
                LocalImageVault.saveActiveProjectId(next).catch(()=>{});
            },500);
            await LocalImageVault.saveActiveProjectId(lastActive);
            window.IndexedProjectSystem={
                ready:true,
                async list(){return LocalImageVault.loadProjectLibrary()},
                async sync(){
                    const library=parseLibrary(originalGet(LIBRARY_KEY));
                    await LocalImageVault.saveProjectLibrary(library);
                    return library;
                },
                async deleteProject(id){
                    const library=parseLibrary(originalGet(LIBRARY_KEY)).filter(project=>project&&project.id!==id);
                    originalSet(LIBRARY_KEY,JSON.stringify(library));
                    await LocalImageVault.saveProjectLibrary(library);
                    await LocalImageVault.deleteProjectArtifacts(id);
                    if(window.state&&window.state.currentTab===id)window.state.currentTab=null;
                    await LocalImageVault.saveActiveProjectId(window.state&&window.state.currentTab||null);
                    return true;
                }
            };
            document.dispatchEvent(new CustomEvent("indexed-project-system-ready",{detail:{count:merged.length,activeId}}));
        }catch(error){
            initialized=false;
            console.error("IndexedDB 專案系統啟動失敗",error);
        }
    }
    if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",()=>setTimeout(initialize,120),{once:true});
    else setTimeout(initialize,120);
})();
</script>

<script id="indexeddb-image-recovery">
(function(){
    "use strict";
    async function hydrateHtmlImages(){
        if(!window.LocalImageVault||!window.DualFormatWorkspace)return;
        const records=DualFormatWorkspace.state.pages||{};
        let changed=false;
        for(const pageId of Object.keys(records)){
            const record=records[pageId];
            if(!record||!record.html||!record.html.includes("data-local-vault"))continue;
            const template=document.createElement("template");
            template.innerHTML=record.html;
            const images=Array.from(template.content.querySelectorAll("img[data-local-vault]"));
            for(const image of images){
                const id=image.dataset.localVault;
                const source=image.getAttribute("src")||"";
                const unresolved=!source||source.startsWith("local-image://");
                if(!unresolved)continue;
                const data=await LocalImageVault.getImage(id);
                if(data){image.setAttribute("src",data);changed=true}
            }
            record.html=template.innerHTML;
        }
        if(changed){
            DualFormatWorkspace.loadHtml();
            DualFormatWorkspace.renderHtml();
        }
    }
    async function recover(){
        if(!window.LocalImageVault||!window.ProjectDataCenter)return;
        try{
            const activeId=ProjectDataCenter.getActiveProjectId();
            if(activeId){
                const snapshot=await LocalImageVault.loadProjectSnapshot(activeId);
                const libraryProject=ProjectDataCenter.library.get(activeId);
                const updatedAt=libraryProject&&libraryProject.updatedAt;
                const libraryTime=typeof updatedAt==="number"?updatedAt:(updatedAt?Date.parse(updatedAt):0);
                if(snapshot&&snapshot.data&&snapshot.savedAt>libraryTime+500){
                    ProjectDataCenter.loadProjectData(snapshot.data,{source:"indexeddb-image-recovery",resetMissing:true});
                }
            }
            if(window.PixivImageAssets)await PixivImageAssets.hydratePages();
            await hydrateHtmlImages();
        }catch(error){
            console.warn("IndexedDB 圖片還原失敗",error);
        }
    }
    if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",()=>setTimeout(recover,900),{once:true});
    else setTimeout(recover,900);
})();
</script>
