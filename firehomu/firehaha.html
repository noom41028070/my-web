        	// 用 Pointer Events 自己做拖曳，滑鼠／觸控／手寫筆統一支援，
        	// 跟拉節點（dragNode）同一套手感：按下就立刻跟著手指/游標走。
        	card.addEventListener("pointerdown", (e)=>{
            	if(e.target.closest(".material-remove")) return;
            	startMaterialDrag(e, item, card);
        	});

        	materialListEl.appendChild(card);
    	});
	}

	function startMaterialDrag(startEvent, item, card){
    	startEvent.preventDefault();
    	try { card.setPointerCapture(startEvent.pointerId); } catch(err) {}
    	card.classList.add("dragging-source");

    	const ghost = document.createElement("div");
    	ghost.className = "material-drag-ghost";
    	if(item.type === "image"){
        	ghost.innerHTML = '<img src="' + item.data + '" alt="">';
    	} else {
        	ghost.innerHTML =
            	'<div class="ghost-doc-icon">📄</div>' +
            	'<div class="ghost-name">' + escapeHtml(item.name) + '</div>';
    	}
    	document.body.appendChild(ghost);
    	positionGhost(startEvent.clientX, startEvent.clientY);

    	function positionGhost(x, y){
        	ghost.style.left = x + "px";
        	ghost.style.top = y + "px";
    	}

    	function isOverCanvas(x, y){
        	const rect = flowPanelEl.getBoundingClientRect();
        	return x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom;
    	}

    	function move(ev){
        	positionGhost(ev.clientX, ev.clientY);
        	const over = isOverCanvas(ev.clientX, ev.clientY);
        	flowPanelEl.classList.toggle("material-drop-hover", over);
        	ghost.classList.toggle("drop-ready", over);
    	}

    	function finish(ev){
        	document.removeEventListener("pointermove", move);
        	document.removeEventListener("pointerup", finish);
        	document.removeEventListener("pointercancel", cancel);
        	card.classList.remove("dragging-source");
        	flowPanelEl.classList.remove("material-drop-hover");
        	ghost.remove();

        	if(isOverCanvas(ev.clientX, ev.clientY)){
            	const pos = toLocalXY(ev.clientX, ev.clientY);
            	if(item.type === "image"){
                	window.addStickyNote({ type:"image", image:item.data, name:item.name, x:pos.x - 90, y:pos.y - 65, width:180, height:130, color:"#ffffff" });
            	} else {
                	window.addStickyNote({ type:"text", text:item.data, name:item.name, x:pos.x - 60, y:pos.y - 40 });
            	}
            	// 拖成功後自動收合面板，手機上能立刻看到剛剛放上畫布的結果
            	libPanel.classList.remove("open");
        	}
    	}

    	function cancel(){
        	document.removeEventListener("pointermove", move);
        	document.removeEventListener("pointerup", finish);
        	document.removeEventListener("pointercancel", cancel);
        	card.classList.remove("dragging-source");
        	flowPanelEl.classList.remove("material-drop-hover");
        	ghost.remove();
    	}

    	document.addEventListener("pointermove", move);
    	document.addEventListener("pointerup", finish);
    	document.addEventListener("pointercancel", cancel);
	}

	function escapeHtml(str){
    	return String(str).replace(/[&<>"']/g, c => ({
        	"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
    	}[c]));
	}

	async function handleMaterialFiles(files){
    	if(!files || !files.length) return;
    	const items = loadMaterials();
        const pending = Array.from(files).map(async file => {
            if(file.type.startsWith("image/")){
                const result = await window.LocalImageTools.compress(file);
                const vaultId=window.LocalImageVault
                    ? await LocalImageVault.putImage(result.dataUrl,{name:file.name,mime:"image/webp"})
                    : "";
                return {
                    type:"image",
                    name:file.name,
                    data:result.dataUrl,
                    vaultId,
                    compressedBytes:result.bytes,
                    originalBytes:result.originalBytes,
                    width:result.width,
                    height:result.height
                };
            }
            return await new Promise((resolve,reject)=>{
                const reader = new FileReader();
                reader.onload = ()=>resolve({type:"text",name:file.name,data:reader.result});
                reader.onerror = reject;
                reader.readAsText(file,"UTF-8");
            });
        });
        try{
            const loaded = await Promise.all(pending);
            items.push(...loaded);
            saveMaterials(items);
            renderMaterialList();
        }catch(error){
            console.error(error);
            alert(error && error.message==="image too large"
                ? "圖片超過 30 MB，請改用稍小的圖片。"
                : "圖片壓縮失敗，請換一張圖片再試。");
        }
	}

	dropZone.addEventListener("click", ()=> materialFileInput.click());
	materialFileInput.addEventListener("change", (e)=>{
    	handleMaterialFiles(e.target.files);
    	materialFileInput.value = "";
	});
	["dragover","dragenter"].forEach(evt => {
    	dropZone.addEventListener(evt, (e)=>{
        	e.preventDefault();
        	dropZone.classList.add("dragover");
    	});
	});
	["dragleave","drop"].forEach(evt => {
    	dropZone.addEventListener(evt, ()=> dropZone.classList.remove("dragover"));
	});
	dropZone.addEventListener("drop", (e)=>{
    	e.preventDefault();
    	if(e.dataTransfer.files && e.dataTransfer.files.length){
        	handleMaterialFiles(e.dataTransfer.files);
    	}
	});

	const folderBtn = document.getElementById("folder-toggle-btn");
	if (folderBtn) folderBtn.addEventListener("click", ()=>{
    	libPanel.classList.toggle("open");
    	if(libPanel.classList.contains("open")) renderMaterialList();
	});
	const materialCloseBtn = document.getElementById("material-close-btn");
	if (materialCloseBtn) materialCloseBtn.addEventListener("click", ()=> libPanel.classList.remove("open"));

	renderMaterialList();
    if(window.LocalImageVault){
        LocalImageVault.loadMaterials().then(async stored=>{
            if(!stored.length)return;
            const current=loadMaterials();
            const byKey=new Map(current.map(item=>[(item.vaultId||"")+"|"+(item.name||""),item]));
            for(const item of stored){
                const key=(item.vaultId||"")+"|"+(item.name||"");
                if(!byKey.has(key)){current.push(item);byKey.set(key,item)}
                if(item.type==="image"&&!item.data&&item.vaultId)item.data=await LocalImageVault.getImage(item.vaultId);
            }
            saveMaterials(current);
            renderMaterialList();
        }).catch(error=>console.warn("素材庫 IndexedDB 還原失敗",error));
    }

	// =====================================================
	// 模組三：自由畫筆
	// =====================================================
	window.allDrawings = window.allDrawings || [];
	window.__drawModeActive = false;

	const svgNS = "http://www.w3.org/2000/svg";
	const drawLayer = document.createElementNS(svgNS, "svg");
	drawLayer.id = "drawLayer";
	drawLayer.style.position = "absolute";
	drawLayer.style.left = "0";
	drawLayer.style.top = "0";
	drawLayer.style.zIndex = "50";
	drawLayer.style.pointerEvents = "none";
	// 手機關鍵：不設 touch-action:none 的話，瀏覽器會把手指移動誤判成「想滾動畫面」，
	// 導致畫筆在手機上完全畫不出線、或者線斷斷續續、延遲很重。
	drawLayer.style.touchAction = "none";
	drawLayer.style.webkitUserSelect = "none";
	drawLayer.style.userSelect = "none";
	flowCanvasEl.appendChild(drawLayer);

	function resizeDrawLayer(){
    	const w = Math.max(flowPanelEl.scrollWidth, flowCanvasEl.offsetWidth, 1200);
    	const h = Math.max(flowPanelEl.scrollHeight, flowCanvasEl.offsetHeight, 1000);
    	drawLayer.setAttribute("width", w);
    	drawLayer.setAttribute("height", h);
    	drawLayer.style.width = w + "px";
    	drawLayer.style.height = h + "px";
	}

	// 筆劃資料統一用座標點陣列（points）記錄，橡皮擦才有辦法「只擦局部」；
	// d 字串用 pointsToD 隨時從 points 重新算出即可，不需要另外維護兩份。
	function pointsToD(points){
    	if(!points || !points.length) return "";
    	return points.map((p, i) => (i === 0 ? "M " : "L ") + p[0] + " " + p[1]).join(" ");
	}
	// 讀舊專案時，可能還是舊格式（只有 d 字串、沒有 points），
	// 這裡負責把 d 字串還原成座標點陣列，讓舊存檔一樣能被橡皮擦局部擦除。
	function parseDToPoints(d){
    	const points = [];
    	if(!d) return points;
    	const re = /[ML]\s*(-?[0-9.]+)\s+(-?[0-9.]+)/g;
    	let m;
    	while((m = re.exec(d))){
        	points.push([parseFloat(m[1]), parseFloat(m[2])]);
    	}
    	return points;
	}

	window.renderDrawings = function(){
    	// 專案切換/匯入時 flowCanvas.innerHTML 會被整個清空，
    	// drawLayer 這個 SVG 節點也會跟著被移除，所以每次渲染都要重新插回去，
    	// 不然畫筆圖層就會憑空消失，畫了也看不到、點了也沒反應。
    	flowCanvasEl.appendChild(drawLayer);
    	drawLayer.innerHTML = "";
    	resizeDrawLayer();
    	(window.allDrawings || []).forEach(stroke => {
        	if(!stroke.points || !stroke.points.length){
            	stroke.points = parseDToPoints(stroke.d || "");
        	}
        	const path = document.createElementNS(svgNS, "path");
        	path.setAttribute("d", pointsToD(stroke.points));
        	path.setAttribute("fill", "none");
        	path.setAttribute("stroke", stroke.color || "#e53935");
        	path.setAttribute("stroke-width", stroke.width || 3);
        	path.setAttribute("stroke-linecap", "round");
        	path.setAttribute("stroke-linejoin", "round");
        	drawLayer.appendChild(path);
    	});
	};
	window.renderDrawings();

	let drawColor = "#e53935";
	let drawWidth = 3;
	let eraserMode = false;
	let currentPath = null;
	let currentPoints = null;
	let isErasing = false;

	const drawToolbar = document.createElement("div");
	drawToolbar.id = "draw-toolbar";
	const DRAW_COLORS = ["#e53935","#1976d2","#43a047","#fbc02d","#212121","#ffffff"];
	drawToolbar.innerHTML =
    	DRAW_COLORS.map(c => '<span class="draw-color" data-color="'+c+'" style="background:'+c+';"></span>').join("") +
    	'<button type="button" data-w="2">細</button>' +
    	'<button type="button" data-w="4">中</button>' +
    	'<button type="button" data-w="9">粗</button>' +
    	'<button type="button" id="draw-eraser-btn">🧹 橡皮擦</button>' +
    	'<button type="button" id="draw-undo-btn">↩ 復原</button>' +
    	'<button type="button" id="draw-clear-btn">🗑 清空</button>' +
    	'<button type="button" id="draw-done-btn">✅ 完成</button>';
	document.body.appendChild(drawToolbar);

	// 橡皮擦的圓形預覽游標：跟著手指／滑鼠走，讓使用者知道目前會擦掉多大範圍
	const eraserCursor = document.createElement("div");
	eraserCursor.id = "eraser-cursor";
	eraserCursor.style.display = "none";
	document.body.appendChild(eraserCursor);

	function currentEraserRadius(){
    	// 橡皮擦大小跟著目前選的筆刷粗細走（粗筆刷 → 橡皮擦也比較大），
    	// 不用另外多做一組「橡皮擦大小」的按鈕，操作起來比較直覺。
    	return Math.max(14, drawWidth * 5);
	}

	function updateEraserCursor(clientX, clientY){
    	const r = currentEraserRadius();
    	eraserCursor.style.width = (r * 2) + "px";
    	eraserCursor.style.height = (r * 2) + "px";
    	eraserCursor.style.left = (clientX - r) + "px";
    	eraserCursor.style.top = (clientY - r) + "px";
	}

	drawToolbar.querySelectorAll(".draw-color").forEach(dot => {
    	dot.addEventListener("click", ()=>{
        	drawColor = dot.dataset.color;
        	drawToolbar.querySelectorAll(".draw-color").forEach(d=>d.classList.remove("active"));
        	dot.classList.add("active");
        	eraserMode = false;
        	eraserCursor.style.display = "none";
        	const eraserBtn = document.getElementById("draw-eraser-btn");
        	if (eraserBtn) eraserBtn.classList.remove("active-tool");
    	});
	});
	drawToolbar.querySelectorAll("button[data-w]").forEach(btn => {
    	btn.addEventListener("click", ()=>{ drawWidth = Number(btn.dataset.w); });
	});
	document.getElementById("draw-eraser-btn").addEventListener("click", (e)=>{
    	eraserMode = !eraserMode;
    	e.target.classList.toggle("active-tool", eraserMode);
    	if(!eraserMode) eraserCursor.style.display = "none";
	});
	document.getElementById("draw-undo-btn").addEventListener("click", ()=>{
    	window.allDrawings.pop();
    	window.renderDrawings();
    	markProjectDirty();
	});
	document.getElementById("draw-clear-btn").addEventListener("click", ()=>{
    	if(!window.allDrawings.length) return;
    	if(!confirm("確定要清空所有畫筆標記嗎？此動作無法復原。")) return;
    	window.allDrawings = [];
    	window.renderDrawings();
    	markProjectDirty();
	});
	document.getElementById("draw-done-btn").addEventListener("click", ()=> setDrawMode(false));

	function setDrawMode(active){
    	window.__drawModeActive = active;
    	flowPanelEl.classList.toggle("drawing-active", active);
    	drawLayer.style.pointerEvents = active ? "auto" : "none";
    	drawToolbar.classList.toggle("open", active);
    	const toggleBtn = document.getElementById("draw-mode-toggle-btn");
    	if (toggleBtn) toggleBtn.classList.toggle("active-tool", active);
    	if(active) resizeDrawLayer();
    	else eraserCursor.style.display = "none";
	}

	const drawModeBtn = document.getElementById("draw-mode-toggle-btn");
	if (drawModeBtn) drawModeBtn.addEventListener("click", ()=> setDrawMode(!window.__drawModeActive));

	// 局部橡皮擦：只挖掉游標半徑內的那幾個點，同一條線被挖斷的話就自動拆成
	// 兩段（或多段）獨立的線，不會像以前那樣一碰到線就整條消失。
	function eraseNear(pos){
    	const r2 = currentEraserRadius() * currentEraserRadius();
    	let changed = false;
    	const rebuilt = [];

    	(window.allDrawings || []).forEach(stroke => {
        	const pts = stroke.points && stroke.points.length ? stroke.points : parseDToPoints(stroke.d || "");
        	let run = [];

        	function flushRun(){
            	if(run.length >= 2){
                	rebuilt.push({ points: run, color: stroke.color, width: stroke.width });
            	} else if(run.length === 1){
                	// 只剩單獨一個點連不成線，直接捨棄，不留下無意義的殘段
            	}
            	run = [];
        	}

        	pts.forEach(p => {
            	const dx = p[0] - pos.x, dy = p[1] - pos.y;
            	if(dx*dx + dy*dy <= r2){
                	changed = true;
                	flushRun();
            	} else {
                	run.push(p);
            	}
        	});
        	flushRun();
    	});

    	if(changed){
        	window.allDrawings = rebuilt;
        	window.renderDrawings();
        	markProjectDirty();
    	}
	}

	drawLayer.addEventListener("pointerdown", (e)=>{
    	if(!window.__drawModeActive) return;
    	e.preventDefault();
    	e.stopPropagation();
    	try { drawLayer.setPointerCapture(e.pointerId); } catch(err) {}

    	if(eraserMode){
        	isErasing = true;
        	updateEraserCursor(e.clientX, e.clientY);
        	eraserCursor.style.display = "block";
        	eraseNear(toLocalXY(e.clientX, e.clientY));
        	return;
    	}
    	const pos = toLocalXY(e.clientX, e.clientY);
    	currentPoints = [[pos.x, pos.y]];
    	currentPath = document.createElementNS(svgNS, "path");
    	currentPath.setAttribute("d", pointsToD(currentPoints));
    	currentPath.setAttribute("fill", "none");
    	currentPath.setAttribute("stroke", drawColor);
    	currentPath.setAttribute("stroke-width", drawWidth);
    	currentPath.setAttribute("stroke-linecap", "round");
    	currentPath.setAttribute("stroke-linejoin", "round");
    	drawLayer.appendChild(currentPath);
	});

	drawLayer.addEventListener("pointermove", (e)=>{
    	if(!window.__drawModeActive) return;
    	if(eraserMode){
        	updateEraserCursor(e.clientX, e.clientY);
        	eraserCursor.style.display = "block";
        	if(isErasing) eraseNear(toLocalXY(e.clientX, e.clientY));
        	return;
    	}
    	if(!currentPath) return;
    	const pos = toLocalXY(e.clientX, e.clientY);
    	currentPoints.push([pos.x, pos.y]);
    	currentPath.setAttribute("d", pointsToD(currentPoints));
	});

	function endStroke(){
    	if(currentPath && currentPoints && currentPoints.length >= 2){
        	window.allDrawings.push({
            	points: currentPoints,
            	color: drawColor,
            	width: drawWidth
        	});
        	markProjectDirty();
    	}
    	currentPath = null;
    	currentPoints = null;
    	isErasing = false;
	}
	drawLayer.addEventListener("pointerup", endStroke);
	drawLayer.addEventListener("pointercancel", endStroke);
	drawLayer.addEventListener("pointerleave", (e)=>{
    	if(eraserMode && !isErasing) eraserCursor.style.display = "none";
	});

	window.addEventListener("resize", ()=>{
    	if(window.__drawModeActive) resizeDrawLayer();
	});


	//

	// =====================================================
	// 模組四：擲骰工具（給 Gamebook／互動小說作者測試隨機分歧、事件表用）
	// =====================================================
	const dicePanel = document.createElement("div");
	dicePanel.id = "dice-roller-panel";
	dicePanel.innerHTML =
    	'<div style="font-weight:bold;margin-bottom:8px;">🎲 擲骰工具</div>' +
    	'<div class="dice-grid">' +
        	'<button type="button" data-d="4">d4</button>' +
        	'<button type="button" data-d="6">d6</button>' +
        	'<button type="button" data-d="8">d8</button>' +
        	'<button type="button" data-d="10">d10</button>' +
        	'<button type="button" data-d="12">d12</button>' +
        	'<button type="button" data-d="20">d20</button>' +
        	'<button type="button" data-d="100">d100</button>' +
        	'<button type="button" id="dice-custom-btn">自訂</button>' +
    	'</div>' +
    	'<div id="dice-roller-result">—</div>' +
    	'<div id="dice-roller-history"></div>';
	document.body.appendChild(dicePanel);

	const diceHistory = [];
	function rollDice(sides){
    	const result = 1 + Math.floor(Math.random() * sides);
    	document.getElementById("dice-roller-result").textContent = "d" + sides + " → " + result;
    	diceHistory.unshift("d" + sides + ": " + result);
    	diceHistory.length = Math.min(diceHistory.length, 8);
    	document.getElementById("dice-roller-history").innerHTML = diceHistory.join("<br>");
	}
	dicePanel.querySelectorAll("button[data-d]").forEach(btn => {
    	btn.addEventListener("click", ()=> rollDice(Number(btn.dataset.d)));
	});
	document.getElementById("dice-custom-btn").addEventListener("click", ()=>{
    	const val = prompt("輸入骰子面數（例如 3 代表 1~3）：", "6");
    	const n = parseInt(val, 10);
    	if(n && n > 1) rollDice(n);
	});
	const diceBtn = document.getElementById("dice-roller-btn");
	if (diceBtn) diceBtn.addEventListener("click", ()=> dicePanel.classList.toggle("open"));

})();

(function(){

	let select =
	document.getElementById(
    	"targetPageSelect"
	);


	if(!select)
    	return;


	if(typeof pages==="undefined")
    	return;

    const signature=pages.map(page=>String(page.id)+"\u0000"+String(page.title||"")).join("\u0001");
    if(signature===targetPageListSignature)return;
    targetPageListSignature=signature;



	let old =
	select.value;



	select.innerHTML =
	`
	<option value="">
	請選擇 Page
	</option>
	`;



	pages.forEach((page,index)=>{


    	let option =
    	document.createElement("option");


    	option.value =
    	page.id;


    	option.textContent =
    	`(${index+1}) ${page.title || "未命名"}`;


    	select.appendChild(option);


	});



	if(old)
    	select.value=old;

}

.getElementById("targetPageSelect")
.onchange=function(){


	targetPageId =
	this.value;



	let page =
	pages.find(
    	p=>p.id===targetPageId
	);



	if(!page)
    	return;



	document
	.getElementById("targetPageText")
	.value =
	page.text || "";



};




// 儲存修改

document
.getElementById("saveTargetPage")
.onclick=function(){



	if(!targetPageId){

    	alert("請先選擇 Page");
    	return;

	}



	let page =
	pages.find(
    	p=>p.id===targetPageId
	);



	if(!page)
    	return;



	page.text =
	document
	.getElementById("targetPageText")
	.value;



	projectChanged=true;



	// 更新目前頁面顯示

	if(
    	currentPage &&
    	currentPage.id===page.id
	){

    	if(textInput){

        	textInput.value =
        	page.text;

    	}

	}



	alert(
    	"Page 內容已更新"
	);


};



// 定期同步清單

setInterval(
	updateTargetPageList,
	1000
);

// =============================================
// 浮動視窗拖曳（PC + 手機完整版）
// =============================================

// =============================================
// 浮動視窗拖曳（PC + 手機版）
// =============================================

function makeDraggable(panelId, headerId){

	const panel = document.getElementById(panelId);
	const header = document.getElementById(headerId);

	if(!panel || !header) return;


	let dragging = false;

	let offsetX = 0;
	let offsetY = 0;



	header.addEventListener(
    	"pointerdown",
    	function(e){


        	// 如果點到按鈕，不啟動拖曳
        	if(e.target.tagName === "BUTTON")
            	return;


        	dragging = true;


        	const rect =
        	panel.getBoundingClientRect();


        	offsetX =
        	e.clientX - rect.left;


        	offsetY =
        	e.clientY - rect.top;



        	// 解除定位限制

        	panel.style.right="auto";
        	panel.style.bottom="auto";



        	header.setPointerCapture(
            	e.pointerId
        	);


        	document.body.style.userSelect="none";


    	}
	);




window.addEventListener(

	"pointermove",

	function(e){


    	if(!dragging)

        	return;


    	e.preventDefault();



    	let left = e.clientX - offsetX;

    	let top  = e.clientY - offsetY;



    	// ===== 邊緣安全距離 =====

    	const edgeSafe = window.innerWidth <= 700 ? 16 : 12;



    	// ===== 左右限制 =====

    	const minLeft = edgeSafe;


    	const maxLeft = Math.max(

        	minLeft,

        	window.innerWidth -

        	panel.offsetWidth -

        	edgeSafe

    	);



    	// ===== 上下限制 =====

    	const minTop = edgeSafe;


    	const maxTop = Math.max(

        	minTop,

        	window.innerHeight -

        	panel.offsetHeight -

        	edgeSafe

    	);



    	// ===== 套用限制 =====

    	left = Math.max(

        	minLeft,

        	Math.min(left, maxLeft)

    	);



    	top = Math.max(

        	minTop,

        	Math.min(top, maxTop)

    	);



    	panel.style.left =

        	left + "px";



    	panel.style.top =

        	top + "px";


	},

	{

    	passive:false

	}

);


	window.addEventListener(
    "pointerup",
    function(e){


        if(!dragging)
            return;


        dragging=false;


        document.body.style.userSelect="";


        try{

            header.releasePointerCapture(
                e.pointerId
            );

        }catch(err){}



        // ============================
        // 儲存 permFloat 拖曳位置
        // ============================

        if(panelId === "permFloat"){


            const panel =
            document.getElementById(panelId);


            if(panel){


                const state = {


                    left:
                    panel.style.left,


                    top:
                    panel.style.top,


                    right:
                    panel.style.right,


                    bottom:

// =============================================
// 操作歷史：復原 / 重做
// 採用「快照」設計 —— 不用替每一種操作（打字、拖曳、刪頁、生成分歧…）
// 各自寫一套「怎麼復原」的邏輯，而是每隔一小段時間就把當下整個專案
// 狀態記一筆快照，復原/重做就是把畫布切換回某一筆快照。
// 好處是不管使用者做了什麼操作，通通「無痛」自動被記錄，不用另外手動存點。
// =============================================
(function(){

	const HISTORY_LIMIT = 60;   // 最多保留幾筆快照，避免無限占記憶體
	const DEBOUNCE_MS = 900;	// 停止操作後多久才真的記一筆快照

	let historyStack = [];
	let historyIndex = -1;
	let isRestoring = false;
	let debounceTimer = null;
	let observer = null;

	function serializeState(){
    	// 集中化資料中心啟用後，歷史快照會自動包含所有已註冊的功能欄位。
    	// 未來新增功能不必再回來手動補這個快照物件。
    	if(window.ProjectDataCenter && typeof window.ProjectDataCenter.serialize === "function"){
        	return JSON.stringify(
            	window.ProjectDataCenter.serialize({ source: "history-snapshot" })
        	);
    	}

    	// 相容保底：若資料中心尚未載入，保留原有的核心快照格式。
    	return JSON.stringify({
        	pages: pages.map(p => ({
            	id: p.id,
            	title: p.title,
            	text: p.text,
            	note: p.note || "",
            	groupId: p.groupId || null,
            	groupColor: p.groupColor || null,
            	options: JSON.parse(JSON.stringify(p.options || [])),
            	x: p.x,
            	y: p.y
        	})),
        	notes: JSON.parse(JSON.stringify(window.allNotes || [])),
        	drawings: JSON.parse(JSON.stringify(window.allDrawings || [])),
        	currentPageId: currentPage ? currentPage.id : null
    	});
	}

	function updateButtons(){
    	const undoBtn = document.getElementById("historyUndoBtn");
    	const redoBtn = document.getElementById("historyRedoBtn");
    	if(undoBtn) undoBtn.disabled = historyIndex <= 0;
    	if(redoBtn) redoBtn.disabled = historyIndex >= historyStack.length - 1;
	}

	function pushSnapshot(){
    	if(isRestoring) return;
    	if(typeof pages === "undefined") return;

    	const snap = serializeState();

    	if(historyIndex >= 0 && historyStack[historyIndex] === snap) return;

    	historyStack = historyStack.slice(0, historyIndex + 1);
    	historyStack.push(snap);

    	if(historyStack.length > HISTORY_LIMIT){
        	historyStack.shift();
    	}

    	historyIndex = historyStack.length - 1;
    	updateButtons();
	}

	function scheduleSnapshot(){
    	if(isRestoring) return;
    	clearTimeout(debounceTimer);
    	debounceTimer = setTimeout(pushSnapshot, DEBOUNCE_MS);
	}

	function observeCanvas(){
    	const flowCanvasEl = document.getElementById("flowCanvas");
    	if(!flowCanvasEl) return;
    	observer = new MutationObserver(() => {
        	if(isRestoring) return;
        	scheduleSnapshot();
    	});
    	observer.observe(flowCanvasEl, {
        	childList: true,
        	subtree: true,
        	attributes: true,
        	attributeFilter: ["style"]
    	});
	}

	function restoreState(snap){
    	if(!snap) return;

    	isRestoring = true;
    	if(observer) observer.disconnect();
    	clearTimeout(debounceTimer);

    	try{
        	const data = JSON.parse(snap);

        	if(typeof window.importProjectData === "function"){
            	// 資料中心會自動讀取所有已註冊欄位；舊快照仍可正常相容。
            	window.importProjectData(data, {
                	source: "history-restore",
                	resetMissing: true
            });
        	}

        	const selectedPageId =
            	data.editorSelection && data.editorSelection.currentPageId
                	? data.editorSelection.currentPageId
                	: data.currentPageId;
        	if(selectedPageId){
            	const p = pages.find(pp => pp.id === selectedPageId);
            	if(p) selectPage(p);
        }

        	projectChanged = true;
        	if(typeof window.markDirty === "function") window.markDirty();

    	} finally {
        	setTimeout(() => {
            	isRestoring = false;
            	observeCanvas();
        	}, 150);
    	}
	}

	window.undoHistory = function(){
    	if(historyIndex <= 0) return;

    	clearTimeout(debounceTimer);
    	pushSnapshot();

    	historyIndex--;
    	restoreState(historyStack[historyIndex]);
    	updateButtons();
	};

	window.redoHistory = function(){
    	if(historyIndex >= historyStack.length - 1) return;
    	historyIndex++;
    	restoreState(historyStack[historyIndex]);
    	updateButtons();
	};

	const header = document.querySelector("header");
	if(header){
    	const wrap = document.createElement("div");
    	wrap.className = "header-group";
    	wrap.innerHTML =
        	'<button type="button" id="historyUndoBtn" title="復原 (Ctrl+Z)">\u21a9\ufe0f 復原</button>' +
        	'<button type="button" id="historyRedoBtn" title="重做 (Ctrl+Y 或 Ctrl+Shift+Z)">\u21aa\ufe0f 重做</button>';
    	header.appendChild(wrap);

    	document.getElementById("historyUndoBtn").addEventListener("click", () => window.undoHistory());
    	document.getElementById("historyRedoBtn").addEventListener("click", () => window.redoHistory());
    	updateButtons();
	}

	document.addEventListener("input", (e) => {
    	if(isRestoring) return;
    	if(e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") scheduleSnapshot();
	});

	document.addEventListener("change", (e) => {
    	if(isRestoring) return;
    	if(e.target.tagName === "SELECT") scheduleSnapshot();
	});

	observeCanvas();

	document.addEventListener("keydown", (e) => {
    	const tag = e.target.tagName;
    	const typing = (tag === "TEXTAREA" || tag === "INPUT");
    	const key = e.key.toLowerCase();

    	if((e.ctrlKey || e.metaKey) && !e.shiftKey && key === "z"){
        	if(typing) return;
        	e.preventDefault();
        	window.undoHistory();
    	} else if(
        	((e.ctrlKey || e.metaKey) && key === "y") ||
        	((e.ctrlKey || e.metaKey) && e.shiftKey && key === "z")
    	){
        	if(typing) return;
        	e.preventDefault();
        	window.redoHistory();
    	}
	});

	setTimeout(() => {
    	pushSnapshot();
    	updateButtons();
	}, 2000);

})();

	function createResizeHandle() {

	// ============================================================

	function makeResizable(
    	panelId,
    	contentId,
    	minWidth,
    	minHeight
	) {


    	const panel =
        	document.getElementById(panelId);


    	const content =
        	document.getElementById(contentId);



    	if (!panel || !content) return;



    	// 避免重複加入

    	if (
        	panel.querySelector(
            	".__pixiv-resize-handle"
        	)
    	) {

        	return;

    	}




    	// 確保縮小時可以捲動

    	const currentOverflow =
        	getComputedStyle(content).overflowY;


    	if (currentOverflow === "visible") {

        	content.style.overflow = "auto";

    	}




    	const handle = createResizeHandle();

    	panel.appendChild(handle);




    	let resizing = false;

    	let startX = 0;

    	let startY = 0;

    	let startWidth = 0;

    	let startContentHeight = 0;





    	// --------------------------------------------------------
    	// 開始縮放
    	// --------------------------------------------------------

    	handle.addEventListener(
        	"pointerdown",
        	function (e) {


            	resizing = true;


            	startX = e.clientX;

            	startY = e.clientY;


            	startWidth =
                	panel.getBoundingClientRect().width;


            	startContentHeight =
                	content.getBoundingClientRect().height;



            	handle.setPointerCapture(
                	e.pointerId
            	);


            	document.body.style.userSelect =
                	"none";


            	e.preventDefault();

        	}
    	);






    	// --------------------------------------------------------
    	// 縮放中
    	// --------------------------------------------------------

    	handle.addEventListener(
        	"pointermove",
        	function (e) {


            	if (!resizing) return;



            	const dx =
                	e.clientX - startX;


            	const dy =
                	e.clientY - startY;




            	const maxWidth =
                	window.innerWidth * 0.9;


            	const maxContentHeight =
                	window.innerHeight * 0.85;




            	const newWidth =
                	Math.min(
                    	maxWidth,
                    	Math.max(
                        	minWidth,
                        	startWidth + dx
                    	)
                	);



            	const newContentHeight =
                	Math.min(
                    	maxContentHeight,
                    	Math.max(
                        	minHeight,
                        	startContentHeight + dy
                    	)
                	);





            	panel.style.width =
                	newWidth + "px";


            	content.style.height =
                	newContentHeight + "px";


            	content.style.maxHeight =
                	newContentHeight + "px";


        	}
    	);







    	// --------------------------------------------------------
    	// 結束縮放
    	// --------------------------------------------------------

    	function stopResize(e) {

            	);

        	stopResize
    	);


    	handle.addEventListener(
        	"pointercancel",
        	stopResize
    	);

// Gamebook Core Bridge v1.0
// 統一對外擴充介面：未來外掛請優先使用 window.GamebookCore
// ============================================================
(function installGamebookCoreBridge(){

    if(window.GamebookCore && window.GamebookCore.__bridgeInstalled){
        return;
    }

    const listeners = new Map();
    const plugins = new Map();

    function on(type, handler){
        if(typeof handler !== "function"){
            throw new TypeError("GamebookCore.on 需要函式作為 handler");
        }
        if(!listeners.has(type)) listeners.set(type, new Set());
        listeners.get(type).add(handler);
        return function unsubscribe(){ off(type, handler); };
    }

    function off(type, handler){
        const set = listeners.get(type);
        if(!set) return false;
        const removed = set.delete(handler);
        if(set.size === 0) listeners.delete(type);
        return removed;
    }

    function emit(type, detail){
        const payload = {
            type,
            detail,
            core: api,
            time: Date.now()
        };

        const set = listeners.get(type);
        if(set){
            [...set].forEach(handler => {
                try{ handler(payload); }
                catch(error){ console.error("[GamebookCore hook error]", type, error); }
            });
        }

        try{
            document.dispatchEvent(new CustomEvent("gamebook:" + type, {
                detail: payload
            }));
        }catch(error){
            console.warn("[GamebookCore] CustomEvent 發送失敗", error);
        }

        return payload;
    }

    function registerPlugin(name, plugin){
        if(typeof name !== "string" || !name.trim()){
            throw new TypeError("外掛名稱必須是非空字串");
        }
        if(!plugin || (typeof plugin !== "object" && typeof plugin !== "function")){
            throw new TypeError("外掛必須是物件或函式");
        }
        if(plugins.has(name)){
            console.warn("[GamebookCore] 外掛已存在，將覆蓋：", name);
            unregisterPlugin(name);
        }

        const record = { name, plugin, cleanup: null };
        plugins.set(name, record);

        try{
            const init = typeof plugin === "function" ? plugin : plugin.init;
            if(typeof init === "function"){
                const cleanup = init(api);
                if(typeof cleanup === "function") record.cleanup = cleanup;
            }
            emit("plugin:registered", { name, plugin });
        }catch(error){
            plugins.delete(name);
            console.error("[GamebookCore] 外掛初始化失敗：" + name, error);
            throw error;
        }
        return record;
    }

    function unregisterPlugin(name){
        const record = plugins.get(name);
        if(!record) return false;
        try{
            if(typeof record.cleanup === "function") record.cleanup();
            else if(record.plugin && typeof record.plugin.destroy === "function"){
                record.plugin.destroy(api);
            }
        }catch(error){
            console.error("[GamebookCore] 外掛清理失敗：" + name, error);
        }
        plugins.delete(name);
        emit("plugin:unregistered", { name });
        return true;
    }

    function getPageById(id){
        return pages.find(page => page && page.id === id) || null;
    }

    function getPageNumber(pageOrId){
        const page = typeof pageOrId === "string" ? getPageById(pageOrId) : pageOrId;
        const index = pages.indexOf(page);
        return index >= 0 ? index + 1 : null;
    }

    function createPage(data = {}, options = {}){
        const page = new NovelPage();
        Object.assign(page, data || {});
        if(!Array.isArray(page.options)) page.options = [];
        if(!Number.isFinite(page.x)) page.x = 100;
        if(!Number.isFinite(page.y)) page.y = 100;
        pages.push(page);
        createFlowNode(page);
        refreshNodeBadges();
        drawLines();
        if(options.select !== false) selectPage(page);
        projectChanged = true;
        emit("page:created", { page, source: "GamebookCore" });
        return page;
    }

    function removePage(pageOrId){
        const page = typeof pageOrId === "string" ? getPageById(pageOrId) : pageOrId;
        if(!page) return false;
        const index = pages.indexOf(page);
        if(index < 0) return false;
        if(page.element) page.element.remove();
        pages.splice(index, 1);
        pages.forEach(p => {
            if(Array.isArray(p.options)){
                p.options = p.options.filter(option => option && option.target !== page.id);
            }
        });
        if(currentPage === page){
            currentPage = pages[0] || null;
            if(currentPage) selectPage(currentPage);
        }
        renderOptions();
        updatePreview();
        drawLines();
        projectChanged = true;
        emit("page:removed", { page, index, source: "GamebookCore" });
        return true;
    }

    function notifyChange(reason = "external", detail = {}){
        projectChanged = true;
        refreshNodeBadges();
        renderOptions();
        updatePreview();
        drawLines();
        return emit("project:changed", { reason, ...detail });
    }

    const api = {
        __bridgeInstalled: true,
        version: "1.0.0",

        // 即時狀態（getter，避免外掛拿到過期副本）
        get pages(){ return pages; },
        get currentPage(){ return currentPage; },
        get selectedPages(){ return window.selectedPages; },
        get projectChanged(){ return projectChanged; },
        set projectChanged(value){ projectChanged = Boolean(value); },
        get language(){ return currentLang; },

        // 核心類別與 DOM
        NovelPage,
        dom: {
            flowCanvas,
            flowPanel: document.querySelector("#flowPanel"),
            linesCanvas: document.querySelector("#linesCanvas"),
            titleInput,
            noteInput,
            textInput,
            optionsBox,
            previewText,
            htmlPreview: document.querySelector("#htmlPreview"),
            editorFloat: document.querySelector("#editorFloat"),
            previewFloat: document.querySelector("#previewFloat")
        },

        // 資料查詢
        getPageById,
        getPageNumber,
        getPageByNumber(number){ return pages[Number(number) - 1] || null; },
        indexOfPage(page){ return pages.indexOf(page); },

        // 安全操作
        createPage,
        removePage,
        selectPage(pageOrId){
            const page = typeof pageOrId === "string" ? getPageById(pageOrId) : pageOrId;
            if(!page) return false;
            selectPage(page);
            emit("page:selected", { page, source: "GamebookCore" });
            return true;
        },
        createFlowNode,
        drawLines,
        renderOptions,
        refreshNodeBadges,
        updatePreview,
        generatePixiv,
        createPageIndex,
        notifyChange,
        changeLanguage,
        t,

        // 儲存／匯入介面的延遲存取，避免載入順序限制
        get dataCenter(){ return window.ProjectDataCenter || null; },
        get storage(){ return window.safeStorage || null; },

        // 外掛與事件
        on,
        once(type, handler){
            const unsubscribe = on(type, event => {
                unsubscribe();
                handler(event);
            });
            return unsubscribe;
        },
        off,
        emit,
        registerPlugin,
        unregisterPlugin,
        hasPlugin(name){ return plugins.has(name); },
        getPlugin(name){ return plugins.get(name)?.plugin || null; },
        listPlugins(){ return [...plugins.keys()]; },

        // 等候後載入的全域功能
        whenAvailable(name, callback, timeout = 10000){
            const started = Date.now();
            return new Promise((resolve, reject) => {
                const check = () => {
                    if(window[name]){
                        if(typeof callback === "function") callback(window[name], api);
                        resolve(window[name]);
                        return;
                    }
                    if(Date.now() - started >= timeout){
                        reject(new Error("等待全域功能逾時：" + name));
                        return;
                    }
                    setTimeout(check, 30);
                };
                check();
            });
        }
    };

    // 舊式外掛相容入口：避免未來又要盤查 lexical scope
    window.GamebookCore = api;
    window.GamebookPages = pages;
    window.GamebookAPI = api;
    window.getGamebookCurrentPage = () => currentPage;

    // 宣告核心就緒
    queueMicrotask(() => {
        emit("core:ready", { version: api.version });
        document.documentElement.dataset.gamebookCoreReady = "1";
        console.info("[GamebookCore] 擴充橋接層已啟用", api);
    });

})();

// ---------- 共用：在 textarea 選取範圍前後插入標籤 ----------
function insertAroundSelection(textarea, before, after){
	if(!textarea) return;

	const start = textarea.selectionStart;
	const end = textarea.selectionEnd;
	const val = textarea.value;
	const sel = val.substring(start, end);

	textarea.value =
		val.substring(0, start) +
		before + sel + after +
		val.substring(end);

	textarea.focus();
	textarea.selectionStart = start + before.length;
	textarea.selectionEnd = start + before.length + sel.length;

	// 觸發既有的 input 監聽（同步資料/預覽），不需碰原始邏輯
	textarea.dispatchEvent(new Event("input", { bubbles:true }));
}

// ---------- 2. Pixiv 小說預覽 ----------
function escapeHtml(str){
	return str
		.replace(/&/g, "&amp;")
		.replace(/</g, "&lt;")
		.replace(/>/g, "&gt;");
}

function renderPixivNovelText(text){
	if(!text) return "";

	let html = escapeHtml(text);

	// [chapter:標題] → 標題字體
	html = html.replace(
		/\[chapter:(.*?)\]/g,
		'<div class="novel-chapter-title">$1</div>'
	);

	// [newpage] → 分頁線
	html = html.replace(
		/\[newpage\]/g,
		'<hr class="novel-divider">'
	);

	// [jump:n] → 前往下一頁提示
	html = html.replace(
		/\[jump:(.*?)\]/g,
		'<div class="novel-jump">➜ 前往第 $1 頁</div>'
	);

	// 標題
	html = html.replace(/\[h1:(.*?)\]/g, "<h1>$1</h1>");
	html = html.replace(/\[h2:(.*?)\]/g, "<h2>$1</h2>");
	html = html.replace(/\[h3:(.*?)\]/g, "<h3>$1</h3>");

	// 基本文字樣式
	html = html.replace(/\[b:(.*?)\]/g, "<strong>$1</strong>");
	html = html.replace(/\[i:(.*?)\]/g, "<em>$1</em>");
	html = html.replace(/\[u:(.*?)\]/g, "<u>$1</u>");
	html = html.replace(/\[s:(.*?)\]/g, "<del>$1</del>");

	// 顏色 / 字級
	html = html.replace(/\[color:(.*?):(.*?)\]/g, '<span style="color:$1">$2</span>');
	html = html.replace(/\[size:(\d+):(.*?)\]/g, '<span style="font-size:$1px">$2</span>');

	// 引用 / 分隔線
	html = html.replace(/\[quote:([\s\S]*?)\]/g, "<blockquote>$1</blockquote>");
	html = html.replace(/\[hr\]/g, "<hr>");

	// 連結 / 圖片 / Pixiv插畫
	html = html.replace(/\[link:(.*?)\|(.*?)\]/g, '<a href="$2" target="_blank">$1</a>');
	html = html.replace(/\[img:(.*?)\]/g, '<img src="$1">');
	html = html.replace(
		/\[pixivimage:(\d+)\]/g,
		'<div class="pixiv-image-link"><a href="https://www.pixiv.net/artworks/$1" target="_blank">Pixiv插畫 $1</a></div>'
	);

	// Ruby
	html = html.replace(/\[\[rb:(.*?) > (.*?)\]\]/g, "<ruby>$1<rt>$2</rt></ruby>");

	// 清單
	html = html.replace(/\[list\]([\s\S]*?)\[\/list\]/g, function(match, content){
		const items = content
			.trim()
			.split(/\n/)
			.map(x=>x.trim())
			.filter(Boolean)
			.map(x=>"<li>" + x.replace(/^[-*]\s*/, "") + "</li>")
			.join("");
		return "<ul>" + items + "</ul>";
	});

	// 換行（最後處理）
	html = html.replace(/\n/g, "<br>");

	return html;
}

<body>
<div class="pixiv-novel-preview">${bodyHtml}</div>

<script>
(function(){
	"use strict";

	// ---------- 分頁：把長卷切成一頁一頁，模擬 Galgame 閱讀感 ----------
	// 沒按按鈕以前看不到下一頁；抵達某頁後，前面的頁面會隱藏起來
	var pages = [];
	var currentIndex = 0;

	function paginateNovel(){
		var container = document.querySelector(".pixiv-novel-preview");
		if(!container) return [];

		var children = Array.prototype.slice.call(container.childNodes);
		var result = [];
		var current = document.createElement("div");
		current.className = "novel-page-section";

		children.forEach(function(node){
			// 用原本代表 [newpage] 的分隔線來切頁，不需要更動 renderPixivNovelText()
			if(node.nodeType === 1 && node.classList && node.classList.contains("novel-divider")){
				result.push(current);
				current = document.createElement("div");
				current.className = "novel-page-section";
				return;
			}
			current.appendChild(node);
		});
		result.push(current);

		container.innerHTML = "";
		result.forEach(function(pageEl, idx){
			pageEl.dataset.pageIndex = idx;

			var nav = document.createElement("div");
			nav.className = "novel-nav";

			if(idx > 0){
				var prevBtn = document.createElement("button");
				prevBtn.type = "button";
				prevBtn.className = "novel-nav-btn";
				prevBtn.textContent = "◀ 上一頁";
				prevBtn.addEventListener("click", function(){ goToPage(idx - 1); });
				nav.appendChild(prevBtn);
			}

			var indicator = document.createElement("span");
			indicator.className = "novel-nav-page-indicator";
			indicator.textContent = "第 " + (idx + 1) + " / " + result.length + " 頁";
			nav.appendChild(indicator);

			if(idx < result.length - 1){
				var nextBtn = document.createElement("button");
				nextBtn.type = "button";
				nextBtn.className = "novel-nav-btn";
				nextBtn.textContent = "▶ 下一頁";
				nextBtn.addEventListener("click", function(){ goToPage(idx + 1); });
				nav.appendChild(nextBtn);
			}

			pageEl.appendChild(nav);
			container.appendChild(pageEl);
		});

		// 內文裡的「➜ 前往第 N 頁」提示，用事件代理統一處理點擊
		// （委派到整個小說容器，不管頁面怎麼被搬移／重建都不會失效）
		container.addEventListener("click", function(e){
			var jumpEl = e.target.closest ? e.target.closest(".novel-jump[data-target-page]") : null;
			if(!jumpEl) return;

			var targetIndex = parseInt(jumpEl.getAttribute("data-target-page"), 10) - 1;
			if(isNaN(targetIndex)) return;

			goToPage(targetIndex);
		});

		return result;
	}

	function goToPage(index){
		if(!pages.length) return;
		if(index < 0) index = 0;
		if(index > pages.length - 1) index = pages.length - 1;

		pages.forEach(function(p, i){
			p.style.display = (i === index) ? "" : "none";
		});

		currentIndex = index;

		var container = document.querySelector(".pixiv-novel-preview");
		if(container) container.scrollTop = 0;
	}

	// ---------- 書籤（存檔點／讀取點）：記錄「頁碼」而不是捲動位置 ----------
	var STORAGE_KEY = "PixivNovelPreview_Bookmarks_${novelHash}";
	var bookmarks = [];

	function loadBookmarks(){
		try{
			return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
		}catch(e){
			return [];
		}
	}

	function saveBookmarks(){
		try{
			localStorage.setItem(STORAGE_KEY, JSON.stringify(bookmarks));
		}catch(e){
			alert("書籤儲存失敗，可能是瀏覽器封鎖了本機儲存空間");
		}
	}

	function escapeHtmlLocal(str){
		return String(str)
			.replace(/&/g,"&amp;")
			.replace(/</g,"&lt;")
			.replace(/>/g,"&gt;");
	}

	function currentPageSnippet(){
		var page = pages[currentIndex];
		var title = page ? page.querySelector(".novel-chapter-title") : null;
		return title ? title.textContent : ("第 " + (currentIndex + 1) + " 頁");
	}

	function addBookmark(){
		var defaultName = currentPageSnippet();
		var name = prompt("請輸入書籤名稱（可當作存檔點名稱）：", defaultName);
		if(name === null) return;

		bookmarks.unshift({
			id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
			label: name.trim() || defaultName,
			pageIndex: currentIndex,
			snippet: currentPageSnippet(),
			createdAt: new Date().toLocaleString()
		});

		saveBookmarks();
		renderBookmarkList();
		panel.classList.add("open");
	}

	function goToBookmark(id){
		var bm = null;
		for(var i=0;i<bookmarks.length;i++){
			if(bookmarks[i].id === id){ bm = bookmarks[i]; break; }
		}
		if(!bm) return;
		goToPage(bm.pageIndex || 0);
	}

	function deleteBookmark(id){
		if(!confirm("確定要刪除這個書籤嗎？")) return;
		bookmarks = bookmarks.filter(function(b){ return b.id !== id; });
		saveBookmarks();
		renderBookmarkList();
	}

	function renderBookmarkList(){
		toggleBtn.textContent = "📑 書籤 (" + bookmarks.length + ")";

		if(!bookmarks.length){
			listEl.innerHTML = '<div class="px-bookmark-empty">尚未建立任何書籤，可當作存檔點／讀取點使用</div>';
			return;
		}

		listEl.innerHTML = bookmarks.map(function(bm){
			return '<div class="px-bookmark-item">' +
				'<div class="px-bookmark-label">' + escapeHtmlLocal(bm.label) + '</div>' +
				(bm.snippet ? '<div class="px-bookmark-snippet">' + escapeHtmlLocal(bm.snippet) + '</div>' : '') +
				'<div class="px-bookmark-snippet">' + bm.createdAt + '</div>' +
				'<div class="px-bookmark-actions">' +
					'<button class="px-bookmark-go" data-id="' + bm.id + '">前往</button>' +
					'<button class="px-bookmark-del" data-id="' + bm.id + '">刪除</button>' +
				'</div>' +
			'</div>';
		}).join("");

		var goButtons = listEl.querySelectorAll(".px-bookmark-go");
		for(var i=0;i<goButtons.length;i++){
			goButtons[i].addEventListener("click", function(e){ goToBookmark(e.target.getAttribute("data-id")); });
		}
		var delButtons = listEl.querySelectorAll(".px-bookmark-del");
		for(var j=0;j<delButtons.length;j++){
			delButtons[j].addEventListener("click", function(e){ deleteBookmark(e.target.getAttribute("data-id")); });
		}
	}

	var bar = document.createElement("div");
	bar.className = "px-bookmark-bar";

	var addBtn = document.createElement("button");
	addBtn.className = "px-bookmark-btn";
	addBtn.textContent = "🔖 加入書籤";
	addBtn.addEventListener("click", addBookmark);

	var toggleBtn = document.createElement("button");
	toggleBtn.className = "px-bookmark-btn";

	var panel = document.createElement("div");
	panel.className = "px-bookmark-panel";

	var listEl = document.createElement("div");
	panel.appendChild(listEl);

	toggleBtn.addEventListener("click", function(){
		panel.classList.toggle("open");
	});

	bar.appendChild(addBtn);
	bar.appendChild(toggleBtn);
	bar.appendChild(panel);
	document.body.appendChild(bar);

	// ---------- 初始化：分頁後只顯示第一頁 ----------
	pages = paginateNovel();
	goToPage(0);

	bookmarks = loadBookmarks();
	renderBookmarkList();
})();
<\/script>

</body>
</html>

// previewText 一有變動就同步小說預覽，不需要更動既有的 updatePreview()
let previewWatcherReady = false;
function watchPreviewText(){
	if(previewWatcherReady) return true;

	const source = document.getElementById("previewText");
	if(!source) return false;

	const previewObserver = new MutationObserver(syncNovelPreview);
	previewObserver.observe(source, {
		childList:true,
		characterData:true,
		subtree:true
	});

	previewWatcherReady = true;
	syncNovelPreview();
	return true;
}

// ---------- 初始化與觀察 DOM（處理動態建立的原始碼視窗等） ----------
function runEnhancements(){
	const a = enhanceMainToolbar();
	const b = enhanceSourceToolbar();
	const c = ensureNovelPreviewSection();
	const d = watchPreviewText();
	const e = ensureExportNovelPreviewButton();
	return a && b && c && d && e;
}

if(!runEnhancements()){
	const initObserver = new MutationObserver(function(){
		if(runEnhancements()){
			initObserver.disconnect();
		}
	});
	initObserver.observe(document.body, { childList:true, subtree:true });
}

if(document.readyState === "loading"){
	document.addEventListener("DOMContentLoaded", runEnhancements);
}

})();

<!-- 專案資料中心：集中管理存檔、讀檔、備份、JSON 匯出入 -->
<script>

/* =========================================================
   專案資料中心 ProjectDataCenter
   ---------------------------------------------------------
   未來新增可保存功能時，只要在此區塊（或功能模組結尾）註冊一次：

   ProjectDataCenter.register("myFeature", {
       save: () => window.myFeatureState,
       load: (value) => {
           window.myFeatureState = Array.isArray(value) ? value : [];
           renderMyFeature?.();
       },
       defaultValue: [],
       resetOnMissing: true
   });

   save / load / 自動備份 / JSON 匯出入 / 復原快照都會自動包含該欄位。
========================================================= */
(function () {
    "use strict";

    const STORAGE_KEYS = Object.freeze({
        library: "PixivNovelLibrary_V2",
        backup: "Pixiv_AutoBackup",
        autoSaveEnabled: "isAutoSaveEnabled"
    });

    const FORMAT = "PixivInteractiveNovelProject";
    const FORMAT_VERSION = 1;
    const adapters = new Map();
    const lifecycle = {
        beforeSave: new Set(),
        afterSave: new Set(),
        beforeLoad: new Set(),
        afterLoad: new Set()
    };
    let lastBackupAt = 0;

    function isPlainObject(value) {
        return value !== null && typeof value === "object" && !Array.isArray(value);
    }

    function clone(value, fallback) {
        if (value === undefined) return fallback;
        try {
            return JSON.parse(JSON.stringify(value));
        } catch (error) {
            console.warn("[ProjectDataCenter] 資料無法序列化，已略過。", error);
            return fallback;
        }
    }

    function readJSON(key, fallback) {
        try {
            const raw = safeStorage.getItem(key);
            return raw ? JSON.parse(raw) : clone(fallback, fallback);
        } catch (error) {
            console.warn("[ProjectDataCenter] 讀取資料失敗：" + key, error);
            return clone(fallback, fallback);
        }
    }

    function writeJSON(key, value) {
        try {
            safeStorage.setItem(key, JSON.stringify(value));
            return true;
        } catch (error) {
            console.error("[ProjectDataCenter] 儲存資料失敗：" + key, error);
            throw error;
        }
    }

    function getDefaultValue(adapter, context) {
        const source = adapter.defaultValue;
        return typeof source === "function" ? source(context) : clone(source);
    }

    function runHooks(name, context) {
        lifecycle[name].forEach(function (handler) {
            try {
                handler(context);
            } catch (error) {
                console.error("[ProjectDataCenter] 生命週期鉤子失敗：" + name, error);
            }
        });
    }

    function register(key, config) {
        if (!key || typeof key !== "string") {
            throw new TypeError("ProjectDataCenter.register 的 key 必須是非空字串。");
        }
        if (!config || typeof config.save !== "function" || typeof config.load !== "function") {
            throw new TypeError("ProjectDataCenter.register 需要 save 與 load 函式。");
        }

        adapters.set(key, Object.assign({
            description: "",
            defaultValue: undefined,
            resetOnMissing: false
        }, config));
        return api;
    }

    function unregister(key) {
        adapters.delete(key);
        return api;
    }

    function on(eventName, handler) {
        if (!lifecycle[eventName] || typeof handler !== "function") {
            throw new TypeError("不支援的生命週期事件或處理函式。\n可用事件：beforeSave、afterSave、beforeLoad、afterLoad。");
        }
        lifecycle[eventName].add(handler);
        return function () {
            lifecycle[eventName].delete(handler);
        };
    }

    function normalizeProjectData(raw) {
        const data = isPlainObject(raw) && isPlainObject(raw.data) ? raw.data : raw;
        if (!isPlainObject(data)) {
            throw new TypeError("專案資料必須是 JSON 物件。");
        }
        return data;
    }

    function serialize(options) {
        const settings = Object.assign({
            source: "manual",
            includeMetadata: true
        }, options || {});
        const context = {
            source: settings.source,
            options: settings,
            data: {}
        };

        if (settings.includeMetadata) {
            context.data._project = {
                format: FORMAT,
                version: FORMAT_VERSION,
                savedAt: new Date().toISOString(),
                source: settings.source
            };
        }

        runHooks("beforeSave", context);

        adapters.forEach(function (adapter, key) {
            try {
                const value = adapter.save(context);
                if (value !== undefined) {
                    context.data[key] = clone(value);
                }
            } catch (error) {
                console.error("[ProjectDataCenter] 保存欄位失敗：" + key, error);
            }
        });

        runHooks("afterSave", context);
        return context.data;
    }

    function restore(rawData, options) {
        const settings = Object.assign({
            source: "load",
            resetMissing: true,
            markClean: true
        }, options || {});
        const data = normalizeProjectData(rawData);
        const context = {
            source: settings.source,
            options: settings,
            data: data,
            missing: new Set(),
            selectedPageId: null
        };

        runHooks("beforeLoad", context);

        adapters.forEach(function (adapter, key) {
            const hasValue = Object.prototype.hasOwnProperty.call(data, key);
            if (!hasValue && !(settings.resetMissing && adapter.resetOnMissing)) {
                return;
            }

            try {
                const value = hasValue ? clone(data[key]) : getDefaultValue(adapter, context);
                if (!hasValue) context.missing.add(key);
                adapter.load(value, context);
            } catch (error) {
                console.error("[ProjectDataCenter] 讀取欄位失敗：" + key, error);
            }
        });

        adapters.forEach(function (adapter, key) {
            if (typeof adapter.afterLoad !== "function") return;
            try {
                adapter.afterLoad(context);
            } catch (error) {
                console.error("[ProjectDataCenter] 載入後處理失敗：" + key, error);
            }
        });

        if (context.selectedPageId && typeof selectPage === "function") {
            const selected = pages.find(function (page) {
                return page.id === context.selectedPageId;
            });
            if (selected) selectPage(selected);
        } else if (typeof pages !== "undefined" && pages.length && typeof selectPage === "function") {
            selectPage(pages[0]);
        }

        if (typeof drawLines === "function") drawLines();
        if (typeof updatePreview === "function") updatePreview();
        if (settings.markClean && typeof projectChanged !== "undefined") projectChanged = false;
	if(window.pendingWindowState){

    setTimeout(()=>{

        applyWindowState(
            window.pendingWindowState
        );

        window.pendingWindowState=null;

    },500);

}

        runHooks("afterLoad", context);
        return context.data;
    }

    function listProjects() {
        const library = readJSON(STORAGE_KEYS.library, []);
        return Array.isArray(library) ? library : [];
    }

    function writeLibrary(library) {
        return writeJSON(STORAGE_KEYS.library, Array.isArray(library) ? library : []);
    }

    function getProject(id) {
        return listProjects().find(function (project) {
            return project && project.id === id;
        }) || null;
    }

    function getActiveProjectId() {
        return window.state && window.state.currentTab ? window.state.currentTab : null;
    }

    function setActiveProjectId(id) {
        window.state = window.state || {};
        window.state.currentTab = id || null;
    }

    // 專案名稱必須與第一個頁面／Node 標題分離。
    // fallback 是專案資料庫中已保存的名稱，應永遠優先保留；
    // 只有建立全新、尚未命名的專案時，才以第一頁標題作為初始候選名稱。
    function projectNameFrom(data, fallback) {
        const savedName = typeof fallback === "string" ? fallback.trim() : "";
        if (savedName) return savedName;

        const firstPage = data && Array.isArray(data.pages) ? data.pages[0] : null;
        const firstPageTitle = firstPage && typeof firstPage.title === "string"
            ? firstPage.title.trim()
            : "";

        return firstPageTitle || "未命名作品";
    }

    function updateProjectLabel(name) {
        const label = document.getElementById("currentProjectName");
        if (label) label.textContent = "📁 " + name;
    }

    function saveProject(options) {
        const settings = Object.assign({
            silent: false,
            auto: false
        }, options || {});
        const data = serialize({
            source: settings.auto ? "auto-save" : "manual-save"
        });
        const library = listProjects();
        const activeId = getActiveProjectId();
        const index = activeId ? library.findIndex(function (project) {
            return project && project.id === activeId;
        }) : -1;
        const now = new Date().toISOString();
        let project;
        let created = false;

        if (index >= 0) {
            project = Object.assign({}, library[index], {
                name: projectNameFrom(data, library[index].name),
                data: data,
                updatedAt: now
            });
            library[index] = project;
        } else {
            created = true;
            project = {
                id: crypto.randomUUID(),
                name: projectNameFrom(data),
                data: data,
                createdAt: now,
                updatedAt: now
            };
            library.push(project);
            setActiveProjectId(project.id);
        }

        writeLibrary(library);
        updateProjectLabel(project.name);
        if (typeof projectChanged !== "undefined") projectChanged = false;

        if (!settings.silent) {
            alert(created ? "已建立新專案並儲存。" : "專案已儲存。");
        }
        return project;
    }

    function loadProjectData(projectData, options) {
        const settings = Object.assign({
            source: "project-load",
            resetMissing: true
        }, options || {});
        const restored = restore(projectData, settings);
        if (typeof window.unlockEditor === "function") window.unlockEditor();
        return restored;
    }

    function autoBackup() {
        const backup = serialize({ source: "auto-backup" });
        backup._backup = {
            savedAt: Date.now(),
            label: "自動備份"
        };
        writeJSON(STORAGE_KEYS.backup, backup);
        lastBackupAt = Date.now();
        return backup;
    }

    function restoreAutoBackup() {
        const backup = readJSON(STORAGE_KEYS.backup, null);
        if (!backup || !isPlainObject(backup)) {
            alert("目前沒有可用的自動備份紀錄。");
            return false;
        }

        const savedAt = backup._backup && backup._backup.savedAt
            ? new Date(backup._backup.savedAt).toLocaleString()
            : "未知時間";
        const pageCount = Array.isArray(backup.pages) ? backup.pages.length : 0;
        if (!confirm("找到一份自動備份（" + savedAt + "，共 " + pageCount + " 頁）。\n還原後會覆蓋目前畫布內容，確定要還原嗎？")) {
            return false;
        }

        loadProjectData(backup, {
            source: "auto-backup-restore",
            resetMissing: true
        });
        alert("已還原自動備份。");
        return true;
    }

    function downloadJSON() {
        const data = serialize({ source: "json-export" });
        const blob = new Blob([JSON.stringify(data, null, 2)], {
            type: "application/json;charset=utf-8"
        });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        const project = getProject(getActiveProjectId());
        const baseName = (project ? project.name : projectNameFrom(data))
            .replace(/[\\/:*?"<>|]+/g, "_")
            .slice(0, 80) || "project";

        link.href = url;
        link.download = baseName + ".json";
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(function () {
            URL.revokeObjectURL(url);
        }, 0);
    }

    function importJSONFile(file) {
        if (!file) return Promise.resolve(false);
        return file.text()
            .then(function (text) {
                const data = JSON.parse(text);
                loadProjectData(data, {
                    source: "json-import",
                    resetMissing: true
                });
                alert("JSON 匯入完成。");
                return true;
            })
            .catch(function (error) {
                console.error("[ProjectDataCenter] JSON 匯入失敗", error);
                alert("匯入失敗，請確認 JSON 檔案格式是否正確。");
                return false;
            });
    }

    function bindPrimarySaveButton() {
        const oldButton = document.getElementById("saveProject");
        if (!oldButton || oldButton.dataset.projectDataCenterBound === "true") return;

        const button = oldButton.cloneNode(true);
        button.dataset.projectDataCenterBound = "true";
        oldButton.replaceWith(button);
        button.addEventListener("click", function () {
            saveProject({ silent: false });
        });
    }

    function bindJsonTools() {
        const tools = document.getElementById("plugin-custom-tools");
        if (!tools) return;

        const buttons = tools.querySelectorAll("button");
        const exportButton = buttons[0];
        const importButton = buttons[1];

        if (exportButton) {
            exportButton.onclick = downloadJSON;
        }
        if (input) {
            input.accept = ".json,application/json";

        const legacyInput = oldInput.cloneNode(true);
        legacyInput.dataset.projectDataCenterBound = "true";
        oldInput.replaceWith(legacyInput);

            const file = event.target.files && event.target.files[0];

                legacyInput.value = "";

    }

                window.restoreWindowState(state);

        load: function (items) {
            if (typeof pages === "undefined" || !Array.isArray(pages)) return;

            const canvas = document.getElementById("flowCanvas");

            pages.splice(0, pages.length);
            if (canvas) canvas.innerHTML = "";

            source.forEach(function (item) {
                const page = new NovelPage();
                page.id = item && item.id ? item.id : crypto.randomUUID();
                page.title = item && typeof item.title === "string" ? item.title : "";
                page.text = item && typeof item.text === "string" ? item.text : "";
                page.note = item && typeof item.note === "string" ? item.note : "";
                page.groupId = item && item.groupId ? item.groupId : null;

    register("drawings", {

    });

    register("editorSelection", {

    window.ProjectDataCenter = api;

    window.importProjectData = function (projectData, options) {
        return loadProjectData(projectData, options);
    };
    window.saveProject = saveProject;
    window.autoBackupProject = autoBackup;
    window.restoreAutoBackup = restoreAutoBackup;

    bindPrimarySaveButton();
    bindJsonTools();
    bindLegacyJsonInput();
    synchronizeTabSelection();

    // 舊的 interval 仍會保留；新版在其後覆寫同一份備份，確保欄位一致。
    setInterval(function () {
        if (Date.now() - lastBackupAt >= 55000) autoBackup();
    }, 60000);

    console.info("[ProjectDataCenter] 已啟用。新增功能請使用 ProjectDataCenter.register() 註冊。", api.listFeatures());
})();

 function visualFallback(cmd,val,arg){
   const selection=window.getSelection();

   if(!hed.contains(range.commonAncestorContainer))return;
   const tags={bold:'strong',italic:'em',underline:'u',strikeThrough:'del'};
   let tag=cmd==='formatBlock'?String(val||'p').toLowerCase():tags[cmd];
   if(cmd==='insertUnorderedList'||cmd==='insertOrderedList')tag=cmd==='insertOrderedList'?'ol':'ul';

<script id="pixiv-editor-stable-repair-plugin">
(function(){
    'use strict';

    function ready(fn){
        if(document.readyState === 'loading'){
            document.addEventListener('DOMContentLoaded', fn, {once:true});
        }else{
            fn();
        }
    }

    ready(function(){
        /* 舊所見即得外掛會依 body class 隱藏 #pageText；Pixiv 已有自己的預覽分頁，故固定為 code 狀態。 */
        document.body.classList.add('wysiwyg-code-mode');

        const previewFloat = document.getElementById('previewFloat');
        if(previewFloat){
            previewFloat.setAttribute('aria-hidden', 'true');
        }

        function repairWorkspace(){
            const workspace = document.getElementById('pixivWorkspace');
            const source = document.getElementById('pageText');
            if(!workspace || !source) return false;

            const buttons = workspace.querySelectorAll('.format-subtabs button[data-view]');
            const active = workspace.querySelector('.format-subtabs button[data-view].active');
            const initialView = active ? active.dataset.view : 'source';
            workspace.dataset.pixivView = initialView;

            function applyView(view){
                workspace.dataset.pixivView = view;

                if(view === 'source'){
                    source.style.removeProperty('display');
                    source.style.removeProperty('visibility');
                    source.style.removeProperty('opacity');
                    requestAnimationFrame(function(){
                        source.style.setProperty('display','block','important');
                    });
                }
            }

            buttons.forEach(function(button){
                button.addEventListener('click', function(){
                    applyView(button.dataset.view || 'source');
                });
            });

            applyView(initialView);
            return true;
        }

        if(!repairWorkspace()){
            let tries = 0;
            const timer = setInterval(function(){
                tries += 1;
                if(repairWorkspace() || tries > 40){
                    clearInterval(timer);
                }
            }, 100);
        }
    });
})();
</script>

<script id="firehaha-safe-canvas">
(function(){
    "use strict";
    function start(){
        const panel = document.getElementById("flowPanel");
        const canvas = document.getElementById("flowCanvas");
        const lines = document.getElementById("linesCanvas");
        if(!panel || !canvas || !lines) return;

        const tools = document.createElement("div");
        tools.className = "safe-canvas-tools";
        tools.setAttribute("role", "toolbar");
        tools.setAttribute("aria-label", "畫布工具");
        tools.innerHTML =
            '<button type="button" data-action="out" title="縮小">−</button>' +
            '<output>100%</output>' +
            '<button type="button" data-action="in" title="放大">＋</button>' +
            '<button type="button" data-action="reset" title="恢復原始大小">1:1</button>' +
            '<button type="button" data-action="wallpaper" title="選擇畫布桌布">🖼️ 桌布</button>' +
            '<button type="button" data-action="clear" title="清除畫布桌布">清除</button>' +
            '<input type="file" accept="image/*" hidden>';
        panel.parentElement.insertBefore(tools, panel);

        const output = tools.querySelector("output");
        const picker = tools.querySelector('input[type="file"]');
        let scale = 1;
        let wallpaperUrl = "";
        window.__flowCanvasScale = scale;

        function setScale(value, clientX, clientY){
            const next = Math.max(.4, Math.min(2, value));
            const old = scale;
            if(Math.abs(next - old) < .001) return;
            const rect = panel.getBoundingClientRect();
            const x = typeof clientX === "number" ? clientX - rect.left : panel.clientWidth / 2;
            const y = typeof clientY === "number" ? clientY - rect.top : panel.clientHeight / 2;
            const logicalX = (panel.scrollLeft + x) / old;
            const logicalY = (panel.scrollTop + y) / old;
            scale = next;
            window.__flowCanvasScale = scale;
            panel.style.setProperty("--safe-canvas-scale", scale);
            output.value = Math.round(scale * 100) + "%";
            requestAnimationFrame(function(){
                panel.scrollLeft = logicalX * scale - x;
                panel.scrollTop = logicalY * scale - y;
            });
        }

        tools.addEventListener("click", function(event){
            const button = event.target.closest("button");
            if(!button) return;
            const action = button.dataset.action;
            if(action === "in") setScale(scale + .1);
            if(action === "out") setScale(scale - .1);
            if(action === "reset") setScale(1);
            if(action === "wallpaper") picker.click();
            if(action === "clear"){
                panel.style.removeProperty("background-image");
                panel.style.removeProperty("background-size");
                panel.style.removeProperty("background-position");
                if(wallpaperUrl) URL.revokeObjectURL(wallpaperUrl);
                wallpaperUrl = "";
            }
        });

        panel.addEventListener("wheel", function(event){
            event.preventDefault();
            setScale(scale + (event.deltaY < 0 ? .08 : -.08), event.clientX, event.clientY);
        }, {passive:false});

        let pinchDistance = 0;
        let pinchScale = 1;
        function distance(touches){
            return Math.hypot(
                touches[0].clientX - touches[1].clientX,
                touches[0].clientY - touches[1].clientY
            );
        }
        panel.addEventListener("touchstart", function(event){
            if(event.touches.length !== 2) return;
            pinchDistance = distance(event.touches);
            pinchScale = scale;
        }, {passive:true});
        panel.addEventListener("touchmove", function(event){
            if(event.touches.length !== 2 || !pinchDistance) return;
            event.preventDefault();
            const x = (event.touches[0].clientX + event.touches[1].clientX) / 2;
            const y = (event.touches[0].clientY + event.touches[1].clientY) / 2;
            setScale(pinchScale * distance(event.touches) / pinchDistance, x, y);
        }, {passive:false});
        panel.addEventListener("touchend", function(event){
            if(event.touches.length < 2) pinchDistance = 0;
        }, {passive:true});

        picker.addEventListener("change", function(){
            const file = picker.files && picker.files[0];
            if(!file) return;
            if(!file.type.startsWith("image/")){
                alert("請選擇圖片檔案。");
                return;
            }
            if(wallpaperUrl) URL.revokeObjectURL(wallpaperUrl);
            wallpaperUrl = URL.createObjectURL(file);
            panel.style.backgroundImage =
                'linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.55)),url("' + wallpaperUrl + '")';
            panel.style.backgroundSize = "auto, cover";
            panel.style.backgroundPosition = "0 0, center";
            picker.value = "";
        });
    }
    if(document.readyState === "loading"){
        document.addEventListener("DOMContentLoaded", start, {once:true});
    }else{
        start();
    }
})();
</script>
