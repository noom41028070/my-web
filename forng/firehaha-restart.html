<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>Firehaha 工作區重新啟動</title>

<style>
  :root{
    color-scheme:light dark;
  }

  *{
    box-sizing:border-box;
  }

  html,
  body{
    width:100%;
    min-height:100%;
    margin:0;
  }

  body{
    display:grid;
    place-items:center;
    padding:24px;
    font-family:
      system-ui,
      -apple-system,
      "Segoe UI",
      "Noto Sans TC",
      sans-serif;
    background:
      radial-gradient(
        circle at 50% 30%,
        #eef6ff,
        #dce9f7 48%,
        #cbd9e8
      );
    color:#25384d;
  }

  .restart-card{
    width:min(520px,100%);
    padding:28px;
    border:
      1px solid
      rgba(47,75,105,.18);
    border-radius:22px;
    background:
      rgba(255,255,255,.9);
    box-shadow:
      0 24px 70px
      rgba(37,56,77,.22);
    text-align:center;
    backdrop-filter:
      blur(12px);
  }

  .restart-icon{
    display:grid;
    place-items:center;
    width:74px;
    height:74px;
    margin:0 auto 16px;
    border-radius:22px;
    background:
      linear-gradient(
        145deg,
        #315f8e,
        #1d3856
      );
    color:#fff;
    font-size:36px;
    box-shadow:
      0 12px 30px
      rgba(32,62,94,.3);
  }

  h1{
    margin:0 0 9px;
    font-size:24px;
  }

  p{
    margin:0;
    color:#637487;
    line-height:1.7;
  }

  .progress-track{
    width:100%;
    height:10px;
    margin:24px 0 12px;
    overflow:hidden;
    border-radius:999px;
    background:#dce5ef;
  }

  .progress-bar{
    width:0;
    height:100%;
    border-radius:inherit;
    background:
      linear-gradient(
        90deg,
        #3d78ae,
        #7557c9
      );
    transition:
      width 120ms linear;
  }

  .status{
    min-height:24px;
    font-size:13px;
    font-weight:750;
    color:#3c5b78;
  }

  .actions{
    display:flex;
    justify-content:center;
    gap:9px;
    margin-top:20px;
  }

  button{
    min-height:40px;
    padding:8px 15px;
    border:
      1px solid #bdcad7;
    border-radius:10px;
    background:#fff;
    color:#30485f;
    font-weight:750;
    cursor:pointer;
  }

  button.primary{
    border-color:#315f8e;
    background:#315f8e;
    color:#fff;
  }

  .detail{
    margin-top:16px;
    padding:10px;
    border-radius:10px;
    background:#edf3f8;
    color:#718092;
    font-size:11px;
    line-height:1.5;
    word-break:break-all;
  }

  @media(prefers-color-scheme:dark){

    body{
      background:
        radial-gradient(
          circle at 50% 30%,
          #24364b,
          #172536 50%,
          #101a27
        );
      color:#e9f2fb;
    }

    .restart-card{
      background:
        rgba(25,39,55,.93);
      border-color:
        rgba(255,255,255,.12);
    }

    p,
    .detail{
      color:#aebccc;
    }

    .progress-track{
      background:#34485d;
    }

    .status{
      color:#bdd6ec;
    }

    button{
      border-color:#52677d;
      background:#25384b;
      color:#e7f0f8;
    }

    .detail{
      background:#203246;
    }

  }
</style>
</head>

<body>

<main class="restart-card">

  <div class="restart-icon">
    🔄
  </div>

  <h1>
    正在重新建立工作區
  </h1>

  <p>
    舊頁面的 DOM、事件監聽器、影音解碼與外掛暫存將會被釋放。
  </p>

  <div class="progress-track">
    <div
      class="progress-bar"
      id="progressBar">
    </div>
  </div>

  <div
    class="status"
    id="statusText">
    正在準備……
  </div>

  <div class="actions">

    <button
      type="button"
      class="primary"
      id="continueButton">
      立即返回
    </button>

    <button
      type="button"
      id="cancelButton">
      取消
    </button>

  </div>

  <div
    class="detail"
    id="targetDetail">
  </div>

</main>

<script>
(function(){

  "use strict";


  const params =
    new URLSearchParams(
      location.search
    );


  const rawReturnUrl =
    params.get(
      "return"
    );


  const delayValue =
    Number(
      params.get(
        "delay"
      )
    );


  const delay =
    Number.isFinite(
      delayValue
    )
      ? Math.max(
          300,
          Math.min(
            10000,
            delayValue
          )
        )
      : 1500;


  const progressBar =
    document.getElementById(
      "progressBar"
    );


  const statusText =
    document.getElementById(
      "statusText"
    );


  const continueButton =
    document.getElementById(
      "continueButton"
    );


  const cancelButton =
    document.getElementById(
      "cancelButton"
    );


  const targetDetail =
    document.getElementById(
      "targetDetail"
    );


  let cancelled =
    false;


  let redirected =
    false;


  function getSafeReturnUrl(){

    if(!rawReturnUrl){

      return "./firehaha.html";

    }


    try{

      const target =
        new URL(
          rawReturnUrl,
          location.href
        );


      /*
       * 只允許一般網頁或本機檔案。
       * 不允許 javascript: 等危險協定。
       */
      if(
        target.protocol !== "http:" &&
        target.protocol !== "https:" &&
        target.protocol !== "file:"
      ){

        throw new Error(
          "不支援的返回網址協定"
        );

      }


      return target.href;

    }catch(error){

      console.warn(
        "[Firehaha Restart] 返回網址無效",
        error
      );


      return "./firehaha.html";

    }

  }


  const returnUrl =
    getSafeReturnUrl();


  targetDetail.textContent =
    "返回位置：" +
    returnUrl;


  function createRestoreUrl(){

    try{

      const target =
        new URL(
          returnUrl,
          location.href
        );


      target.searchParams.set(
        "firehahaRestore",
        "1"
      );


      target.searchParams.set(
        "firehahaRestartedAt",
        String(
          Date.now()
        )
      );


      return target.href;

    }catch(error){

      return returnUrl;

    }

  }


  function redirectBack(){

    if(
      redirected ||
      cancelled
    ){

      return;

    }


    redirected =
      true;


    statusText.textContent =
      "正在開啟乾淨的工作區……";


    progressBar.style.width =
      "100%";


    location.replace(
      createRestoreUrl()
    );

  }


  continueButton.addEventListener(
    "click",
    redirectBack
  );


  cancelButton.addEventListener(
    "click",
    function(){

      cancelled =
        true;


      statusText.textContent =
        "已取消自動返回";


      progressBar.style.width =
        "0%";


      continueButton.textContent =
        "返回工作區";


      cancelButton.disabled =
        true;

    }
  );


  const startedAt =
    performance.now();


  function update(){

    if(
      cancelled ||
      redirected
    ){

      return;

    }


    const elapsed =
      performance.now() -
      startedAt;


    const ratio =
      Math.min(
        1,
        elapsed /
        delay
      );


    progressBar.style.width =
      (
        ratio *
        100
      ).toFixed(1) +
      "%";


    if(ratio < .35){

      statusText.textContent =
        "正在關閉舊工作區……";

    }else if(ratio < .75){

      statusText.textContent =
        "正在釋放外掛與畫面資源……";

    }else{

      statusText.textContent =
        "正在準備重新載入……";

    }


    if(ratio >= 1){

      redirectBack();

      return;

    }


    requestAnimationFrame(
      update
    );

  }


  requestAnimationFrame(
    update
  );

})();
</script>

</body>
</html>
