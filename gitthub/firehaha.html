<!-- 專案資料中心：集中管理存檔、讀檔、備份、JSON 匯出入 -->
<script>

/* =========================================================
   專案資料中心 ProjectDataCenter
   ---------------------------------------------------------
   未來新增可保存功能時，只要在此區塊（或功能模組結尾）註冊一次：

   ProjectDataCenter.register("myFeature", {
       save: () => window.myFeatureState,
       load: (value) => {
           window.myFeatureState = Array.isArray(value) ? value : [];
           renderMyFeature?.();
       },
       defaultValue: [],
       resetOnMissing: true
   });

   save / load / 自動備份 / JSON 匯出入 / 復原快照都會自動包含該欄位。
========================================================= */
(function () {
    "use strict";

    const STORAGE_KEYS = Object.freeze({
        library: "PixivNovelLibrary_V2",
        backup: "Pixiv_AutoBackup",
        autoSaveEnabled: "isAutoSaveEnabled"
    });

    const FORMAT = "PixivInteractiveNovelProject";
    const FORMAT_VERSION = 1;
    const adapters = new Map();
    const lifecycle = {
        beforeSave: new Set(),
        afterSave: new Set(),
        beforeLoad: new Set(),
        afterLoad: new Set()
    };
    let lastBackupAt = 0;

    function isPlainObject(value) {
        return value !== null && typeof value === "object" && !Array.isArray(value);
    }

    function clone(value, fallback) {
        if (value === undefined) return fallback;
        try {
            return JSON.parse(JSON.stringify(value));
        } catch (error) {
            console.warn("[ProjectDataCenter] 資料無法序列化，已略過。", error);
            return fallback;
        }
    }

    function readJSON(key, fallback) {
        try {
            const raw = safeStorage.getItem(key);
            return raw ? JSON.parse(raw) : clone(fallback, fallback);
        } catch (error) {
            console.warn("[ProjectDataCenter] 讀取資料失敗：" + key, error);
            return clone(fallback, fallback);
        }
    }

    function writeJSON(key, value) {
        try {
            safeStorage.setItem(key, JSON.stringify(value));
            return true;
        } catch (error) {
            console.error("[ProjectDataCenter] 儲存資料失敗：" + key, error);
            throw error;
        }
    }

    function getDefaultValue(adapter, context) {
        const source = adapter.defaultValue;
        return typeof source === "function" ? source(context) : clone(source);
    }

    function runHooks(name, context) {
        lifecycle[name].forEach(function (handler) {
            try {
                handler(context);
            } catch (error) {
                console.error("[ProjectDataCenter] 生命週期鉤子失敗：" + name, error);
            }
        });
    }

    function register(key, config) {
        if (!key || typeof key !== "string") {
            throw new TypeError("ProjectDataCenter.register 的 key 必須是非空字串。");
        }
        if (!config || typeof config.save !== "function" || typeof config.load !== "function") {
            throw new TypeError("ProjectDataCenter.register 需要 save 與 load 函式。");
        }

        adapters.set(key, Object.assign({
            description: "",
            defaultValue: undefined,
            resetOnMissing: false
        }, config));
        return api;
    }

    function unregister(key) {
        adapters.delete(key);
        return api;
    }

    function on(eventName, handler) {
        if (!lifecycle[eventName] || typeof handler !== "function") {
            throw new TypeError("不支援的生命週期事件或處理函式。\n可用事件：beforeSave、afterSave、beforeLoad、afterLoad。");
        }
        lifecycle[eventName].add(handler);
        return function () {
            lifecycle[eventName].delete(handler);
        };
    }

    function normalizeProjectData(raw) {
        const data = isPlainObject(raw) && isPlainObject(raw.data) ? raw.data : raw;
        if (!isPlainObject(data)) {
            throw new TypeError("專案資料必須是 JSON 物件。");
        }
        return data;
    }

    function serialize(options) {
        const settings = Object.assign({
            source: "manual",
            includeMetadata: true
        }, options || {});
        const context = {
            source: settings.source,
            options: settings,
            data: {}
        };

        if (settings.includeMetadata) {
            context.data._project = {
                format: FORMAT,
                version: FORMAT_VERSION,
                savedAt: new Date().toISOString(),
                source: settings.source
            };
        }

        runHooks("beforeSave", context);

        adapters.forEach(function (adapter, key) {
            try {
                const value = adapter.save(context);
                if (value !== undefined) {
                    context.data[key] = clone(value);
                }
            } catch (error) {
                console.error("[ProjectDataCenter] 保存欄位失敗：" + key, error);
            }
        });

        runHooks("afterSave", context);
        return context.data;
    }

    function restore(rawData, options) {
        const settings = Object.assign({
            source: "load",
            resetMissing: true,
            markClean: true
        }, options || {});
        const data = normalizeProjectData(rawData);
        const context = {
            source: settings.source,
            options: settings,
            data: data,
            missing: new Set(),
            selectedPageId: null
        };

        runHooks("beforeLoad", context);

        adapters.forEach(function (adapter, key) {
            const hasValue = Object.prototype.hasOwnProperty.call(data, key);
            if (!hasValue && !(settings.resetMissing && adapter.resetOnMissing)) {
                return;
            }

            try {
                const value = hasValue ? clone(data[key]) : getDefaultValue(adapter, context);
                if (!hasValue) context.missing.add(key);
                adapter.load(value, context);
            } catch (error) {
                console.error("[ProjectDataCenter] 讀取欄位失敗：" + key, error);
            }
        });

        adapters.forEach(function (adapter, key) {
            if (typeof adapter.afterLoad !== "function") return;
            try {
                adapter.afterLoad(context);
            } catch (error) {
                console.error("[ProjectDataCenter] 載入後處理失敗：" + key, error);
            }
        });

        if (context.selectedPageId && typeof selectPage === "function") {
            const selected = pages.find(function (page) {
                return page.id === context.selectedPageId;
            });
            if (selected) selectPage(selected);
        } else if (typeof pages !== "undefined" && pages.length && typeof selectPage === "function") {
            selectPage(pages[0]);
        }

        if (typeof drawLines === "function") drawLines();
        if (typeof updatePreview === "function") updatePreview();
        if (settings.markClean && typeof projectChanged !== "undefined") projectChanged = false;
	if(window.pendingWindowState){

    setTimeout(()=>{

        applyWindowState(
            window.pendingWindowState
        );

        window.pendingWindowState=null;

    },500);

}

        runHooks("afterLoad", context);
        return context.data;
    }

    function listProjects() {
        const library = readJSON(STORAGE_KEYS.library, []);
        return Array.isArray(library) ? library : [];
    }

    function writeLibrary(library) {
        return writeJSON(STORAGE_KEYS.library, Array.isArray(library) ? library : []);
    }

    function getProject(id) {
        return listProjects().find(function (project) {
            return project && project.id === id;
        }) || null;
    }

    function getActiveProjectId() {
        return window.state && window.state.currentTab ? window.state.currentTab : null;
    }

    function setActiveProjectId(id) {
        window.state = window.state || {};
        window.state.currentTab = id || null;
    }

    // 專案名稱必須與第一個頁面／Node 標題分離。
    // fallback 是專案資料庫中已保存的名稱，應永遠優先保留；
    // 只有建立全新、尚未命名的專案時，才以第一頁標題作為初始候選名稱。
    function projectNameFrom(data, fallback) {
        const savedName = typeof fallback === "string" ? fallback.trim() : "";
        if (savedName) return savedName;

        const firstPage = data && Array.isArray(data.pages) ? data.pages[0] : null;
        const firstPageTitle = firstPage && typeof firstPage.title === "string"
            ? firstPage.title.trim()
            : "";

        return firstPageTitle || "未命名作品";
    }

    function updateProjectLabel(name) {
        const label = document.getElementById("currentProjectName");
        if (label) label.textContent = "📁 " + name;
    }

    function saveProject(options) {
        const settings = Object.assign({
            silent: false,
            auto: false
        }, options || {});
        const data = serialize({
            source: settings.auto ? "auto-save" : "manual-save"
        });
        const library = listProjects();
        const activeId = getActiveProjectId();
        const index = activeId ? library.findIndex(function (project) {
            return project && project.id === activeId;
        }) : -1;
        const now = new Date().toISOString();
        let project;
        let created = false;

        if (index >= 0) {
            project = Object.assign({}, library[index], {
                name: projectNameFrom(data, library[index].name),
                data: data,
                updatedAt: now
            });
            library[index] = project;
        } else {
            created = true;
            project = {
                id: crypto.randomUUID(),
                name: projectNameFrom(data),
                data: data,
                createdAt: now,
                updatedAt: now
            };
            library.push(project);
            setActiveProjectId(project.id);
        }

        writeLibrary(library);
        updateProjectLabel(project.name);
        if (typeof projectChanged !== "undefined") projectChanged = false;

        if (!settings.silent) {
            alert(created ? "已建立新專案並儲存。" : "專案已儲存。");
        }
        return project;
    }

    function loadProjectData(projectData, options) {
        const settings = Object.assign({
            source: "project-load",
            resetMissing: true
        }, options || {});
        const restored = restore(projectData, settings);
        if (typeof window.unlockEditor === "function") window.unlockEditor();
        return restored;
    }

    function autoBackup() {
        const backup = serialize({ source: "auto-backup" });
        backup._backup = {
            savedAt: Date.now(),
            label: "自動備份"
        };
        writeJSON(STORAGE_KEYS.backup, backup);
        lastBackupAt = Date.now();
        return backup;
    }

    function restoreAutoBackup() {
        const backup = readJSON(STORAGE_KEYS.backup, null);
        if (!backup || !isPlainObject(backup)) {
            alert("目前沒有可用的自動備份紀錄。");
            return false;
        }

        const savedAt = backup._backup && backup._backup.savedAt
            ? new Date(backup._backup.savedAt).toLocaleString()
            : "未知時間";
        const pageCount = Array.isArray(backup.pages) ? backup.pages.length : 0;
        if (!confirm("找到一份自動備份（" + savedAt + "，共 " + pageCount + " 頁）。\n還原後會覆蓋目前畫布內容，確定要還原嗎？")) {
            return false;
        }

        loadProjectData(backup, {
            source: "auto-backup-restore",
            resetMissing: true
        });
        alert("已還原自動備份。");
        return true;
    }

    function downloadJSON() {
        const data = serialize({ source: "json-export" });
        const blob = new Blob([JSON.stringify(data, null, 2)], {
            type: "application/json;charset=utf-8"
        });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        const project = getProject(getActiveProjectId());
        const baseName = (project ? project.name : projectNameFrom(data))
            .replace(/[\\/:*?"<>|]+/g, "_")
            .slice(0, 80) || "project";

        link.href = url;
        link.download = baseName + ".json";
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(function () {
            URL.revokeObjectURL(url);
        }, 0);
    }

    function importJSONFile(file) {
        if (!file) return Promise.resolve(false);
        return file.text()
            .then(function (text) {
                const data = JSON.parse(text);
                loadProjectData(data, {
                    source: "json-import",
                    resetMissing: true
                });
                alert("JSON 匯入完成。");
                return true;
            })
            .catch(function (error) {
                console.error("[ProjectDataCenter] JSON 匯入失敗", error);
                alert("匯入失敗，請確認 JSON 檔案格式是否正確。");
                return false;
            });
    }

    function bindPrimarySaveButton() {
        const oldButton = document.getElementById("saveProject");
        if (!oldButton || oldButton.dataset.projectDataCenterBound === "true") return;

        const button = oldButton.cloneNode(true);
        button.dataset.projectDataCenterBound = "true";
        oldButton.replaceWith(button);
        button.addEventListener("click", function () {
            saveProject({ silent: false });
        });
    }

    function bindJsonTools() {
        const tools = document.getElementById("plugin-custom-tools");
        if (!tools) return;

        const buttons = tools.querySelectorAll("button");
        const exportButton = buttons[0];
        const importButton = buttons[1];
        const input = tools.querySelector("input[type='file']");

        if (exportButton) {
            exportButton.onclick = downloadJSON;
        }
        if (input) {
            input.accept = ".json,application/json";
            input.onchange = function (event) {
                const file = event.target.files && event.target.files[0];
                importJSONFile(file).finally(function () {
                    input.value = "";
                });
            };
        }
        if (importButton && input) {
            importButton.onclick = function () {
                input.click();
            };
        }
    }

    function bindLegacyJsonInput() {
        const oldInput = document.querySelector("header input[type='file'][accept='.json']");
        if (!oldInput || oldInput.dataset.projectDataCenterBound === "true") return;

        // 舊版用 addEventListener 綁定讀檔；以 cloneNode 移除它，避免新舊流程各跑一次。
        const legacyInput = oldInput.cloneNode(true);
        legacyInput.dataset.projectDataCenterBound = "true";
        oldInput.replaceWith(legacyInput);
        legacyInput.onchange = function (event) {
            const file = event.target.files && event.target.files[0];
            importJSONFile(file).finally(function () {
                legacyInput.value = "";
            });
        };
    }

    function synchronizeTabSelection() {
        const legacySwitchTab = window.switchTab;
        if (typeof legacySwitchTab === "function" && !legacySwitchTab.__projectDataCenterWrapped) {
            function wrappedSwitchTab(id) {
                setActiveProjectId(id);
                return legacySwitchTab.apply(this, arguments);
            }
            wrappedSwitchTab.__projectDataCenterWrapped = true;
            window.switchTab = wrappedSwitchTab;
        }

        const legacyLoadProject = window.loadProject;
        if (typeof legacyLoadProject === "function" && !legacyLoadProject.__projectDataCenterWrapped) {
            function wrappedLoadProject(index) {
                const project = listProjects()[Number(index)];
                if (project) setActiveProjectId(project.id);
                return legacyLoadProject.apply(this, arguments);
            }
            wrappedLoadProject.__projectDataCenterWrapped = true;
            window.loadProject = wrappedLoadProject;
        }
    }

    function applyWindowState(state) {
        if (!isPlainObject(state)) return;
        window.lastWindowState = clone(state, {});

        setTimeout(function () {
            // 舊編輯器的 restoreWindowState() 仍可沿用；名稱刻意與本函式區隔，避免遞迴。
            if (typeof window.restoreWindowState === "function") {
                window.restoreWindowState(state);
            }

            Object.keys(state).forEach(function (id) {
                const element = document.getElementById(id);
                const saved = state[id];
                if (!element || !isPlainObject(saved)) return;

                ["left", "top", "right", "bottom", "width", "height", "display"].forEach(function (property) {
                    if (id === "editorFloat" && property === "bottom") {
                        element.style.bottom = "auto";
                        return;
                    }
                    if (typeof saved[property] === "string") {
                        element.style[property] = saved[property];
                    }
                });
                if (typeof saved.className === "string") {
                    element.className = saved.className;
                }
            });

            window.FirehahaFloatingEditorLayout?.sync?.();
        }, 0);
    }

    const api = {
        format: FORMAT,
        version: FORMAT_VERSION,
        keys: STORAGE_KEYS,
        register: register,
        unregister: unregister,
        has: function (key) { return adapters.has(key); },
        listFeatures: function () {
            return Array.from(adapters.entries()).map(function (entry) {
                return {
                    key: entry[0],
                    description: entry[1].description || "",
                    resetOnMissing: Boolean(entry[1].resetOnMissing)
                };
            });
        },
        on: on,
        serialize: serialize,
        restore: restore,
        saveProject: saveProject,
        loadProjectData: loadProjectData,
        autoBackup: autoBackup,
        restoreAutoBackup: restoreAutoBackup,
        exportJSON: downloadJSON,
        importJSONFile: importJSONFile,
        library: {
            list: listProjects,
            write: writeLibrary,
            get: getProject
        },
        getActiveProjectId: getActiveProjectId,
        setActiveProjectId: setActiveProjectId
    };

    // -------- 內建資料欄位：後續新功能只要仿照此格式 register 一次 --------
    register("chapterStyle", {
        description: "章節標題格式設定",
        save: function () {
            return typeof chapterStyle === "undefined" ? undefined : {
                enabled: Boolean(chapterStyle.enabled),
                prefix: chapterStyle.prefix || "",
                suffix: chapterStyle.suffix || ""
            };
        },
        load: function (value) {
            if (typeof chapterStyle === "undefined" || !isPlainObject(value)) return;
            chapterStyle.enabled = value.enabled !== false;
            chapterStyle.prefix = value.prefix || "";
            chapterStyle.suffix = value.suffix || "";
        }
    });

    register("pages", {
        description: "故事頁面、節點、分支與群組",
        defaultValue: function () { return []; },
        resetOnMissing: true,
        save: function () {
            if (typeof pages === "undefined" || !Array.isArray(pages)) return [];
            return pages.map(function (page) {
                return {
                    id: page.id,
                    title: page.title || "",
                    text: page.text || "",
                    note: page.note || "",
                    groupId: page.groupId || null,
                    groupColor: page.groupColor || null,
                    options: clone(page.options || [], []),
                    x: Number.isFinite(page.x) ? page.x : 100,
                    y: Number.isFinite(page.y) ? page.y : 100
                };
            });
        },
        load: function (items) {
            if (typeof pages === "undefined" || !Array.isArray(pages)) return;
            const source = Array.isArray(items) ? items : [];
            const canvas = document.getElementById("flowCanvas");

            pages.splice(0, pages.length);
            if (canvas) canvas.innerHTML = "";

            source.forEach(function (item) {
                const page = new NovelPage();
                page.id = item && item.id ? item.id : crypto.randomUUID();
                page.title = item && typeof item.title === "string" ? item.title : "";
                page.text = item && typeof item.text === "string" ? item.text : "";
                page.note = item && typeof item.note === "string" ? item.note : "";
                page.groupId = item && item.groupId ? item.groupId : null;
                page.groupColor = item && item.groupColor ? item.groupColor : null;
                page.options = item && Array.isArray(item.options) ? clone(item.options, []) : [];
                page.x = item && Number.isFinite(item.x) ? item.x : 100;
                page.y = item && Number.isFinite(item.y) ? item.y : 100;
                pages.push(page);

                if (typeof createFlowNode === "function") createFlowNode(page);
                if (page.groupId && page.element) {
                    page.element.dataset.groupId = page.groupId;
                    page.element.style.setProperty("--groupColor", page.groupColor || "#999");
                }
            });
        }
    });

    register("notes", {
        description: "便利貼與圖片釘選",
        defaultValue: function () { return []; },
        resetOnMissing: true,
        save: function () {
            return clone(window.allNotes || [], []);
        },
        load: function (value) {
            window.allNotes = Array.isArray(value) ? clone(value, []) : [];
            if (typeof window.renderNotes === "function") window.renderNotes();
        }
    });

    register("drawings", {
        description: "自由畫筆筆劃",
        defaultValue: function () { return []; },
        resetOnMissing: true,
        save: function () {
            return clone(window.allDrawings || [], []);
        },
        load: function (value) {
            window.allDrawings = Array.isArray(value) ? clone(value, []) : [];
            if (typeof window.renderDrawings === "function") window.renderDrawings();
        }
    });

    register("windowState", {
        description: "浮動視窗位置、尺寸與顯示狀態",
        save: function () {
            if (typeof window.collectWindowState === "function") {
                return window.collectWindowState();
            }
            if (typeof getWindowState === "function") {
                return getWindowState();
            }
            return clone(window.lastWindowState || {}, {});
        },
       load: function (value) {

    window.pendingWindowState = value;

}
    });

    register("editorSelection", {
        description: "目前選取的故事頁面",
        save: function () {
            return {

<script id="pixiv-editor-stable-repair-plugin">
(function(){
    'use strict';

    function ready(fn){
        if(document.readyState === 'loading'){
            document.addEventListener('DOMContentLoaded', fn, {once:true});
        }else{
            fn();
        }
    }

    ready(function(){
        /* 舊所見即得外掛會依 body class 隱藏 #pageText；Pixiv 已有自己的預覽分頁，故固定為 code 狀態。 */
        document.body.classList.add('wysiwyg-code-mode');

        const previewFloat = document.getElementById('previewFloat');
        if(previewFloat){
            previewFloat.setAttribute('aria-hidden', 'true');
        }

        function repairWorkspace(){
            const workspace = document.getElementById('pixivWorkspace');
            const source = document.getElementById('pageText');
            if(!workspace || !source) return false;

            const buttons = workspace.querySelectorAll('.format-subtabs button[data-view]');
            const active = workspace.querySelector('.format-subtabs button[data-view].active');
            const initialView = active ? active.dataset.view : 'source';
            workspace.dataset.pixivView = initialView;

            function applyView(view){
                workspace.dataset.pixivView = view;

                if(view === 'source'){
                    source.style.removeProperty('display');
                    source.style.removeProperty('visibility');
                    source.style.removeProperty('opacity');
                    requestAnimationFrame(function(){
                        source.style.setProperty('display','block','important');
                    });
                }
            }

            buttons.forEach(function(button){
                button.addEventListener('click', function(){
                    applyView(button.dataset.view || 'source');
                });
            });

            applyView(initialView);
            return true;
        }

        if(!repairWorkspace()){
            let tries = 0;
            const timer = setInterval(function(){
                tries += 1;
                if(repairWorkspace() || tries > 40){
                    clearInterval(timer);
                }
            }, 100);
        }
    });
})();
</script>

<script id="firehaha-safe-canvas">
(function(){
    "use strict";
    function start(){
        const panel = document.getElementById("flowPanel");
        const canvas = document.getElementById("flowCanvas");
        const lines = document.getElementById("linesCanvas");
        if(!panel || !canvas || !lines) return;

        const tools = document.createElement("div");
        tools.className = "safe-canvas-tools";
        tools.setAttribute("role", "toolbar");
        tools.setAttribute("aria-label", "畫布工具");
        tools.innerHTML =
            '<button type="button" data-action="out" title="縮小">−</button>' +
            '<output>100%</output>' +
            '<button type="button" data-action="in" title="放大">＋</button>' +
            '<button type="button" data-action="reset" title="恢復原始大小">1:1</button>' +
            '<button type="button" data-action="wallpaper" title="選擇畫布桌布">🖼️ 桌布</button>' +
            '<button type="button" data-action="clear" title="清除畫布桌布">清除</button>' +
            '<input type="file" accept="image/*" hidden>';
        panel.parentElement.insertBefore(tools, panel);

        const output = tools.querySelector("output");
        const picker = tools.querySelector('input[type="file"]');
        let scale = 1;
        let wallpaperState = {vaultId:"", name:"", updatedAt:""};
        window.__flowCanvasScale = scale;

        function applyWallpaper(data){
            if(!data){
                panel.style.removeProperty("background-image");
                panel.style.removeProperty("background-size");
                panel.style.removeProperty("background-position");
                return;
            }
            panel.style.backgroundImage =
                'linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.55)),url("' +
                String(data).replace(/"/g,"%22") + '")';
            panel.style.backgroundSize = "auto, cover";
            panel.style.backgroundPosition = "0 0, center";
            panel.style.backgroundRepeat = "no-repeat";
        }

        async function restoreWallpaper(){
            if(!wallpaperState.vaultId || !window.LocalImageVault){
                applyWallpaper("");
                return;
            }
            try{
                const data = await LocalImageVault.getImage(wallpaperState.vaultId);
                applyWallpaper(data || "");
            }catch(error){
                console.warn("畫布桌布讀取失敗", error);
                applyWallpaper("");
            }
        }

        function notifyWallpaperChanged(reason){
            if(window.GamebookCore && typeof GamebookCore.notifyChange === "function"){
                GamebookCore.notifyChange(reason || "canvas-wallpaper");
            }
            if(typeof window.markDirty === "function") window.markDirty();
            if(typeof projectChanged !== "undefined") projectChanged = true;
        }

        function registerWallpaperStorage(){
            if(!window.ProjectDataCenter || typeof ProjectDataCenter.register !== "function"){
                setTimeout(registerWallpaperStorage, 300);
                return;
            }
            try{
                ProjectDataCenter.register("canvasWallpaper", {
                    description:"畫布桌布圖片",
                    defaultValue:{vaultId:"",name:"",updatedAt:""},
                    resetOnMissing:true,
                    save:function(){
                        return {
                            vaultId:wallpaperState.vaultId || "",
                            name:wallpaperState.name || "",
                            updatedAt:wallpaperState.updatedAt || ""
                        };
                    },
                    load:function(value){
                        wallpaperState = value && typeof value === "object"
                            ? {
                                vaultId:value.vaultId || "",
                                name:value.name || "",
                                updatedAt:value.updatedAt || ""
                            }
                            : {vaultId:"",name:"",updatedAt:""};
                        restoreWallpaper();
                    }
                });
                const activeId = ProjectDataCenter.getActiveProjectId &&
                    ProjectDataCenter.getActiveProjectId();
                const activeProject = activeId && ProjectDataCenter.library &&
                    ProjectDataCenter.library.get(activeId);
                const savedData = activeProject && (activeProject.data || activeProject);
                if(savedData && savedData.canvasWallpaper){
                    wallpaperState = {
                        vaultId:savedData.canvasWallpaper.vaultId || "",
                        name:savedData.canvasWallpaper.name || "",
                        updatedAt:savedData.canvasWallpaper.updatedAt || ""
                    };
                    restoreWallpaper();
                }
            }catch(error){
                console.warn("畫布桌布專案儲存註冊失敗", error);
            }
        }
        registerWallpaperStorage();

        function setScale(value, clientX, clientY){
            const next = Math.max(.4, Math.min(2, value));
            const old = scale;
            if(Math.abs(next - old) < .001) return;
            const rect = panel.getBoundingClientRect();
            const x = typeof clientX === "number" ? clientX - rect.left : panel.clientWidth / 2;
            const y = typeof clientY === "number" ? clientY - rect.top : panel.clientHeight / 2;
            const logicalX = (panel.scrollLeft + x) / old;
            const logicalY = (panel.scrollTop + y) / old;
            scale = next;
            window.__flowCanvasScale = scale;
            panel.style.setProperty("--safe-canvas-scale", scale);
            output.value = Math.round(scale * 100) + "%";
            requestAnimationFrame(function(){
                panel.scrollLeft = logicalX * scale - x;
                panel.scrollTop = logicalY * scale - y;
            });
        }

        tools.addEventListener("click", function(event){
            const button = event.target.closest("button");
            if(!button) return;
            const action = button.dataset.action;
            if(action === "in") setScale(scale + .1);
            if(action === "out") setScale(scale - .1);
            if(action === "reset") setScale(1);
            if(action === "wallpaper") picker.click();
            if(action === "clear"){
                wallpaperState = {vaultId:"",name:"",updatedAt:new Date().toISOString()};
                applyWallpaper("");
                notifyWallpaperChanged("canvas-wallpaper-cleared");
            }
        });

        panel.addEventListener("wheel", function(event){
            event.preventDefault();
            setScale(scale + (event.deltaY < 0 ? .08 : -.08), event.clientX, event.clientY);
        }, {passive:false});

        let pinchDistance = 0;
        let pinchScale = 1;
        function distance(touches){
            return Math.hypot(
                touches[0].clientX - touches[1].clientX,
                touches[0].clientY - touches[1].clientY
            );
        }
        panel.addEventListener("touchstart", function(event){
            if(event.touches.length !== 2) return;
            pinchDistance = distance(event.touches);
            pinchScale = scale;
        }, {passive:true});
        panel.addEventListener("touchmove", function(event){
            if(event.touches.length !== 2 || !pinchDistance) return;
            event.preventDefault();
            const x = (event.touches[0].clientX + event.touches[1].clientX) / 2;
            const y = (event.touches[0].clientY + event.touches[1].clientY) / 2;
            setScale(pinchScale * distance(event.touches) / pinchDistance, x, y);
        }, {passive:false});
        panel.addEventListener("touchend", function(event){
            if(event.touches.length < 2) pinchDistance = 0;
        }, {passive:true});

        picker.addEventListener("change", async function(){
            const file = picker.files && picker.files[0];
            if(!file) return;
            if(!file.type.startsWith("image/")){
                alert("請選擇圖片檔案。");
                picker.value = "";
                return;
            }
            if(file.size > 30 * 1024 * 1024){
                alert("圖片超過 30 MB，請改用稍小的圖片。");
                picker.value = "";
                return;
            }
            picker.disabled = true;
            try{
                const result = window.LocalImageTools
                    ? await LocalImageTools.compress(file,{maxSide:1920,maxBytes:700*1024,quality:.86})
                    : {dataUrl:await new Promise(function(resolve,reject){
                        const reader=new FileReader();
                        reader.onload=function(){resolve(reader.result)};
                        reader.onerror=reject;
                        reader.readAsDataURL(file);
                    })};
                if(!window.LocalImageVault) throw new Error("IndexedDB 圖片庫尚未就緒");
                const vaultId = await LocalImageVault.putImage(result.dataUrl,{
                    name:file.name || "畫布桌布",
                    mime:"image/webp"
                });
                wallpaperState = {
                    vaultId:vaultId,
                    name:file.name || "畫布桌布",
                    updatedAt:new Date().toISOString()
                };
                applyWallpaper(result.dataUrl);
                notifyWallpaperChanged("canvas-wallpaper-changed");
            }catch(error){
                console.error(error);
                alert("桌布保存失敗，請換一張圖片再試。");
            }finally{
                picker.disabled = false;
                picker.value = "";
            }
        });
    }
    if(document.readyState === "loading"){
        document.addEventListener("DOMContentLoaded", start, {once:true});
    }else{
        start();
    }
})();
</script>

                        if(/^\d*d\d+(?:[+-]\d+)?$/i.test(String(dice||"").trim()))insertAdventureTag(mode,"[傷害骰:"+String(name).trim()+":"+String(dice).trim()+"]");

                    if(button.dataset.readerAction === "critical"){
                        const name=prompt("要套用重擊的傷害骰名稱：","長劍");
                        if(!String(name||"").trim())return;
                        const check=prompt("依據哪一個檢定名稱？","攻擊");

                        if(!String(result||"").trim())return;

                        if(!["骰數加倍","傷害加倍","最大傷害"].includes(String(modeName||"").trim()))return alert("重擊方式必須是：骰數加倍、傷害加倍或最大傷害。");

                    }
                    if(button.dataset.readerAction === "success-dice"){

                        if(!/^\d+d\d+$/i.test(String(pool||"").trim()))return alert("骰池格式不正確。例：5d6");

                                sourceEditor.value = sourceEditor.value.slice(0,start) + tag + sourceEditor.value.slice(end);
                                sourceEditor.setSelectionRange(start + tag.length,start + tag.length);

                                sourceEditor.dispatchEvent(new Event("input",{bubbles:true}));

                });
                return bar;
            }
            /* =========================================================
               Final compatibility overlay
               Keeps late bug fixes isolated from the legacy editor core.
               ========================================================= */
            function installFinalCompatibilityOverlay(){
                if(window.__firehahaFinalCompatibilityOverlay)return;
                window.__firehahaFinalCompatibilityOverlay=true;

                function normalizeLegacyProject(){
                    (core.pages||[]).forEach(function(page){
                        if(!page)return;
                        page.title=String(page.title||"");
                        page.text=String(page.text||"");
                        page.options=Array.isArray(page.options)?page.options:[];
                        page.options=page.options.filter(Boolean).map(function(option){
                            option.text=String(option.text||"");
                            option.target=option.target||"";
                            return option;
                        });
                        if(!Number.isFinite(Number(page.x)))page.x=100;
                        if(!Number.isFinite(Number(page.y)))page.y=100;
                        const record=recordFor(page);
                        if(record){
                            record.html=String(record.html||"");
                            record.options=Array.isArray(record.options)?record.options:[];
                            record.options=record.options.filter(Boolean).map(function(option){
                                option.type=option.type||"choice";
                                option.text=String(option.text||"");
                                option.target=option.target||null;
                                return option;
                            });
                        }
                    });
                }

                normalizeLegacyProject();
                const originalBuildReader=buildReader;
                buildReader=function(mode){
                    normalizeLegacyProject();
                    let html=originalBuildReader(mode);
                    const replacements=[
                        [
                            'memorySave.slots[+b.dataset.save]={id:currentId,time:stamp()};persist();renderSaves()',
                            'memorySave.slots[+b.dataset.save]={id:currentId,time:stamp(),history:history.slice(),adventure:JSON.parse(JSON.stringify(memorySave.adventure))};persist();renderSaves()'
                        ],
                        [
                            'if(slot&&pages.some(x=>x.id===slot.id)){history.length=0;show(slot.id,true)}',
                            'if(slot&&pages.some(x=>x.id===slot.id)){if(slot.adventure){memorySave.adventure=JSON.parse(JSON.stringify(slot.adventure));memorySave.adventure.items=Array.isArray(memorySave.adventure.items)?memorySave.adventure.items:[];memorySave.adventure.flags=Array.isArray(memorySave.adventure.flags)?memorySave.adventure.flags:[];memorySave.adventure.values=memorySave.adventure.values||{};memorySave.adventure.attributes=memorySave.adventure.attributes||{};memorySave.adventure.modifiers=memorySave.adventure.modifiers||{};memorySave.adventure.skills=memorySave.adventure.skills||{};memorySave.adventure.skillModifiers=memorySave.adventure.skillModifiers||{};memorySave.adventure.quests=memorySave.adventure.quests||{};memorySave.adventure.dice=memorySave.adventure.dice||{};memorySave.adventure.checks=memorySave.adventure.checks||{};memorySave.adventure.checkBands=memorySave.adventure.checkBands||{};memorySave.adventure.damage=memorySave.adventure.damage||{};memorySave.adventure.damageRules=memorySave.adventure.damageRules||{};memorySave.adventure.successDice=memorySave.adventure.successDice||{};memorySave.adventure.applied=memorySave.adventure.applied||{}}history.length=0;if(Array.isArray(slot.history)){slot.history.filter(id=>pages.some(page=>page.id===id)).forEach(id=>history.push(id))}if(history[history.length-1]!==slot.id)history.push(slot.id);persist();show(slot.id,false)}'
                        ],
                        [
                            'memorySave.auto={id:p.id,label:rules.savePoint,time:stamp()};persist()',
                            'memorySave.auto={id:p.id,label:rules.savePoint,time:stamp(),history:history.slice(),adventure:JSON.parse(JSON.stringify(memorySave.adventure))};persist()'
                        ],
                        [
                            'if(memorySave.auto&&pages.some(x=>x.id===memorySave.auto.id)){history.length=0;show(memorySave.auto.id,true)}',
                            'if(memorySave.auto&&pages.some(x=>x.id===memorySave.auto.id)){if(memorySave.auto.adventure){memorySave.adventure=JSON.parse(JSON.stringify(memorySave.auto.adventure));memorySave.adventure.items=Array.isArray(memorySave.adventure.items)?memorySave.adventure.items:[];memorySave.adventure.flags=Array.isArray(memorySave.adventure.flags)?memorySave.adventure.flags:[];memorySave.adventure.values=memorySave.adventure.values||{};memorySave.adventure.attributes=memorySave.adventure.attributes||{};memorySave.adventure.modifiers=memorySave.adventure.modifiers||{};memorySave.adventure.skills=memorySave.adventure.skills||{};memorySave.adventure.skillModifiers=memorySave.adventure.skillModifiers||{};memorySave.adventure.quests=memorySave.adventure.quests||{};memorySave.adventure.dice=memorySave.adventure.dice||{};memorySave.adventure.checks=memorySave.adventure.checks||{};memorySave.adventure.checkBands=memorySave.adventure.checkBands||{};memorySave.adventure.damage=memorySave.adventure.damage||{};memorySave.adventure.damageRules=memorySave.adventure.damageRules||{};memorySave.adventure.successDice=memorySave.adventure.successDice||{};memorySave.adventure.applied=memorySave.adventure.applied||{}}history.length=0;if(Array.isArray(memorySave.auto.history)){memorySave.auto.history.filter(id=>pages.some(page=>page.id===id)).forEach(id=>history.push(id))}if(history[history.length-1]!==memorySave.auto.id)history.push(memorySave.auto.id);persist();show(memorySave.auto.id,false)}'
                        ]
                    ];
                    replacements.forEach(function(pair){
                        if(html.indexOf(pair[0])>=0)html=html.replace(pair[0],pair[1]);
                        else console.warn("[Final compatibility overlay] Reader patch target missing:",pair[0].slice(0,48));
                    });
                    return html;
                };

                const originalPreview=previewReader;
                previewReader=function(mode){
                    normalizeLegacyProject();
                    return originalPreview(mode);
                };
                const originalExport=exportReader;
                exportReader=function(mode){
                    normalizeLegacyProject();
                    return originalExport(mode);
                };

                window.FirehahaFinalCompatibility={
                    version:"1.0.0",
                    normalize:normalizeLegacyProject,
                    audit:function(){
                        const pages=core.pages||[],ids=new Set(pages.map(function(page){return page&&page.id;}));
                        const broken=[];
                        pages.forEach(function(page){
                            (page&&page.options||[]).forEach(function(option,index){
                                if(option.target&&!ids.has(option.target))broken.push({page:page.id,index:index,target:option.target});
                            });
                            const record=recordFor(page);
                            (record&&record.options||[]).forEach(function(option,index){
                                if(option.target&&!ids.has(option.target))broken.push({page:page.id,index:index,target:option.target,format:"html"});
                            });
                        });
                        return {pages:pages.length,brokenTargets:broken};
                    }
                };
            }
            installFinalCompatibilityOverlay();
            pixivWorkspace.insertBefore(actionBar("formatReaderActionsPixiv","pixiv"), document.getElementById("pixivIntegratedPreview"));
            htmlWorkspace.appendChild(actionBar("formatReaderActionsHtml","html"));

            /* 手動輸入標籤也會立刻建立 Node；載入舊專案時亦會補齊。 */
            core.pages.slice().forEach(function(page){
                scanGameListTags(page.text || "",page);
                const record = recordFor(page);
                scanGameListTags(record && record.html || "",page);
            });
            const pixivEditor = document.getElementById("pageText");
            const htmlVisualEditor = document.getElementById("htmlDesignEditor");
            const htmlSourceEditor = document.getElementById("htmlSourceEditor");
            if(pixivEditor) pixivEditor.addEventListener("input",function(){
                scanGameListTags(pixivEditor.value,core.currentPage);
            });
            if(htmlVisualEditor) htmlVisualEditor.addEventListener("input",function(){
                scanGameListTags(htmlVisualEditor.innerHTML,core.currentPage);
            });
            if(htmlSourceEditor) htmlSourceEditor.addEventListener("input",function(){
                scanGameListTags(htmlSourceEditor.value,core.currentPage);
            });

            let lastId = null;
            function sync(){
                const id = core.currentPage && core.currentPage.id;
                if(id !== lastId){
                    lastId = id;
                    renderOwnOptions();
                    document.querySelectorAll(".format-reader-actions").forEach(function(bar){if(typeof bar.refreshExperience==="function")bar.refreshExperience();});
                }
                setTimeout(sync, 300);
            }
            renderOwnOptions();
            sync();
            window.SeparatedFormatReaders = {buildReader:buildReader, preview:previewReader, export:exportReader, renderOptions:renderOwnOptions};
        }
        initialize();
    });
})();
</script>

<script id="html-node-connections">
(function(){
    "use strict";
    function ready(fn){
        if(document.readyState === "loading"){
            document.addEventListener("DOMContentLoaded", fn, {once:true});
        }else{
            fn();
        }
    }
    ready(function(){
        function initialize(){
            if(!window.GamebookCore || !window.DualFormatWorkspace){
                setTimeout(initialize,120);
                return;
            }
            const core = window.GamebookCore;
            const dual = window.DualFormatWorkspace;
            const panel = document.getElementById("flowPanel");
            const flowCanvas = document.getElementById("flowCanvas");
            const baseCanvas = document.getElementById("linesCanvas");
            const htmlWorkspace = document.getElementById("htmlWorkspace");
            if(!panel || !flowCanvas || !baseCanvas || !htmlWorkspace || document.getElementById("htmlLinesCanvas")) return;

            const canvas = document.createElement("canvas");
            canvas.id = "htmlLinesCanvas";
            canvas.setAttribute("aria-hidden","true");
            baseCanvas.parentNode.insertBefore(canvas,flowCanvas);

            const legend = document.createElement("div");
            legend.className = "html-connection-legend";
            legend.textContent = "藍色虛線：HTML 分歧";
            panel.parentNode.insertBefore(legend,panel.nextSibling);

            let frame = 0;
            let lastDrawAt = 0;
            function isHtmlMode(){
                return htmlWorkspace.classList.contains("active");
            }
            function arrow(ctx,x1,y1,x2,y2){
                const angle = Math.atan2(y2-y1,x2-x1);
                const size = 8;
                ctx.beginPath();
                ctx.moveTo(x2,y2);
                ctx.lineTo(x2-Math.cos(angle-.55)*size,y2-Math.sin(angle-.55)*size);
                ctx.lineTo(x2-Math.cos(angle+.55)*size,y2-Math.sin(angle+.55)*size);
                ctx.closePath();
                ctx.fill();
            }
            function draw(){
                frame = 0;
                const active = isHtmlMode();
                canvas.classList.toggle("active",active);
                legend.classList.toggle("active",active);
                panel.classList.toggle("html-connection-mode",active);

                if(!active){
                    const hiddenContext = canvas.getContext("2d");
                    hiddenContext.clearRect(0,0,canvas.width,canvas.height);
                    return;
                }

                let width = Math.max(flowCanvas.clientWidth,1200);
                let height = Math.max(flowCanvas.clientHeight,1000);
                core.pages.forEach(function(page){
                    width = Math.max(width,Number(page.x || 0) + 320);
                    height = Math.max(height,Number(page.y || 0) + 220);
                });
                width = Math.ceil(width);
                height = Math.ceil(height);
                if(canvas.width !== width) canvas.width = width;
                if(canvas.height !== height) canvas.height = height;
                const ctx = canvas.getContext("2d");
                ctx.clearRect(0,0,width,height);

                ctx.lineWidth = 3;
                ctx.strokeStyle = "#1976d2";
                ctx.fillStyle = "#1976d2";
                ctx.setLineDash([9,6]);

                core.pages.forEach(function(page){
                    const record = dual.state.pages[page.id];
                    const options = record && Array.isArray(record.options) ? record.options : [];
                    options.forEach(function(option){
                        if(!option || !option.target) return;
                        const target = core.getPageById(option.target);
                        if(!target) return;
                        const x1 = Number(page.x || 0) + 140;
                        const y1 = Number(page.y || 0) + 28;
                        const x2 = Number(target.x || 0);
                        const y2 = Number(target.y || 0) + 28;
                        const bend = Math.max(70,Math.abs(x2-x1)*.45);

                        ctx.beginPath();
                        ctx.moveTo(x1,y1);
                        ctx.bezierCurveTo(x1+bend,y1,x2-bend,y2,x2,y2);
                        ctx.stroke();

                        ctx.save();
                        ctx.setLineDash([]);
                        arrow(ctx,x2-bend*.12,y2,x2,y2);
                        ctx.restore();
                    });
                });
                ctx.setLineDash([]);
            }
            function schedule(force){
                if(!isHtmlMode() && !canvas.classList.contains("active") && force !== true) return;
                if(frame) return;
                const wait = Math.max(0,40 - (performance.now() - lastDrawAt));
                frame = setTimeout(function(){
                    frame = 0;
                    lastDrawAt = performance.now();
                    draw();
                },wait);
            }

            flowCanvas.addEventListener("pointerup",function(){ schedule(true); },{passive:true});
            document.getElementById("formatModeTabs").addEventListener("click",function(){ setTimeout(function(){ schedule(true); },0); });
            window.addEventListener("resize",function(){ schedule(true); },{passive:true});
            const observer = new MutationObserver(schedule);
            observer.observe(flowCanvas,{childList:true,subtree:true,attributes:true,attributeFilter:["style","class"]});

            const originalRenderOptions = window.SeparatedFormatReaders && window.SeparatedFormatReaders.renderOptions;
            if(window.SeparatedFormatReaders){
                window.SeparatedFormatReaders.drawHtmlConnections = schedule;
                if(originalRenderOptions){
                    window.SeparatedFormatReaders.renderOptions = function(){
                        const result = originalRenderOptions.apply(this,arguments);
                        schedule();
                        return result;
                    };
                }
            }
            setInterval(function(){ schedule(false); },900);
            schedule(true);
        }
        initialize();
    });
})();
</script>

    .ppm-detail { position:absolute;inset:56px 0 0;width:100%;max-width:none;display:none;padding:14px 16px calc(18px + env(safe-area-inset-bottom));overflow-y:auto;border:0;z-index:6; }
    .ppm-detail.mobile-open { display:flex; }
    .ppm-detail-back { display:block;position:sticky;top:0;z-index:2;width:100%;margin:0 0 12px;padding:10px !important;background:#e9f3ff !important;color:#1565c0 !important;border:1px solid #b9d8f2 !important; }
    .ppm-danger { margin-top:18px; }
}
</style>
<script id="professional-project-manager">
(function(){
    "use strict";
    function ready(fn){
        if(document.readyState === "loading") document.addEventListener("DOMContentLoaded",fn,{once:true});
        else fn();
    }
    ready(function(){
        const LIB_KEY = "PixivNovelLibrary_V2";
        let selectedId = null;
        let query = "";
        let mode = "all";

        function readLibrary(){
            try{
                const value = JSON.parse(safeStorage.getItem(LIB_KEY) || "[]");
                return Array.isArray(value) ? value : [];
            }catch(e){ return []; }
        }
        function writeLibrary(value){
            safeStorage.setItem(LIB_KEY,JSON.stringify(value));
        }
        function esc(value){
            return String(value == null ? "" : value).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
        }
        function stats(project){
            const pages = project && project.data && Array.isArray(project.data.pages) ? project.data.pages : [];
            const chars = pages.reduce(function(total,page){ return total + String(page.text || "").length; },0);
            const choices = pages.reduce(function(total,page){ return total + (Array.isArray(page.options) ? page.options.length : 0); },0);
            return {pages:pages.length,chars:chars,choices:choices};
        }
        function freshPage(name){
            return {id:crypto.randomUUID(),title:name || "開始頁面",text:"",note:"",options:[],x:100,y:100};
        }
        function createWindow(){
            if(document.getElementById("proProjectManager")) return;
            const modal = document.createElement("div");
            modal.id = "proProjectManager";
            modal.innerHTML =
                '<section class="ppm-window" role="dialog" aria-modal="true" aria-labelledby="ppmTitle">' +
                '<header class="ppm-titlebar"><div class="ppm-app-icon">✦</div><div class="ppm-title-copy"><h2 id="ppmTitle">Pixiv 小說專案</h2><p>管理作品、版本與本機專案庫</p></div><div class="ppm-window-controls"><button type="button" id="ppmClose" aria-label="關閉">✕</button></div></header>' +
                '<div class="ppm-body">' +
                '<aside class="ppm-sidebar"><span class="ppm-sidebar-label">建立作品</span><div class="ppm-new-box"><input id="ppmNewName" type="text" placeholder="新作品名稱"><button id="ppmCreate" type="button">＋ 建立專案</button></div>' +
                '<span class="ppm-sidebar-label">專案庫</span><button type="button" class="ppm-side-action active" data-filter="all">▦ 所有作品</button><button type="button" class="ppm-side-action" data-filter="active">● 目前開啟</button><button type="button" class="ppm-side-action" id="ppmImport">⇧ 匯入 JSON</button><input id="ppmImportFile" type="file" accept=".json,application/json" hidden>' +
                '<div class="ppm-storage-note">作品儲存在這台裝置的瀏覽器中。建議定期匯出 JSON 作為備份。</div></aside>' +
                '<main class="ppm-center"><div class="ppm-toolbar"><input class="ppm-search" id="ppmSearch" type="search" placeholder="搜尋作品名稱…"><span class="ppm-count" id="ppmCount"></span></div><div class="ppm-project-list" id="ppmList"></div></main>' +
                '<aside class="ppm-detail" id="ppmDetail"><button class="ppm-detail-back" id="ppmDetailBack" type="button">← 返回作品清單</button><div class="ppm-detail-empty" id="ppmDetailEmpty">選擇一個作品<br>查看詳細資訊與操作</div><div class="ppm-detail-content" id="ppmDetailContent">' +
                '<h3 id="ppmDetailName"></h3><div class="ppm-detail-id" id="ppmDetailId"></div><div class="ppm-stats"><div class="ppm-stat"><strong id="ppmPages">0</strong><span>頁面</span></div><div class="ppm-stat"><strong id="ppmChars">0</strong><span>Pixiv 字數</span></div><div class="ppm-stat"><strong id="ppmChoices">0</strong><span>分歧選項</span></div><div class="ppm-stat"><strong id="ppmNotes">0</strong><span>便利貼</span></div></div>' +
                '<label class="ppm-field-label" for="ppmRename">作品名稱</label><div class="ppm-rename-row"><input id="ppmRename" type="text"><button id="ppmRenameSave" type="button">儲存</button></div>' +
                '<div class="ppm-detail-actions"><button class="ppm-open" id="ppmOpen" type="button">開啟作品</button><button id="ppmDuplicate" type="button">建立副本</button><button id="ppmExport" type="button">匯出 JSON</button></div></div>' +
                '<div class="ppm-danger"><button class="ppm-delete" id="ppmDelete" type="button">刪除作品</button></div></aside>' +
                '</div></section>';
            document.body.appendChild(modal);
            if(!document.getElementById("project-manager-modal")){
                const legacyModalShim=document.createElement("div");
                legacyModalShim.id="project-manager-modal";
                legacyModalShim.style.display="none";
                document.body.appendChild(legacyModalShim);
            }

            modal.querySelector("#ppmClose").onclick = close;
            modal.querySelector("#ppmDetailBack").onclick = function(){ modal.querySelector("#ppmDetail").classList.remove("mobile-open"); };
            modal.addEventListener("mousedown",function(event){ if(event.target === modal) close(); });
            modal.querySelector("#ppmSearch").addEventListener("input",function(event){ query=event.target.value.trim().toLowerCase();render(); });
            modal.querySelectorAll("[data-filter]").forEach(function(button){
                button.onclick=function(){
                    mode=button.dataset.filter;
                    modal.querySelectorAll("[data-filter]").forEach(function(item){item.classList.toggle("active",item===button);});
                    render();
                };
            });
            modal.querySelector("#ppmCreate").onclick = createProject;
            modal.querySelector("#ppmNewName").addEventListener("keydown",function(event){ if(event.key==="Enter")createProject(); });
            modal.querySelector("#ppmOpen").onclick = openSelected;
            modal.querySelector("#ppmRenameSave").onclick = renameSelected;
            modal.querySelector("#ppmDuplicate").onclick = duplicateSelected;
            modal.querySelector("#ppmDelete").onclick = deleteSelected;
            modal.querySelector("#ppmExport").onclick = exportSelected;
            modal.querySelector("#ppmImport").onclick = function(){ modal.querySelector("#ppmImportFile").click(); };
            modal.querySelector("#ppmImportFile").addEventListener("change",importProject);
            document.addEventListener("keydown",function(event){if(event.key==="Escape"&&modal.classList.contains("open"))close();});
        }
        function currentProject(){
            return readLibrary().find(function(project){return project.id===selectedId;}) || null;
        }
        function render(){
            const modal = document.getElementById("proProjectManager");
            if(!modal) return;
            const activeId = window.state && window.state.currentTab;
            let db = readLibrary();
            if(mode === "active") db = db.filter(function(project){return project.id===activeId;});
            if(query) db = db.filter(function(project){return String(project.name||"").toLowerCase().includes(query);});
            modal.querySelector("#ppmCount").textContent = db.length + " 個作品";
            const list = modal.querySelector("#ppmList");
            list.innerHTML = "";
            if(!db.length){
                list.innerHTML = '<div class="ppm-empty">📚<br>目前沒有符合條件的作品</div>';
            }
            db.forEach(function(project){
                const info = stats(project);
                const row = document.createElement("article");
                row.className = "ppm-project-row" + (project.id===selectedId ? " selected" : "");
                row.dataset.id = project.id;
                row.innerHTML = '<div class="ppm-project-icon">📖</div><div><span class="ppm-project-name">'+esc(project.name||"未命名作品")+'</span><div class="ppm-project-meta">'+info.pages+' 頁・'+info.chars.toLocaleString()+' 字・'+info.choices+' 個分歧</div></div>'+(project.id===activeId?'<span class="ppm-active-badge">開啟中</span>':'');
                row.onclick=function(){selectedId=project.id;render();showDetail();};
                row.ondblclick=openSelected;
                list.appendChild(row);
            });
            if(selectedId && !readLibrary().some(function(project){return project.id===selectedId;})) selectedId=null;
            showDetail();
        }
        function showDetail(){
            const modal=document.getElementById("proProjectManager"),project=currentProject();
            const empty=modal.querySelector("#ppmDetailEmpty"),content=modal.querySelector("#ppmDetailContent"),danger=modal.querySelector(".ppm-danger");
            empty.style.display=project?"none":"block";
            content.classList.toggle("visible",!!project);
            danger.style.display=project?"block":"none";
            modal.querySelector("#ppmDetail").classList.toggle("mobile-open",!!project);
            if(!project)return;
            const info=stats(project);
            modal.querySelector("#ppmDetailName").textContent=project.name||"未命名作品";
            modal.querySelector("#ppmDetailId").textContent=project.id;
            modal.querySelector("#ppmPages").textContent=info.pages.toLocaleString();
            modal.querySelector("#ppmChars").textContent=info.chars.toLocaleString();
            modal.querySelector("#ppmChoices").textContent=info.choices.toLocaleString();
            modal.querySelector("#ppmNotes").textContent=((project.data&&project.data.notes)||[]).length.toLocaleString();
            modal.querySelector("#ppmRename").value=project.name||"";
        }
        function createProject(){
            const input=document.getElementById("ppmNewName");
            const name=(input.value||"").trim()||"未命名作品";
            const now=new Date().toISOString();const project={id:crypto.randomUUID(),name:name,createdAt:now,updatedAt:now,data:{pages:[freshPage(name)],notes:[],drawings:[]}};
            const db=readLibrary();db.push(project);writeLibrary(db);selectedId=project.id;input.value="";render();
        }
        function openSelected(){
            const db=readLibrary(),index=db.findIndex(function(project){return project.id===selectedId;});
            if(index<0)return;
            if(typeof window.loadProject==="function")window.loadProject(index);
            close();
        }
        function renameSelected(){
            const name=(document.getElementById("ppmRename").value||"").trim();
            if(!name){alert("作品名稱不能為空。");return;}
            const db=readLibrary(),project=db.find(function(item){return item.id===selectedId;});
            if(!project)return;project.name=name;project.updatedAt=new Date().toISOString();writeLibrary(db);render();
        }
        function duplicateSelected(){
            const project=currentProject();if(!project)return;
            const copy=JSON.parse(JSON.stringify(project));const now=new Date().toISOString();copy.id=crypto.randomUUID();copy.name=(project.name||"未命名作品")+"（副本）";copy.createdAt=now;copy.updatedAt=now;
            const db=readLibrary();db.push(copy);writeLibrary(db);selectedId=copy.id;render();
        }
        async function deleteSelected(){
            const project=currentProject();if(!project)return;
            if(!confirm("確定要永久刪除「"+(project.name||"未命名作品")+"」嗎？此操作無法復原。"))return;
            if(window.IndexedProjectSystem&&typeof IndexedProjectSystem.deleteProject==="function"){
                await IndexedProjectSystem.deleteProject(selectedId);
            }else{
                const db=readLibrary().filter(function(item){return item.id!==selectedId;});writeLibrary(db);
            }
            selectedId=null;render();
        }
        function exportSelected(){
            const project=currentProject();if(!project)return;
            const url=URL.createObjectURL(new Blob([JSON.stringify(project,null,2)],{type:"application/json;charset=utf-8"}));
            const link=document.createElement("a");link.href=url;link.download=(project.name||"pixiv-project").replace(/[\\\\/:*?\"<>|]/g,"_")+".json";link.click();setTimeout(function(){URL.revokeObjectURL(url);},1000);
        }
        function importProject(event){
            const file=event.target.files&&event.target.files[0];if(!file)return;
            const reader=new FileReader();
            reader.onload=function(){
                try{
                    const value=JSON.parse(String(reader.result||""));
                    const project=value&&value.data?value:{id:crypto.randomUUID(),name:file.name.replace(/\\.json$/i,""),data:value};
                    const now=new Date().toISOString();project.id=crypto.randomUUID();project.name=project.name||"匯入作品";project.createdAt=now;project.updatedAt=now;
                    if(!project.data||!Array.isArray(project.data.pages))throw new Error("缺少 pages");
                    const db=readLibrary();db.push(project);writeLibrary(db);selectedId=project.id;render();
                }catch(e){alert("無法匯入：這不是有效的專案 JSON。");}
            };
            reader.readAsText(file);event.target.value="";
        }
        function open(){
            createWindow();
            const modal=document.getElementById("proProjectManager");
            modal.classList.add("open");
            selectedId=(window.state&&window.state.currentTab)||readLibrary()[0]?.id||null;
            query="";mode="all";
            modal.querySelector("#ppmSearch").value="";
            modal.querySelectorAll("[data-filter]").forEach(function(item){item.classList.toggle("active",item.dataset.filter==="all");});
            render();
            setTimeout(function(){modal.querySelector("#ppmSearch").focus();},0);
        }
        function close(){
            const modal=document.getElementById("proProjectManager");
            if(modal)modal.classList.remove("open");
        }
        createWindow();
        window.openProjectSelector=open;
        window.ProfessionalProjectManager={open:open,close:close,render:render};
    });
})();
</script>

<style id="professional-command-header-style">

<script id="professional-command-header">
(function(){
    "use strict";
    function ready(fn){
        if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",fn,{once:true});
        else fn();
    }
    ready(function(){
        function organize(){
            const header=document.querySelector(".pixiv-editor-app > header");
            if(!header||header.classList.contains("pro-command-header"))return;
            header.classList.add("pro-command-header");

            const originalChildren=Array.from(header.children);
            const main=header.querySelector(":scope > .header-main");
            const allItems=[];
            originalChildren.forEach(function(child){
                if(child===main)return;
                if(child.classList.contains("header-group")){
                    Array.from(child.children).forEach(function(item){allItems.push(item);});
                    child.remove();
                }else{
                    allItems.push(child);
                }
            });

            const chapterButtons=allItems.filter(function(item){
                return item.tagName==="BUTTON"&&(item.textContent||"").replace(/\s+/g,"")==="Chapter設定";
            });
            chapterButtons.slice(0,-1).forEach(function(button){button.classList.add("pro-hidden-duplicate");});

            const top=document.createElement("div");
            top.className="pro-header-top";
            const primary=document.createElement("div");
            primary.className="pro-primary-actions";
            if(main)top.appendChild(main);
            top.appendChild(primary);

            const ribbon=document.createElement("div");
            ribbon.className="pro-ribbon";
            function group(label,className){
                const box=document.createElement("section");
                box.className="pro-tool-group "+className;
                const caption=document.createElement("span");
                caption.className="pro-group-label";
                caption.textContent=label;
                box.appendChild(caption);
                ribbon.appendChild(box);
                return box;
            }
            const work=group("作品","pro-work-group");
            const node=group("NODE","pro-node-group");
            const chapter=group("章節與語言","pro-chapter-group");
            const moreGroup=group("進階","pro-more-group");
            const more=document.createElement("div");
            more.className="pro-more";
            more.innerHTML='<button type="button" class="pro-more-summary">更多工具</button>';
            moreGroup.insertBefore(more,moreGroup.querySelector(".pro-group-label"));
            const morePanel=document.createElement("section");
            morePanel.className="pro-more-panel pro-floating-tools";
            morePanel.innerHTML='<div class="pro-floating-titlebar"><strong>更多工具</strong><button type="button" class="pro-floating-close" aria-label="關閉">✕</button></div>';
            document.body.appendChild(morePanel);

            function place(item,target){
                if(item&&!item.classList.contains("pro-hidden-duplicate"))target.insertBefore(item,target.querySelector(".pro-group-label")||null);
            }
            allItems.forEach(function(item){
                const id=item.id||"";
                const text=(item.textContent||"").replace(/\s+/g,"");
                if(id==="addPage"||id==="saveProject"){place(item,primary);return;}
                if(["exportPixiv","authorMoodBtn","txtExportBtn","txtImportBtn"].includes(id)){place(item,work);return;}
                if(["plug-copy","plug-paste","branch-order","plug-branch","btn-toggle-list","auto-page-select"].includes(id)||item.querySelector&&item.querySelector("#btn-toggle-list,#auto-page-select")){place(item,node);return;}
                if(id==="langSelect"||item.getAttribute("data-i18n")==="language"||text==="Chapter設定"){
                    if(item.tagName==="LABEL")item.classList.add("pro-language-label");
                    place(item,chapter);return;
                }
                morePanel.appendChild(item);
            });

            header.replaceChildren(top,ribbon);
            if(!primary.children.length)primary.remove();
            if(work.children.length===1)work.style.display="none";
            if(node.children.length===1)node.style.display="none";
            if(chapter.children.length===1)chapter.style.display="none";

            const moreButton=more.querySelector(".pro-more-summary");
            const closeButton=morePanel.querySelector(".pro-floating-close");
            moreButton.addEventListener("click",function(){
                morePanel.classList.toggle("open");
                moreButton.classList.toggle("active",morePanel.classList.contains("open"));
            });
            closeButton.addEventListener("click",function(){
                morePanel.classList.remove("open");
                moreButton.classList.remove("active");
            });
            const handle=morePanel.querySelector(".pro-floating-titlebar");
            handle.addEventListener("pointerdown",function(event){
                if(event.target.closest("button")||window.innerWidth<=560)return;
                event.preventDefault();
                handle.setPointerCapture(event.pointerId);
                const rect=morePanel.getBoundingClientRect();
                const startX=event.clientX,startY=event.clientY,startLeft=rect.left,startTop=rect.top;
                function move(e){
                    const maxLeft=Math.max(8,window.innerWidth-morePanel.offsetWidth-8);
                    const maxTop=Math.max(8,window.innerHeight-morePanel.offsetHeight-8);
                    morePanel.style.left=Math.max(8,Math.min(maxLeft,startLeft+e.clientX-startX))+"px";
                    morePanel.style.top=Math.max(8,Math.min(maxTop,startTop+e.clientY-startY))+"px";
                    morePanel.style.right="auto";
                }
                function end(){
                    handle.removeEventListener("pointermove",move);
                    handle.removeEventListener("pointerup",end);
                    handle.removeEventListener("pointercancel",end);
                }
                handle.addEventListener("pointermove",move);
                handle.addEventListener("pointerup",end);
                handle.addEventListener("pointercancel",end);
            });
        }
        setTimeout(organize,300);
    });
})();
</script>

<script id="floating-editor-viewport-guard">
(function(){
    "use strict";

    const VIEWPORT_EDGE=10;
    let animationFrame=0;

    function sync(){
        animationFrame=0;
        const editor=document.getElementById("editorFloat");
        if(!editor)return;

        const top=Math.max(
            VIEWPORT_EDGE,
            editor.getBoundingClientRect().top
        );
        const safeHeight=Math.max(
            180,
            window.innerHeight-top-VIEWPORT_EDGE
        );

        document.documentElement.style.setProperty(
            "--firehaha-editor-safe-height",
            safeHeight+"px"
        );
    }

    function schedule(){
        if(animationFrame)return;
        animationFrame=requestAnimationFrame(sync);
    }

    function install(){
        const editor=document.getElementById("editorFloat");
        if(!editor){
            window.setTimeout(install,120);
            return;
        }

        if(typeof ResizeObserver==="function"){
            const resizeObserver=new ResizeObserver(schedule);
            resizeObserver.observe(editor);
        }

        const mutationObserver=new MutationObserver(schedule);
        mutationObserver.observe(editor,{
            attributes:true,
            attributeFilter:["style","class"]
        });

        window.addEventListener("resize",schedule,{passive:true});
        window.addEventListener("orientationchange",schedule,{passive:true});

        schedule();
        window.setTimeout(schedule,350);
    }

    window.FirehahaFloatingEditorLayout=Object.freeze({
        sync:schedule
    });

    if(document.readyState==="loading"){
        document.addEventListener("DOMContentLoaded",install,{once:true});
    }else{
        install();
    }
})();
</script>
