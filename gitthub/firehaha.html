<script id="target-page-dual-format-controller">
(function(){
    "use strict";
    function initialize(){
        const container=document.getElementById("target-page-editor");
        const pageSelect=document.getElementById("targetPageSelect");
        const editor=document.getElementById("targetPageText");
        const saveButton=document.getElementById("saveTargetPage");
        if(!container||!pageSelect||!editor||!saveButton)return;
        if(document.getElementById("targetPageFormat"))return;

        const row=document.createElement("div");
        row.className="target-format-row";
        row.innerHTML='<label for="targetPageFormat">編輯內容</label><select id="targetPageFormat"><option value="pixiv">Pixiv 正文</option><option value="html">HTML 內容</option></select>';
        pageSelect.closest("div").insertAdjacentElement("afterend",row);
        const formatSelect=row.querySelector("select");

        function selectedPage(){
            const list=window.GamebookCore&&Array.isArray(GamebookCore.pages)
                ? GamebookCore.pages
                : (Array.isArray(window.pages)?window.pages:[]);
            return list.find(page=>String(page.id)===String(pageSelect.value))||null;
        }
        function htmlRecord(pageId,create){
            const dual=window.DualFormatWorkspace;
            if(!dual||!dual.state)return null;
            let record=dual.state.pages[pageId];
            if(!record&&create)record=dual.state.pages[pageId]={html:"",settings:{},options:[]};
            return record||null;
        }
        function sanitizeHtml(value){
            const template=document.createElement("template");
            template.innerHTML=String(value||"");
            template.content.querySelectorAll("script,iframe,object,embed,form,input,button,style,link,meta").forEach(node=>node.remove());
            template.content.querySelectorAll("*").forEach(node=>{
                Array.from(node.attributes).forEach(attribute=>{
                    if(/^on/i.test(attribute.name)||/^javascript:/i.test(attribute.value))node.removeAttribute(attribute.name);
                });
            });
            return template.innerHTML;
        }
        function loadSelected(){
            const page=selectedPage();
            const mode=formatSelect.value;
            container.dataset.targetFormat=mode;
            editor.placeholder=mode==="html"
                ?"此處編輯指定 Page 的 HTML 內容"
                :"此處編輯指定 Page 的 Pixiv 正文";
            if(!page){editor.value="";return}
            if(mode==="html"){
                const record=htmlRecord(page.id,false);
                const value=record&&record.html||"";
                editor.value=window.LocalHtmlAssets?LocalHtmlAssets.compact(value):value;
            }else{
                editor.value=String(page.text||"");
            }
        }

        pageSelect.onchange=loadSelected;
        formatSelect.addEventListener("change",loadSelected);
        saveButton.onclick=function(){
            const page=selectedPage();
            if(!page){alert("請先選擇 Page");return}
            if(formatSelect.value==="html"){
                const record=htmlRecord(page.id,true);
                if(!record){alert("HTML 編輯器尚未完成載入，請稍後再試。");return}
                const expanded=window.LocalHtmlAssets?LocalHtmlAssets.expand(editor.value):editor.value;
                record.html=sanitizeHtml(expanded);
                const current=window.GamebookCore&&GamebookCore.currentPage;
                if(current&&String(current.id)===String(page.id)){
                    DualFormatWorkspace.loadHtml();
                    DualFormatWorkspace.renderHtml();
                }
                if(window.GamebookCore&&GamebookCore.notifyChange)GamebookCore.notifyChange("target-page-html-update");
                projectChanged=true;
                editor.value=window.LocalHtmlAssets?LocalHtmlAssets.compact(record.html):record.html;
                alert("指定 Page 的 HTML 內容已更新");
            }else{
                const value=window.PixivImageAssets?PixivImageAssets.compact(editor.value):editor.value;
                page.text=value;
                const current=window.GamebookCore&&GamebookCore.currentPage;
                if(current&&String(current.id)===String(page.id)){
                    const mainEditor=document.getElementById("pageText");
                    if(mainEditor)mainEditor.value=value;
                    if(window.DualFormatWorkspace)DualFormatWorkspace.renderPixiv();
                }
                if(window.GamebookCore&&GamebookCore.notifyChange)GamebookCore.notifyChange("target-page-pixiv-update");
                projectChanged=true;
                editor.value=value;
                alert("指定 Page 的 Pixiv 正文已更新");
            }
        };
        loadSelected();
    }
    if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",initialize,{once:true});
    else initialize();
})();
</script>

<script id="indexeddb-folder-manager">
(function(){
    "use strict";
    const esc=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
    const formatBytes=value=>{
        const bytes=Math.max(0,Number(value)||0);
        if(bytes<1024)return bytes+" B";
        if(bytes<1024*1024)return (bytes/1024).toFixed(1)+" KB";
        return (bytes/1024/1024).toFixed(2)+" MB";
    };
    function imageBytes(data){const value=String(data||"");const comma=value.indexOf(",");return comma<0?value.length:Math.round((value.length-comma-1)*.75)}

<script id="indexeddb-project-system">
(function(){
    "use strict";
    const LIBRARY_KEY="PixivNovelLibrary_V2";
    let initialized=false;
    let activeWatchTimer=0;
    function parseLibrary(raw){
        try{const value=JSON.parse(raw||"[]");return Array.isArray(value)?value:[]}catch(error){return[]}
    }
    function projectTime(project){
        const value=project&&project.updatedAt;
        const time=typeof value==="number"?value:(value?Date.parse(value):0);
        return Number.isFinite(time)?time:0;
    }
    function mergeLibraries(cache,indexed,tombstones){
        const merged=new Map();
        [...(indexed||[]),...(cache||[])].forEach(project=>{
            if(!project||!project.id)return;
            const deletedAt=Number(tombstones&&tombstones[project.id])||0;
            if(deletedAt&&deletedAt>=projectTime(project))return;
            const current=merged.get(project.id);
            if(!current||projectTime(project)>=projectTime(current))merged.set(project.id,project);
        });
        return Array.from(merged.values()).sort((a,b)=>projectTime(b)-projectTime(a));
    }
    async function initialize(){
        if(initialized||!window.LocalImageVault||!window.safeStorage||!window.ProjectDataCenter)return;
        initialized=true;
        const originalGet=safeStorage.getItem.bind(safeStorage);
        const originalSet=safeStorage.setItem.bind(safeStorage);
        const originalRemove=safeStorage.removeItem.bind(safeStorage);
        try{
            const cached=parseLibrary(originalGet(LIBRARY_KEY));
            const indexed=await LocalImageVault.loadProjectLibrary();
            const tombstones=await LocalImageVault.loadProjectTombstones();
            const merged=mergeLibraries(cached,indexed,tombstones);
            originalSet(LIBRARY_KEY,JSON.stringify(merged));
            await LocalImageVault.saveProjectLibrary(merged);

            const indexedActive=await LocalImageVault.loadActiveProjectId();
            const currentActive=window.state&&window.state.currentTab;
            const activeId=(currentActive&&merged.some(project=>project.id===currentActive))
                ? currentActive
                : (indexedActive&&merged.some(project=>project.id===indexedActive)?indexedActive:null);
            if(activeId){
                window.state=window.state||{};
                window.state.currentTab=activeId;
                const activeProject=merged.find(project=>project.id===activeId);
                if(activeProject&&activeProject.data){
                    ProjectDataCenter.loadProjectData(activeProject.data,{source:"indexeddb-project-startup",resetMissing:true});
                    if(typeof window.unlockEditor==="function")window.unlockEditor();
                }
            }else{
                window.state=window.state||{};
                window.state.currentTab=null;
                await LocalImageVault.saveActiveProjectId(null);
            }

            safeStorage.setItem=function(key,value){
                const previous=key===LIBRARY_KEY?parseLibrary(originalGet(key)):[];
                originalSet(key,value);
                if(key===LIBRARY_KEY){
                    const projects=parseLibrary(value);
                    const nextIds=new Set(projects.filter(Boolean).map(project=>project.id));
                    const removed=previous.filter(project=>project&&project.id&&!nextIds.has(project.id)).map(project=>project.id);
                    removed.forEach(id=>LocalImageVault.deleteProjectArtifacts(id).catch(()=>{}));
                    const currentId=window.state&&window.state.currentTab;
                    if(currentId&&removed.includes(currentId)){
                        window.state.currentTab=null;
                        LocalImageVault.saveActiveProjectId(null).catch(()=>{});
                    }
                    LocalImageVault.saveProjectLibrary(projects).catch(error=>console.warn("IndexedDB 專案同步失敗",error));
                }
            };
            safeStorage.removeItem=function(key){
                originalRemove(key);
                if(key===LIBRARY_KEY)LocalImageVault.saveProjectLibrary([]).catch(()=>{});
            };
            safeStorage.getItem=function(key){
                return originalGet(key);
            };

            let lastActive=activeId||null;
            activeWatchTimer=window.setInterval(()=>{
                const next=window.state&&window.state.currentTab||null;
                if(next===lastActive)return;
                lastActive=next;
                LocalImageVault.saveActiveProjectId(next).catch(()=>{});
            },500);
            await LocalImageVault.saveActiveProjectId(lastActive);
            window.IndexedProjectSystem={
                ready:true,
                async list(){return LocalImageVault.loadProjectLibrary()},
                async sync(){
                    const library=parseLibrary(originalGet(LIBRARY_KEY));
                    await LocalImageVault.saveProjectLibrary(library);
                    return library;
                },
                async deleteProject(id){
                    const library=parseLibrary(originalGet(LIBRARY_KEY)).filter(project=>project&&project.id!==id);
                    originalSet(LIBRARY_KEY,JSON.stringify(library));
                    await LocalImageVault.saveProjectLibrary(library);
                    await LocalImageVault.deleteProjectArtifacts(id);
                    if(window.state&&window.state.currentTab===id)window.state.currentTab=null;
                    await LocalImageVault.saveActiveProjectId(window.state&&window.state.currentTab||null);
                    return true;
                }
            };
            document.dispatchEvent(new CustomEvent("indexed-project-system-ready",{detail:{count:merged.length,activeId}}));
        }catch(error){
            initialized=false;
            console.error("IndexedDB 專案系統啟動失敗",error);
        }
    }
    if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",()=>setTimeout(initialize,120),{once:true});
    else setTimeout(initialize,120);
})();
</script>

<script id="indexeddb-image-recovery">
(function(){
    "use strict";
    async function hydrateHtmlImages(){
        if(!window.LocalImageVault||!window.DualFormatWorkspace)return;
        const records=DualFormatWorkspace.state.pages||{};
        let changed=false;
        for(const pageId of Object.keys(records)){
            const record=records[pageId];
            if(!record||!record.html||!record.html.includes("data-local-vault"))continue;
            const template=document.createElement("template");
            template.innerHTML=record.html;
            const images=Array.from(template.content.querySelectorAll("img[data-local-vault]"));
            for(const image of images){
                const id=image.dataset.localVault;
                const source=image.getAttribute("src")||"";
                const unresolved=!source||source.startsWith("local-image://");
                if(!unresolved)continue;
                const data=await LocalImageVault.getImage(id);
                if(data){image.setAttribute("src",data);changed=true}
            }
            record.html=template.innerHTML;
        }
        if(changed){
            DualFormatWorkspace.loadHtml();
            DualFormatWorkspace.renderHtml();
        }
    }
    async function recover(){
        if(!window.LocalImageVault||!window.ProjectDataCenter)return;
        try{
            const activeId=ProjectDataCenter.getActiveProjectId();
            if(activeId){
                const snapshot=await LocalImageVault.loadProjectSnapshot(activeId);
                const libraryProject=ProjectDataCenter.library.get(activeId);
                const updatedAt=libraryProject&&libraryProject.updatedAt;
                const libraryTime=typeof updatedAt==="number"?updatedAt:(updatedAt?Date.parse(updatedAt):0);
                if(snapshot&&snapshot.data&&snapshot.savedAt>libraryTime+500){
                    ProjectDataCenter.loadProjectData(snapshot.data,{source:"indexeddb-image-recovery",resetMissing:true});
                }
            }
            if(window.PixivImageAssets)await PixivImageAssets.hydratePages();
            await hydrateHtmlImages();
        }catch(error){
            console.warn("IndexedDB 圖片還原失敗",error);
        }
    }
    if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",()=>setTimeout(recover,900),{once:true});
    else setTimeout(recover,900);
})();
</script>

<script id="node-presentation-role-plugin">
(function(){
    "use strict";

    const roles = Object.create(null);
    const ROLE_CHAPTER = "chapter";
    const ROLE_CONTINUATION = "continuation";

    function normalizeRole(value){
        return value === ROLE_CONTINUATION ? ROLE_CONTINUATION : ROLE_CHAPTER;
    }
    function pageId(pageOrId){
        if(typeof pageOrId === "string") return pageOrId;
        return pageOrId && pageOrId.id ? pageOrId.id : "";
    }
    function core(){
        return window.GamebookCore || null;
    }
    function pageFor(pageOrId){
        if(pageOrId && typeof pageOrId === "object") return pageOrId;
        const api = core();
        return api && api.getPageById ? api.getPageById(pageOrId) : null;
    }
    function getRole(pageOrId){
        const id = pageId(pageOrId);
        return id && roles[id] === ROLE_CONTINUATION ? ROLE_CONTINUATION : ROLE_CHAPTER;
    }
    function isChapter(pageOrId){
        return getRole(pageOrId) === ROLE_CHAPTER;
    }
    function decorateNode(page){
        if(!page || !page.element) return;
        const role = getRole(page);
        page.element.dataset.nodeRole = role;
        page.element.dataset.nodeRoleReady = "1";
        page.element.setAttribute(
            "aria-label",
            (role === ROLE_CONTINUATION ? "內文延續：" : "新章節：") +
            (page.title || "未命名 Node")
        );
    }
    function refreshAllNodes(){
        const api = core();
        if(!api) return;
        api.pages.forEach(decorateNode);
    }

    let rolePanel = null;
    let titleLabel = null;
    let titleInput = null;
    let hint = null;
    let syncing = false;
    let lastPageId = "";
    let lastRole = "";

    function language(){
        const value = core() && core().language;
        return value === "en" || value === "ja" ? value : "zh";
    }
    function words(){
        const dict = {
            zh:{
                role:"這個 Node 是",
                chapter:"新章節",
                continuation:"內文延續",
                chapterField:"章節標題",
                continuationField:"段落辨識名稱（不輸出成大標題）",
                chapterHint:"閱讀與輸出時顯示為章節大標題。",
                continuationHint:"只在流程畫布顯示名稱；閱讀器與 Pixiv 輸出不顯示大標題。",
                chapterPlaceholder:"輸入讀者會看到的章節標題",
                continuationPlaceholder:"例如：使用銀鑰匙、回到走廊、清晨集合"
            },
            en:{
                role:"This node is",
                chapter:"New chapter",
                continuation:"Continued passage",
                chapterField:"Chapter title",
                continuationField:"Passage label (not exported as a heading)",
                chapterHint:"Shown as a chapter heading in reading and export.",
                continuationHint:"Used on the flow canvas only; no large heading is shown to readers.",
                chapterPlaceholder:"Enter a reader-facing chapter title",
                continuationPlaceholder:"For example: Use the silver key"
            },
            ja:{
                role:"この Node の種類",
                chapter:"新しい章",
                continuation:"本文の続き",
                chapterField:"章タイトル",
                continuationField:"段落識別名（大見出しとして出力しない）",
                chapterHint:"閲覧・出力時に章の大見出しとして表示します。",
                continuationHint:"フロー画面での識別専用。閲覧時には大見出しを表示しません。",
                chapterPlaceholder:"読者に表示する章タイトル",
                continuationPlaceholder:"例：銀の鍵を使う"
            }
        };
        return dict[language()];
    }
    function syncEditor(force){
        const api = core();
        if(!api || !rolePanel || !titleLabel || !titleInput) return;
        const page = api.currentPage;
        const id = page && page.id || "";
        const role = page ? getRole(page) : ROLE_CHAPTER;
        const lang = language();
        if(!force && id === lastPageId && role === lastRole && rolePanel.dataset.lang === lang) return;
        lastPageId = id;
        lastRole = role;
        rolePanel.dataset.lang = lang;
        syncing = true;
        const text = words();
        rolePanel.querySelector(".node-role-title").textContent = text.role;
        rolePanel.querySelector('[data-role-label="chapter"]').textContent = text.chapter;
        rolePanel.querySelector('[data-role-label="continuation"]').textContent = text.continuation;
        const selected = rolePanel.querySelector('input[value="' + role + '"]');
        if(selected) selected.checked = true;
        titleLabel.textContent = role === ROLE_CHAPTER ? text.chapterField : text.continuationField;
        titleInput.placeholder = role === ROLE_CHAPTER ? text.chapterPlaceholder : text.continuationPlaceholder;
        hint.textContent = role === ROLE_CHAPTER ? text.chapterHint : text.continuationHint;
        rolePanel.hidden = !page;
        decorateNode(page);
        syncing = false;
    }
    function setRole(pageOrId,role,options){
        const page = pageFor(pageOrId);
        const id = pageId(pageOrId);
        if(!id) return false;
        const normalized = normalizeRole(role);
        if(normalized === ROLE_CHAPTER) delete roles[id];
        else roles[id] = ROLE_CONTINUATION;
        decorateNode(page);
        syncEditor(true);
        if(!(options && options.silent)){
            const api = core();
            if(api && api.notifyChange){
                api.notifyChange("node-presentation-role",{pageId:id,role:normalized});
            }
            if(window.DualFormatWorkspace && typeof window.DualFormatWorkspace.renderPixiv === "function"){
                window.DualFormatWorkspace.renderPixiv();
            }
        }
        return true;
    }
    function installUi(){
        if(document.getElementById("nodeRolePanel")) return true;
        const api = core();
        if(!api) return false;
        titleInput = document.getElementById("pageTitle");
        if(!titleInput) return false;
        titleLabel = titleInput.previousElementSibling;
        if(!titleLabel || titleLabel.tagName !== "LABEL") return false;
        titleLabel.removeAttribute("data-i18n");

        rolePanel = document.createElement("section");
        rolePanel.id = "nodeRolePanel";
        rolePanel.innerHTML =
            '<strong class="node-role-title">這個 Node 是</strong>' +
            '<div class="node-role-choices">' +
                '<label class="node-role-choice"><input type="radio" name="nodeRole" value="chapter"><span data-role-label="chapter">新章節</span></label>' +
                '<label class="node-role-choice"><input type="radio" name="nodeRole" value="continuation"><span data-role-label="continuation">內文延續</span></label>' +
            '</div>' +
            '<p id="nodeRoleHint"></p>';
        titleLabel.parentNode.insertBefore(rolePanel,titleLabel);
        hint = rolePanel.querySelector("#nodeRoleHint");
        rolePanel.addEventListener("change",function(event){
            if(syncing || !event.target.matches('input[name="nodeRole"]')) return;
            const page = core() && core().currentPage;
            if(page) setRole(page,event.target.value);
        });
        syncEditor(true);
        return true;
    }

    function registerPersistence(){
        if(!window.ProjectDataCenter || typeof window.ProjectDataCenter.register !== "function"){
            setTimeout(registerPersistence,300);
            return;
        }
        if(!window.ProjectDataCenter.has || !window.ProjectDataCenter.has("nodePresentation")){
            window.ProjectDataCenter.register("nodePresentation",{
                description:"Node 的新章節／內文延續屬性",
                defaultValue:{roles:{}},
                resetOnMissing:true,
                save:function(){
                    const api = core();
                    const live = new Set(api ? api.pages.map(function(page){return page.id;}) : []);
                    const output = {};
                    Object.keys(roles).forEach(function(id){
                        if(live.has(id) && roles[id] === ROLE_CONTINUATION) output[id] = ROLE_CONTINUATION;
                    });
                    return {roles:output};
                },
                load:function(value){
                    Object.keys(roles).forEach(function(id){delete roles[id];});
                    const source = value && value.roles && typeof value.roles === "object" ? value.roles : {};
                    Object.keys(source).forEach(function(id){
                        if(source[id] === ROLE_CONTINUATION) roles[id] = ROLE_CONTINUATION;
                    });
                    refreshAllNodes();
                    syncEditor(true);
                }
            });
        }

        // 外掛晚於專案中心載入時，補讀目前專案中的既有屬性。
        try{
            const activeId = window.ProjectDataCenter.getActiveProjectId && window.ProjectDataCenter.getActiveProjectId();
            const project = activeId && window.ProjectDataCenter.library && window.ProjectDataCenter.library.get(activeId);
            const saved = project && (project.data || project);
            if(saved && saved.nodePresentation){
                const value = saved.nodePresentation;
                const source = value && value.roles && typeof value.roles === "object" ? value.roles : {};
                Object.keys(roles).forEach(function(id){delete roles[id];});

.reader-display-card{width:min(620px,96vw);max-height:90vh;overflow:auto;background:#fff;color:#263238;border-radius:18px;box-shadow:0 22px 70px rgba(0,0,0,.35)}
.reader-display-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:linear-gradient(135deg,#00796b,#009688);color:#fff}
.reader-display-head strong{font-size:17px}.reader-display-head button{min-width:38px;padding:7px 12px!important;background:rgba(255,255,255,.18)!important}
.reader-display-body{padding:20px;display:grid;gap:14px}
.reader-display-body label{display:grid;gap:7px;font-size:13px;font-weight:700;color:#37474f}
.reader-display-body input,.reader-display-body textarea{width:100%;padding:10px 12px;border:1px solid #cfd8dc;border-radius:9px;font:inherit;background:#fff;color:#263238}
.reader-display-body textarea{min-height:82px;resize:vertical}
.reader-display-icon-row{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center}
#readerDisplayIconPreview{width:64px;height:64px;border-radius:14px;border:1px solid #cfd8dc;object-fit:contain;background:#f5f7f8}
.reader-display-file-actions{display:flex;gap:8px;flex-wrap:wrap}.reader-display-file-actions button{background:#546e7a!important}
.reader-display-help{font-size:12px;line-height:1.6;color:#607d8b;background:#f3f8f8;padding:10px 12px;border-radius:9px}
.reader-display-actions{display:flex;justify-content:flex-end;gap:9px;flex-wrap:wrap;padding:0 20px 20px}.reader-display-actions button{background:#607d8b!important}.reader-display-actions [data-reader-display-save]{background:#00897b!important}
@media(max-width:600px){.reader-display-card{border-radius:14px}.reader-display-icon-row{grid-template-columns:1fr}.reader-display-actions button{flex:1;justify-content:center}}
</style>
<script>
(function(){
'use strict';
if(window.FirehahaReaderDisplay && window.FirehahaReaderDisplay.version)return;

const STORAGE_KEY='firehaha_reader_display_settings_v1';
const defaults={
  workTitle:'',
  author:'',
  description:'',
  icon:'',
  exportFileName:''
};
let settings=Object.assign({},defaults);
let transformInstalled=false;
let projectRegistered=false;

function clean(value){return String(value==null?'':value).trim()}
function escapeHtml(value){return String(value==null?'':value).replace(/[&<>"']/g,function(ch){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[ch]})}
function escapeAttr(value){return escapeHtml(value).replace(/`/g,'&#96;')}
function safeFileBase(value){
  value=clean(value).replace(/[\\/:*?"<>|\x00-\x1F]/g,'_').replace(/[. ]+$/g,'').slice(0,120);
  return value||'Firehaha_Reader';
}
function getExportFileName(mode){
  let base=clean(settings.exportFileName);
  base=base.replace(/\.html?$/i,'');
  if(!base)base=clean(settings.workTitle)||(mode==='pixiv'?'Pixiv_Test_Reader':'HTML_Custom_Reader');
  return safeFileBase(base)+'.html';
}
function saveLocal(){
  try{(window.safeStorage||localStorage).setItem(STORAGE_KEY,JSON.stringify(settings))}catch(e){}
}
function loadLocal(){
  try{
    const raw=(window.safeStorage||localStorage).getItem(STORAGE_KEY);
    if(raw)settings=Object.assign({},defaults,JSON.parse(raw)||{});
  }catch(e){settings=Object.assign({},defaults)}
}
function setSettings(value,options){
  settings=Object.assign({},defaults,value||{});
  Object.keys(settings).forEach(function(key){settings[key]=clean(settings[key])});
  if(!options||options.persist!==false)saveLocal();
  refreshPanel();
  document.dispatchEvent(new CustomEvent('firehaha:reader-display-settings-changed',{detail:getSettings()}));
}
function getSettings(){return Object.assign({},settings)}

function makePanel(){
  if(document.getElementById('readerDisplaySettingsPanel'))return;
  const panel=document.createElement('div');
  panel.id='readerDisplaySettingsPanel';
  panel.innerHTML=''+
  '<section class="reader-display-card" role="dialog" aria-modal="true" aria-labelledby="readerDisplayHeading">'+
    '<div class="reader-display-head"><strong id="readerDisplayHeading">📖 閱讀器展示設定</strong><button type="button" data-reader-display-close>×</button></div>'+
    '<div class="reader-display-body">'+
      '<label>作品名稱<input id="readerDisplayWorkTitle" type="text" placeholder="用於瀏覽器分頁標題；閱讀畫面由各分頁標題負責"></label>'+
      '<label>作者名稱<input id="readerDisplayAuthor" type="text" placeholder="例如：作者名稱"></label>'+
      '<label>作品簡介<textarea id="readerDisplayDescription" placeholder="簡短介紹作品；留白就不顯示"></textarea></label>'+
      '<label>閱讀器圖示<div class="reader-display-icon-row"><img id="readerDisplayIconPreview" alt="圖示預覽"><div><input id="readerDisplayIconUrl" type="text" placeholder="貼上圖片／圖床網址，或使用下方按鈕"><div class="reader-display-file-actions"><button type="button" data-reader-display-upload>上傳圖片</button><button type="button" data-reader-display-clear-icon>清除圖示</button></div><input id="readerDisplayIconFile" type="file" accept="image/*" hidden></div></div></label>'+
      '<label>輸出檔名<input id="readerDisplayFileName" type="text" placeholder="例如：我的互動小說（會自動加上 .html）"></label>'+
      '<div class="reader-display-help">測試閱讀與輸出閱讀器會共用這組資料。作品名稱、作者、簡介與圖示只用於網頁中繼資料、瀏覽器分頁與輸出檔名，不會在閱讀畫面生成固定展示卡；閱讀畫面由各分頁內容負責。設定也會跟著專案 JSON 保存。</div>'+
    '</div>'+
    '<div class="reader-display-actions"><button type="button" data-reader-display-reset>恢復空白</button><button type="button" data-reader-display-close>取消</button><button type="button" data-reader-display-save>儲存設定</button></div>'+
  '</section>';
  document.body.appendChild(panel);
  panel.addEventListener('click',function(event){if(event.target===panel||event.target.closest('[data-reader-display-close]'))closePanel()});
  panel.querySelector('[data-reader-display-upload]').onclick=function(){panel.querySelector('#readerDisplayIconFile').click()};
  panel.querySelector('[data-reader-display-clear-icon]').onclick=function(){panel.querySelector('#readerDisplayIconUrl').value='';panel.querySelector('#readerDisplayIconPreview').removeAttribute('src')};
  panel.querySelector('#readerDisplayIconUrl').addEventListener('input',function(){updateIconPreview(this.value)});
  panel.querySelector('#readerDisplayIconFile').addEventListener('change',function(){
    const file=this.files&&this.files[0];if(!file)return;
    if(file.size>2.5*1024*1024){alert('圖片超過 2.5MB，請改用較小圖片或圖床網址。');this.value='';return}
    const reader=new FileReader();reader.onload=function(){panel.querySelector('#readerDisplayIconUrl').value=String(reader.result||'');updateIconPreview(reader.result)};reader.readAsDataURL(file)
  });
  panel.querySelector('[data-reader-display-save]').onclick=function(){
    setSettings({
      workTitle:panel.querySelector('#readerDisplayWorkTitle').value,
      author:panel.querySelector('#readerDisplayAuthor').value,
      description:panel.querySelector('#readerDisplayDescription').value,
      icon:panel.querySelector('#readerDisplayIconUrl').value,
      exportFileName:panel.querySelector('#readerDisplayFileName').value
    });
    closePanel();
  };
  panel.querySelector('[data-reader-display-reset]').onclick=function(){if(confirm('確定要清空閱讀器展示設定嗎？')){setSettings(defaults);refreshPanel()}};
  refreshPanel();
}
function updateIconPreview(value){
  const img=document.getElementById('readerDisplayIconPreview');if(!img)return;
  value=clean(value);if(value)img.src=value;else img.removeAttribute('src');
}
function refreshPanel(){
  const panel=document.getElementById('readerDisplaySettingsPanel');if(!panel)return;
  panel.querySelector('#readerDisplayWorkTitle').value=settings.workTitle||'';
  panel.querySelector('#readerDisplayAuthor').value=settings.author||'';
  panel.querySelector('#readerDisplayDescription').value=settings.description||'';
  panel.querySelector('#readerDisplayIconUrl').value=settings.icon||'';
  panel.querySelector('#readerDisplayFileName').value=settings.exportFileName||'';
  updateIconPreview(settings.icon);
}
function openPanel(){makePanel();refreshPanel();document.getElementById('readerDisplaySettingsPanel').classList.add('open')}
function closePanel(){const panel=document.getElementById('readerDisplaySettingsPanel');if(panel)panel.classList.remove('open')}
function addButton(){
  if(document.getElementById('readerDisplaySettingsBtn'))return;
  const button=document.createElement('button');button.id='readerDisplaySettingsBtn';button.type='button';button.textContent='📖 閱讀器設定';button.onclick=openPanel;
  const save=document.getElementById('saveProject'),group=save&&save.closest('.header-group');
  if(group)group.appendChild(button);else{const header=document.querySelector('.pixiv-editor-app header');if(header)header.appendChild(button)}
}

function transformReader(html,context){
  const mode=context&&context.mode==='html'?'html':'pixiv';
  const title=settings.workTitle||((mode==='pixiv')?'Pixiv 測試閱讀':'HTML 測試閱讀');
  const fullTitle=settings.author?title+'｜'+settings.author:title;
  const icon=settings.icon;
  const description=settings.description;
  const meta='\n<meta name="description" content="'+escapeAttr(description)+'">'+
    (settings.author?'\n<meta name="author" content="'+escapeAttr(settings.author)+'">':'')+
    (icon?'\n<link rel="icon" href="'+escapeAttr(icon)+'">':'')+'\n';
  html=html.replace(/<title>[\s\S]*?<\/title>/i,'<title>'+escapeHtml(fullTitle)+'</title>'+meta);
  return html;
}
function installTransform(){
  if(transformInstalled)return true;
  if(!window.ReaderArtifactCore||typeof window.ReaderArtifactCore.registerTransform!=='function')return false;
  window.ReaderArtifactCore.registerTransform('firehaha-reader-display-settings',transformReader,25);
  transformInstalled=true;return true;
}
function registerProjectData(){
  if(projectRegistered)return true;
  if(!window.ProjectDataCenter||typeof window.ProjectDataCenter.register!=='function')return false;
  try{
    if(window.ProjectDataCenter.has&&window.ProjectDataCenter.has('readerDisplaySettings')){projectRegistered=true;return true}
    window.ProjectDataCenter.register('readerDisplaySettings',{
      description:'閱讀器網頁標題、作者中繼資料、簡介、圖示與輸出檔名',
      defaultValue:Object.assign({},defaults),
      resetOnMissing:true,
      save:function(){return getSettings()},
      load:function(value){setSettings(value||defaults,{persist:true})}
    });
    projectRegistered=true;return true;
  }catch(error){console.warn('[Reader display settings] 專案註冊失敗',error);return false}
}

window.FirehahaReaderDisplay=Object.freeze({version:'1.1.0',open:openPanel,close:closePanel,getSettings:getSettings,setSettings:setSettings,getExportFileName:getExportFileName,transform:transformReader});
loadLocal();
function boot(){addButton();makePanel();installTransform();registerProjectData()}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
let attempts=0;const timer=setInterval(function(){boot();attempts++;if((transformInstalled&&projectRegistered&&document.getElementById('readerDisplaySettingsBtn'))||attempts>80)clearInterval(timer)},250);
})();
</script>

</body>
</html>
