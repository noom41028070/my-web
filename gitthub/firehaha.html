// 創作輔助工具套件
// 模組一：便利貼 / 圖片釘選（沿用既有的 window.allNotes，已整合進存讀檔）
// 本機圖片共用處理：縮小尺寸、轉 WebP 並壓低資料網址長度。
window.LocalImageTools = window.LocalImageTools || (function(){
    function blobToDataUrl(blob){
        return new Promise((resolve,reject)=>{
            const reader = new FileReader();
            reader.onload = ()=>resolve(String(reader.result || ""));
            reader.onerror = reject;
            reader.readAsDataURL(blob);
        });
    }
    function canvasToBlob(canvas,type,quality){
        return new Promise(resolve=>canvas.toBlob(resolve,type,quality));
    }
    async function compress(file,options){
        options = Object.assign({maxSide:1600,maxBytes:700*1024,quality:.84},options || {});
        if(!file || !String(file.type || "").startsWith("image/")) throw new Error("not an image");
        if(file.size > 30*1024*1024) throw new Error("image too large");
        const objectUrl = URL.createObjectURL(file);
        try{
            const image = new Image();
            image.src = objectUrl;
            if(image.decode) await image.decode();
            else await new Promise((resolve,reject)=>{ image.onload=resolve; image.onerror=reject; });
            const sourceWidth = image.naturalWidth || image.width;
            const sourceHeight = image.naturalHeight || image.height;
            let scale = Math.min(1,options.maxSide/Math.max(sourceWidth,sourceHeight));
            let width = Math.max(1,Math.round(sourceWidth*scale));
            let height = Math.max(1,Math.round(sourceHeight*scale));
            let quality = options.quality;
            let blob = null;
            const canvas = document.createElement("canvas");
            const context = canvas.getContext("2d",{alpha:true});
            for(let attempt=0;attempt<14;attempt++){
                canvas.width=width;
                canvas.height=height;
                context.clearRect(0,0,width,height);
                context.drawImage(image,0,0,width,height);
                blob=await canvasToBlob(canvas,"image/webp",quality);
                if(blob && blob.size<=options.maxBytes) break;
                if(quality>.5) quality-=.08;
                else {
                    width=Math.max(1,Math.round(width*.84));
                    height=Math.max(1,Math.round(height*.84));
                    quality=.76;
                }
            }
            if(!blob) throw new Error("compression failed");
            return {
                dataUrl:await blobToDataUrl(blob),
                bytes:blob.size,
                width,
                height,
                originalBytes:file.size
            };
        } finally {
            URL.revokeObjectURL(objectUrl);
        }
    }
    return {compress};
})();

// 大型本機圖片與含圖片專案快照使用 IndexedDB，避免 localStorage 容量不足後刷新遺失。
window.LocalImageVault = window.LocalImageVault || (function(){
    const DB_NAME="FirehahaLocalImageVault";
    const DB_VERSION=1;
    let databasePromise=null;
    function open(){
        if(databasePromise)return databasePromise;
        databasePromise=new Promise((resolve,reject)=>{
            if(!window.indexedDB){reject(new Error("IndexedDB unavailable"));return}
            const request=indexedDB.open(DB_NAME,DB_VERSION);
            request.onupgradeneeded=()=>{
                const db=request.result;
                if(!db.objectStoreNames.contains("images"))db.createObjectStore("images",{keyPath:"id"});
                if(!db.objectStoreNames.contains("records"))db.createObjectStore("records",{keyPath:"key"});
            };
            request.onsuccess=()=>resolve(request.result);
            request.onerror=()=>reject(request.error||new Error("IndexedDB open failed"));
        });
        return databasePromise;
    }
    async function write(storeName,value){
        const db=await open();
        return new Promise((resolve,reject)=>{
            const transaction=db.transaction(storeName,"readwrite");
            transaction.objectStore(storeName).put(value);
            transaction.oncomplete=()=>resolve(value);
            transaction.onerror=()=>reject(transaction.error);
            transaction.onabort=()=>reject(transaction.error||new Error("IndexedDB write aborted"));
        });
    }
    async function read(storeName,key){
        const db=await open();
        return new Promise((resolve,reject)=>{
            const request=db.transaction(storeName,"readonly").objectStore(storeName).get(key);
            request.onsuccess=()=>resolve(request.result||null);
            request.onerror=()=>reject(request.error);
        });
    }
    async function readAll(storeName){
        const db=await open();
        return new Promise((resolve,reject)=>{
            const request=db.transaction(storeName,"readonly").objectStore(storeName).getAll();
            request.onsuccess=()=>resolve(Array.isArray(request.result)?request.result:[]);
            request.onerror=()=>reject(request.error);
        });
    }
    async function remove(storeName,key){
        const db=await open();
        return new Promise((resolve,reject)=>{
            const transaction=db.transaction(storeName,"readwrite");
            transaction.objectStore(storeName).delete(key);
            transaction.oncomplete=()=>resolve(true);
            transaction.onerror=()=>reject(transaction.error);
            transaction.onabort=()=>reject(transaction.error||new Error("IndexedDB delete aborted"));
        });
    }
    function makeId(prefix){
        return (prefix||"img_")+(crypto.randomUUID
            ? crypto.randomUUID().replace(/-/g,"").slice(0,14)
            : Date.now().toString(36)+Math.random().toString(36).slice(2,9));
    }
    async function putImage(dataUrl,meta){
        meta=meta||{};
        const id=meta.id||makeId("img_");
        await write("images",{id,dataUrl:String(dataUrl||""),name:meta.name||"",mime:meta.mime||"",updatedAt:Date.now()});
        return id;
    }
    async function getImage(id){
        const value=await read("images",id);
        return value&&value.dataUrl||"";
    }
    async function saveMaterials(items){
        const indexed=[];
        for(const original of (items||[])){
            const item=Object.assign({},original);
            if(item.type==="image"&&item.data){
                if(!item.vaultId)item.vaultId=makeId("img_");
                await putImage(item.data,{id:item.vaultId,name:item.name||"",mime:"image/webp"});
                item.data="";
            }
            indexed.push(item);
        }
        await write("records",{key:"material-library",items:indexed,updatedAt:Date.now()});
    }
    async function loadMaterials(){
        const value=await read("records","material-library");
        return value&&Array.isArray(value.items)?value.items:[];
    }
    async function saveProjectSnapshot(projectId,data){
        if(!projectId||!data)return;
        const value={key:"project:"+projectId,projectId,data,savedAt:Date.now()};
        await write("records",value);
        await write("records",{key:"latest-project",projectId,savedAt:value.savedAt});
    }
    async function loadProjectSnapshot(projectId){
        let id=projectId;
        if(!id){
            const latest=await read("records","latest-project");
            id=latest&&latest.projectId;
        }
        return id?read("records","project:"+id):null;
    }
    async function saveProjectLibrary(projects){
        const next=Array.isArray(projects)?projects:[];
        const previous=await read("records","project-library");
        const tombstoneRecord=await read("records","project-tombstones");
        const tombstones=Object.assign({},tombstoneRecord&&tombstoneRecord.items||{});
        const nextIds=new Set(next.filter(Boolean).map(project=>project.id));
        (previous&&Array.isArray(previous.projects)?previous.projects:[]).forEach(project=>{
            if(project&&project.id&&!nextIds.has(project.id))tombstones[project.id]=Date.now();
        });
        next.forEach(project=>{
            if(!project||!project.id||!tombstones[project.id])return;
            const value=project.updatedAt;
            const updated=typeof value==="number"?value:(value?Date.parse(value):0);
            if(Number.isFinite(updated)&&updated>Number(tombstones[project.id]))delete tombstones[project.id];
        });
        const persisted=next.filter(project=>{
            if(!project||!project.id)return false;
            const deletedAt=Number(tombstones[project.id])||0;
            if(!deletedAt)return true;
            const value=project.updatedAt;
            const updated=typeof value==="number"?value:(value?Date.parse(value):0);
            return Number.isFinite(updated)&&updated>deletedAt;
        });
        await write("records",{key:"project-tombstones",items:tombstones,updatedAt:Date.now()});
        await write("records",{key:"project-library",projects:persisted,updatedAt:Date.now()});
    }
    async function loadProjectLibrary(){
        const value=await read("records","project-library");
        return value&&Array.isArray(value.projects)?value.projects:[];
    }
    async function loadProjectTombstones(){
        const value=await read("records","project-tombstones");
        return value&&value.items||{};
    }
    async function saveActiveProjectId(id){
        await write("records",{key:"active-project",id:id||null,updatedAt:Date.now()});
    }
    async function loadActiveProjectId(){
        const value=await read("records","active-project");
        return value&&value.id||null;
    }
    async function deleteProjectArtifacts(projectId){
        if(!projectId)return;
        await remove("records","project:"+projectId);
        const latest=await read("records","latest-project");
        if(latest&&latest.projectId===projectId)await remove("records","latest-project");
    }
    async function inspect(){
        const [images,records]=await Promise.all([readAll("images"),readAll("records")]);
        return {database:DB_NAME,version:DB_VERSION,images,records};
    }
    return {makeId,putImage,getImage,saveMaterials,loadMaterials,saveProjectSnapshot,loadProjectSnapshot,saveProjectLibrary,loadProjectLibrary,loadProjectTombstones,saveActiveProjectId,loadActiveProjectId,deleteProjectArtifacts,inspect};
})();

// Pixiv 編輯器只保存短代號；實際圖片由獨立資產表管理。
window.PixivImageAssets = window.PixivImageAssets || (function(){
    let assets = {};
    function makeId(){
        return "px_"+(crypto.randomUUID
            ? crypto.randomUUID().replace(/-/g,"").slice(0,10)
            : Date.now().toString(36)+Math.random().toString(36).slice(2,7));
    }
    function remember(data){
        data=String(data || "").replace(/\s+/g,"");
        for(const id in assets) if(assets[id]===data) return id;
        const id=makeId();
        assets[id]=data;
        if(window.LocalImageVault)LocalImageVault.putImage(data,{id,name:"Pixiv 圖片"}).catch(error=>console.warn("Pixiv 圖片資料庫寫入失敗",error));
        return id;
    }
    function compact(text){
        return String(text || "").replace(
            /data:image\/[a-z0-9.+-]+;base64,[a-z0-9+/=\r\n]+/gi,
            data=>"local-image://"+remember(data)
        );
    }
    function expand(text){
        return String(text || "").replace(
            /local-image:\/\/([a-z0-9_-]+)/gi,
            (all,id)=>assets[id] || all
        );
    }
    function migratePages(){
        const pages=window.GamebookCore&&Array.isArray(GamebookCore.pages)
            ? GamebookCore.pages
            : (Array.isArray(window.pages)?window.pages:[]);
        let changed=false;
        pages.forEach(page=>{
            const before=String(page.text || "");
            const after=compact(before);
            if(after!==before){ page.text=after; changed=true; }
        });
        const editor=document.getElementById("pageText");
        const current=window.GamebookCore&&GamebookCore.currentPage;
        if(editor&&current&&editor.value!==String(current.text || "")) editor.value=String(current.text || "");
        if(changed&&window.GamebookCore&&GamebookCore.notifyChange) GamebookCore.notifyChange("pixiv-image-url-shortened");
        return changed;
    }
    async function hydratePages(){
        const pages=window.GamebookCore&&Array.isArray(GamebookCore.pages)?GamebookCore.pages:[];
        const ids=new Set();
        pages.forEach(page=>String(page.text||"").replace(/local-image:\/\/([a-z0-9_-]+)/gi,(all,id)=>{ids.add(id);return all}));
        await Promise.all(Array.from(ids).map(async id=>{
            if(assets[id])return;
            try{const data=await LocalImageVault.getImage(id);if(data)assets[id]=data}catch(error){}
        }));
        migratePages();
        if(window.DualFormatWorkspace)DualFormatWorkspace.renderPixiv();
    }
    function register(){
        if(!window.ProjectDataCenter||typeof ProjectDataCenter.register!=="function"){
            setTimeout(register,500);
            return;
        }
        try{
            ProjectDataCenter.register("pixivImageAssets",{
                description:"Pixiv 本機圖片短網址資產",
                defaultValue:{assets:{}},
                resetOnMissing:true,
                save:()=>({assets}),
                load:value=>{
                    assets=value&&value.assets||{};
                    Object.keys(assets).forEach(id=>LocalImageVault.putImage(assets[id],{id,name:"Pixiv 圖片"}).catch(()=>{}));
                    setTimeout(hydratePages,0);
                }
            });
            const activeId=ProjectDataCenter.getActiveProjectId&&ProjectDataCenter.getActiveProjectId();
            const activeProject=activeId&&ProjectDataCenter.library&&ProjectDataCenter.library.get(activeId);
            const savedData=activeProject&&(activeProject.data||activeProject);
            if(savedData&&savedData.pixivImageAssets){
                assets=savedData.pixivImageAssets.assets||{};
                setTimeout(hydratePages,0);
            }
        }catch(error){ console.warn("pixivImageAssets register",error); }
    }
    register();
    setTimeout(migratePages,800);
    return {remember,compact,expand,migratePages,hydratePages,get assets(){return assets;}};
})();

// 模組二：素材庫（資料夾）－ 上傳圖片／文字檔，拖到畫布釘選，像虛擬桌布

(function(){

	const flowCanvasEl = document.getElementById("flowCanvas");
	const flowPanelEl = document.getElementById("flowPanel");
	if(!flowCanvasEl || !flowPanelEl) return;

	// ---------- 共用工具 ----------
	function toLocalXY(clientX, clientY){
    	const rect = flowCanvasEl.getBoundingClientRect();
    	return { x: clientX - rect.left, y: clientY - rect.top };
	}

	function markProjectDirty(){
    	if (typeof projectChanged !== "undefined") projectChanged = true;
    	if (typeof window.markDirty === "function") window.markDirty();
	}

	// ---------- 浮動主工具列 ----------
	// 這 4 個按鈕直接掛在 document.body 上（不放在 header 裡），
	// 是因為 header 的 CSS 疊層環境（z-index:10）會把裡面所有子元素都困住，
	// 一旦「尚未開啟專案」的全螢幕鎖定遮罩（z-index:999999）出現，
	// header 裡任何按鈕不管自己 z-index 設多高都不可能蓋過遮罩、也點不到。
	// 改成浮動在 body 上、z-index 拉高到遮罩之上，才能保證任何時候都點得到。
	const floatToolbar = document.createElement("div");
	floatToolbar.id = "gamebook-float-toolbar";
	floatToolbar.innerHTML =
    	'<button type="button" id="folder-toggle-btn">📁 素材庫</button>' +
    	'<button type="button" id="sticky-note-add-btn">🗒️ 便利貼</button>' +

    	'<button type="button" id="dice-roller-btn">🎲 骰子</button>';
	document.body.appendChild(floatToolbar);

	// =====================================================
	// 模組一：便利貼 / 圖片釘選
	// =====================================================
	window.allNotes = window.allNotes || [];

	const NOTE_COLORS = ["#fff59d","#ffccbc","#c8e6c9","#bbdefb","#e1bee7","#f5f5f5"];

	function createNoteElement(note){
    	const el = document.createElement("div");
    	el.className = "corkboard-note";
    	const isCanvasImage = (note.type === "image" || note.type === "canvas-image") && (note.image || note.vaultId);
    	if(isCanvasImage) el.classList.add("canvas-image-asset");
        if(isCanvasImage && !note.width) note.width = 180;
        if(isCanvasImage && !note.height) note.height = 130;
    	el.style.left = (note.x||40) + "px";
    	el.style.top = (note.y||40) + "px";
    	el.style.background = isCanvasImage ? "transparent" : (note.color || NOTE_COLORS[0]);
    	el.dataset.noteId = note.id;
    	if(note.width) el.style.width = note.width + "px";
    	if(note.height) el.style.height = note.height + "px";

    	const toolbar = document.createElement("div");
    	toolbar.className = "note-toolbar";

    	const dot = document.createElement("span");
    	dot.className = "note-color-dot";
    	dot.style.background = note.color || NOTE_COLORS[0];
    	dot.title = "點擊切換顏色";
    	dot.addEventListener("click", (e)=>{
        	e.stopPropagation();
        	const idx = NOTE_COLORS.indexOf(note.color);
        	note.color = NOTE_COLORS[(idx+1) % NOTE_COLORS.length];
        	el.style.background = note.color;
        	dot.style.background = note.color;
        	markProjectDirty();
    	});

    	const delBtn = document.createElement("button");
    	delBtn.className = "note-delete-btn";
    	delBtn.type = "button";
    	delBtn.textContent = "✕ 刪除";
    	delBtn.addEventListener("click", (e)=>{
        	e.stopPropagation();
        	if(!confirm("確定要刪除這則便利貼／圖片嗎？")) return;
        	window.allNotes = window.allNotes.filter(n => n.id !== note.id);
        	el.remove();
        	markProjectDirty();
    	});

    	if(!isCanvasImage) toolbar.appendChild(dot);
    	toolbar.appendChild(delBtn);
    	el.appendChild(toolbar);

    	if(isCanvasImage){
        	const img = document.createElement("img");
        	img.src = note.image || "";
        	img.alt = note.name || "畫布圖片";
        	el.appendChild(img);
            if(!note.image&&note.vaultId&&window.LocalImageVault){
                LocalImageVault.getImage(note.vaultId).then(data=>{
                    if(!data)return;
                    note.image=data;
                    img.src=data;
                    markProjectDirty();
                }).catch(()=>{});
            }
        	if(note.name) el.title = note.name;
    	} else {
        	const ta = document.createElement("textarea");
        	ta.value = note.text || "";
        	ta.placeholder = "寫點什麼…（劇情靈感、待辦、設定備忘）";
        	ta.addEventListener("pointerdown", e => e.stopPropagation());
        	ta.addEventListener("input", ()=>{
            	note.text = ta.value;
            	markProjectDirty();
        	});
        	el.appendChild(ta);
    	}

    	// 拖曳移動（與節點拖曳邏輯一致：用 clientX/Y 位移量累加，不受捲動影響；
    	// 同時支援滑鼠與觸控，因為 Pointer Events 本來就統一了兩者）
    	// move/up 監聽掛在 document 上，不只掛在便利貼本身：
    	// 這樣手指滑得比較快、暫時滑出便利貼範圍時，也不會漏接後續移動事件，
    	// 拖曳體感才會跟拉節點一樣穩、一樣跟得上手指。
    	el.addEventListener("pointerdown", (e)=>{
        	if(e.target.tagName === "TEXTAREA") return;
        	if(e.target.closest(".note-toolbar")) return; // 點色點／刪除鈕不要誤觸拖曳
        	if(e.target.closest(".note-resize-handle")) return;
        	e.preventDefault();
        	try { el.setPointerCapture(e.pointerId); } catch(err) {}
        	el.classList.add("dragging");
        	const offsetX = e.clientX - note.x;
        	const offsetY = e.clientY - note.y;
        	function move(ev){
            	note.x = Math.max(0, ev.clientX - offsetX);
            	note.y = Math.max(0, ev.clientY - offsetY);
            	el.style.left = note.x + "px";
            	el.style.top = note.y + "px";
            	markProjectDirty();
        	}
        	function up(){
            	el.classList.remove("dragging");
            	document.removeEventListener("pointermove", move);
            	document.removeEventListener("pointerup", up);
            	document.removeEventListener("pointercancel", up);
        	}
        	document.addEventListener("pointermove", move);
        	document.addEventListener("pointerup", up);
        	document.addEventListener("pointercancel", up);
    	});

    	// 右下角縮放把手：寬高會寫回 note，並跟著專案存檔。
    	const resizeHandle = document.createElement("div");
    	resizeHandle.className = "note-resize-handle";
    	resizeHandle.title = "拖曳調整便利貼大小";
    	resizeHandle.addEventListener("pointerdown", (e)=>{
        	e.preventDefault();
        	e.stopPropagation();
        	const startX = e.clientX;
        	const startY = e.clientY;
        	const rect = el.getBoundingClientRect();
        	const startW = rect.width;
        	const startH = rect.height;
        	function move(ev){
            	const width = Math.max(160, Math.min(620, startW + ev.clientX - startX));
            	const height = Math.max(90, Math.min(720, startH + ev.clientY - startY));
            	note.width = Math.round(width);
            	note.height = Math.round(height);
            	el.style.width = note.width + "px";
            	el.style.height = note.height + "px";
            	markProjectDirty();
        	}
        	function up(){
            	document.removeEventListener("pointermove", move);
            	document.removeEventListener("pointerup", up);
            	document.removeEventListener("pointercancel", up);
        	}
        	document.addEventListener("pointermove", move);
        	document.addEventListener("pointerup", up);
        	document.addEventListener("pointercancel", up);
    	});
    	el.appendChild(resizeHandle);

    	return el;
	}

	window.renderNotes = function(){

	window.addStickyNote = function(opts){

	// =====================================================

	const libPanel = document.createElement("div");

	function renderMaterialList(){

        	card.addEventListener("pointerdown", (e)=>{

	function startMaterialDrag(startEvent, item, card){
    	startEvent.preventDefault();
    	try { card.setPointerCapture(startEvent.pointerId); } catch(err) {}
    	card.classList.add("dragging-source");

    	const ghost = document.createElement("div");
    	ghost.className = "material-drag-ghost";
    	if(item.type === "image"){
        	ghost.innerHTML = '<img src="' + item.data + '" alt="">';
    	} else {
        	ghost.innerHTML =
            	'<div class="ghost-doc-icon">📄</div>' +
            	'<div class="ghost-name">' + escapeHtml(item.name) + '</div>';
    	}
    	document.body.appendChild(ghost);
    	positionGhost(startEvent.clientX, startEvent.clientY);

    	function positionGhost(x, y){
        	ghost.style.left = x + "px";
        	ghost.style.top = y + "px";
    	}

    	function isOverCanvas(x, y){
        	const rect = flowPanelEl.getBoundingClientRect();
        	return x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom;
    	}

    	function move(ev){
        	positionGhost(ev.clientX, ev.clientY);
        	const over = isOverCanvas(ev.clientX, ev.clientY);
        	flowPanelEl.classList.toggle("material-drop-hover", over);
        	ghost.classList.toggle("drop-ready", over);
    	}

    	function finish(ev){
        	document.removeEventListener("pointermove", move);
        	document.removeEventListener("pointerup", finish);
        	document.removeEventListener("pointercancel", cancel);
        	card.classList.remove("dragging-source");
        	flowPanelEl.classList.remove("material-drop-hover");
        	ghost.remove();

        	if(isOverCanvas(ev.clientX, ev.clientY)){
            	const pos = toLocalXY(ev.clientX, ev.clientY);
            	if(item.type === "image"){
                	window.addStickyNote({ type:"image", image:item.data, name:item.name, x:pos.x - 90, y:pos.y - 65, width:180, height:130, color:"#ffffff" });
            	} else {
                	window.addStickyNote({ type:"text", text:item.data, name:item.name, x:pos.x - 60, y:pos.y - 40 });
            	}
            	// 拖成功後自動收合面板，手機上能立刻看到剛剛放上畫布的結果
            	libPanel.classList.remove("open");
        	}
    	}

    	function cancel(){
        	document.removeEventListener("pointermove", move);
        	document.removeEventListener("pointerup", finish);
        	document.removeEventListener("pointercancel", cancel);
        	card.classList.remove("dragging-source");
        	flowPanelEl.classList.remove("material-drop-hover");
        	ghost.remove();
    	}

    	document.addEventListener("pointermove", move);
    	document.addEventListener("pointerup", finish);
    	document.addEventListener("pointercancel", cancel);
	}

	function escapeHtml(str){
    	return String(str).replace(/[&<>"']/g, c => ({
        	"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
    	}[c]));
	}

	async function handleMaterialFiles(files){
    	if(!files || !files.length) return;
    	const items = loadMaterials();
        const pending = Array.from(files).map(async file => {
            if(file.type.startsWith("image/")){
                const result = await window.LocalImageTools.compress(file);
                const vaultId=window.LocalImageVault
                    ? await LocalImageVault.putImage(result.dataUrl,{name:file.name,mime:"image/webp"})
                    : "";
                return {
                    type:"image",
                    name:file.name,
                    data:result.dataUrl,
                    vaultId,
                    compressedBytes:result.bytes,
                    originalBytes:result.originalBytes,
                    width:result.width,
                    height:result.height
                };
            }
            return await new Promise((resolve,reject)=>{
                const reader = new FileReader();
                reader.onload = ()=>resolve({type:"text",name:file.name,data:reader.result});
                reader.onerror = reject;
                reader.readAsText(file,"UTF-8");
            });
        });
        try{
            const loaded = await Promise.all(pending);
            items.push(...loaded);
            saveMaterials(items);
            renderMaterialList();
        }catch(error){
            console.error(error);
            alert(error && error.message==="image too large"
                ? "圖片超過 30 MB，請改用稍小的圖片。"
                : "圖片壓縮失敗，請換一張圖片再試。");
        }
	}

            for(const item of stored){

                if(!byKey.has(key)){current.push(item);byKey.set(key,item)}

	// =====================================================
	// 模組三：自由畫筆
	// =====================================================
	window.allDrawings = window.allDrawings || [];
	window.__drawModeActive = false;

	const svgNS = "http://www.w3.org/2000/svg";
	const drawLayer = document.createElementNS(svgNS, "svg");
	drawLayer.id = "drawLayer";
	drawLayer.style.position = "absolute";
	drawLayer.style.left = "0";
	drawLayer.style.top = "0";
	drawLayer.style.zIndex = "50";
	drawLayer.style.pointerEvents = "none";
	// 手機關鍵：不設 touch-action:none 的話，瀏覽器會把手指移動誤判成「想滾動畫面」，
	// 導致畫筆在手機上完全畫不出線、或者線斷斷續續、延遲很重。
	drawLayer.style.touchAction = "none";
	drawLayer.style.webkitUserSelect = "none";
	drawLayer.style.userSelect = "none";
	flowCanvasEl.appendChild(drawLayer);

	function resizeDrawLayer(){
    	const w = Math.max(flowPanelEl.scrollWidth, flowCanvasEl.offsetWidth, 1200);
    	const h = Math.max(flowPanelEl.scrollHeight, flowCanvasEl.offsetHeight, 1000);
    	drawLayer.setAttribute("width", w);
    	drawLayer.setAttribute("height", h);
    	drawLayer.style.width = w + "px";
    	drawLayer.style.height = h + "px";
	}

	// 筆劃資料統一用座標點陣列（points）記錄，橡皮擦才有辦法「只擦局部」；
	// d 字串用 pointsToD 隨時從 points 重新算出即可，不需要另外維護兩份。
	function pointsToD(points){
    	if(!points || !points.length) return "";
    	return points.map((p, i) => (i === 0 ? "M " : "L ") + p[0] + " " + p[1]).join(" ");
	}
	// 讀舊專案時，可能還是舊格式（只有 d 字串、沒有 points），
	// 這裡負責把 d 字串還原成座標點陣列，讓舊存檔一樣能被橡皮擦局部擦除。
	function parseDToPoints(d){
    	const points = [];
    	if(!d) return points;
    	const re = /[ML]\s*(-?[0-9.]+)\s+(-?[0-9.]+)/g;
    	let m;
    	while((m = re.exec(d))){
        	points.push([parseFloat(m[1]), parseFloat(m[2])]);
    	}
    	return points;
	}

	window.renderDrawings = function(){
    	// 專案切換/匯入時 flowCanvas.innerHTML 會被整個清空，
    	// drawLayer 這個 SVG 節點也會跟著被移除，所以每次渲染都要重新插回去，
    	// 不然畫筆圖層就會憑空消失，畫了也看不到、點了也沒反應。
    	flowCanvasEl.appendChild(drawLayer);
    	drawLayer.innerHTML = "";
    	resizeDrawLayer();
    	(window.allDrawings || []).forEach(stroke => {
        	if(!stroke.points || !stroke.points.length){
            	stroke.points = parseDToPoints(stroke.d || "");
        	}
        	const path = document.createElementNS(svgNS, "path");
        	path.setAttribute("d", pointsToD(stroke.points));
        	path.setAttribute("fill", "none");
        	path.setAttribute("stroke", stroke.color || "#e53935");
        	path.setAttribute("stroke-width", stroke.width || 3);
        	path.setAttribute("stroke-linecap", "round");
        	path.setAttribute("stroke-linejoin", "round");
        	drawLayer.appendChild(path);
    	});
	};
	window.renderDrawings();

	let drawColor = "#e53935";
	let drawWidth = 3;
	let eraserMode = false;
	let currentPath = null;
	let currentPoints = null;
	let isErasing = false;

	const drawToolbar = document.createElement("div");
	drawToolbar.id = "draw-toolbar";
	const DRAW_COLORS = ["#e53935","#1976d2","#43a047","#fbc02d","#212121","#ffffff"];
	drawToolbar.innerHTML =
    	DRAW_COLORS.map(c => '<span class="draw-color" data-color="'+c+'" style="background:'+c+';"></span>').join("") +
    	'<button type="button" data-w="2">細</button>' +
    	'<button type="button" data-w="4">中</button>' +
    	'<button type="button" data-w="9">粗</button>' +
    	'<button type="button" id="draw-eraser-btn">🧹 橡皮擦</button>' +
    	'<button type="button" id="draw-undo-btn">↩ 復原</button>' +
    	'<button type="button" id="draw-clear-btn">🗑 清空</button>' +
    	'<button type="button" id="draw-done-btn">✅ 完成</button>';
	document.body.appendChild(drawToolbar);

	// 橡皮擦的圓形預覽游標：跟著手指／滑鼠走，讓使用者知道目前會擦掉多大範圍
	const eraserCursor = document.createElement("div");
	eraserCursor.id = "eraser-cursor";
	eraserCursor.style.display = "none";
	document.body.appendChild(eraserCursor);

	function currentEraserRadius(){
    	// 橡皮擦大小跟著目前選的筆刷粗細走（粗筆刷 → 橡皮擦也比較大），
    	// 不用另外多做一組「橡皮擦大小」的按鈕，操作起來比較直覺。
    	return Math.max(14, drawWidth * 5);
	}

	function updateEraserCursor(clientX, clientY){
    	const r = currentEraserRadius();
    	eraserCursor.style.width = (r * 2) + "px";
    	eraserCursor.style.height = (r * 2) + "px";
    	eraserCursor.style.left = (clientX - r) + "px";
    	eraserCursor.style.top = (clientY - r) + "px";
	}

	drawToolbar.querySelectorAll(".draw-color").forEach(dot => {
    	dot.addEventListener("click", ()=>{
        	drawColor = dot.dataset.color;
        	drawToolbar.querySelectorAll(".draw-color").forEach(d=>d.classList.remove("active"));
        	dot.classList.add("active");
        	eraserMode = false;
        	eraserCursor.style.display = "none";
        	const eraserBtn = document.getElementById("draw-eraser-btn");
        	if (eraserBtn) eraserBtn.classList.remove("active-tool");
    	});
	});
	drawToolbar.querySelectorAll("button[data-w]").forEach(btn => {
    	btn.addEventListener("click", ()=>{ drawWidth = Number(btn.dataset.w); });
	});
	document.getElementById("draw-eraser-btn").addEventListener("click", (e)=>{
    	eraserMode = !eraserMode;
    	e.target.classList.toggle("active-tool", eraserMode);
    	if(!eraserMode) eraserCursor.style.display = "none";
	});
	document.getElementById("draw-undo-btn").addEventListener("click", ()=>{
    	window.allDrawings.pop();
    	window.renderDrawings();
    	markProjectDirty();
	});
	document.getElementById("draw-clear-btn").addEventListener("click", ()=>{
    	if(!window.allDrawings.length) return;
    	if(!confirm("確定要清空所有畫筆標記嗎？此動作無法復原。")) return;
    	window.allDrawings = [];
    	window.renderDrawings();
    	markProjectDirty();
	});
	document.getElementById("draw-done-btn").addEventListener("click", ()=> setDrawMode(false));

	function setDrawMode(active){
    	window.__drawModeActive = active;
    	flowPanelEl.classList.toggle("drawing-active", active);
    	drawLayer.style.pointerEvents = active ? "auto" : "none";
    	drawToolbar.classList.toggle("open", active);
    	const toggleBtn = document.getElementById("draw-mode-toggle-btn");
    	if (toggleBtn) toggleBtn.classList.toggle("active-tool", active);
    	if(active) resizeDrawLayer();
    	else eraserCursor.style.display = "none";
	}

	const drawModeBtn = document.getElementById("draw-mode-toggle-btn");
	if (drawModeBtn) drawModeBtn.addEventListener("click", ()=> setDrawMode(!window.__drawModeActive));

	// 局部橡皮擦：只挖掉游標半徑內的那幾個點，同一條線被挖斷的話就自動拆成
	// 兩段（或多段）獨立的線，不會像以前那樣一碰到線就整條消失。
	function eraseNear(pos){
    	const r2 = currentEraserRadius() * currentEraserRadius();
    	let changed = false;
    	const rebuilt = [];

    	(window.allDrawings || []).forEach(stroke => {
        	const pts = stroke.points && stroke.points.length ? stroke.points : parseDToPoints(stroke.d || "");
        	let run = [];

        	function flushRun(){
            	if(run.length >= 2){
                	rebuilt.push({ points: run, color: stroke.color, width: stroke.width });
            	} else if(run.length === 1){
                	// 只剩單獨一個點連不成線，直接捨棄，不留下無意義的殘段
            	}
            	run = [];
        	}

        	pts.forEach(p => {
            	const dx = p[0] - pos.x, dy = p[1] - pos.y;
            	if(dx*dx + dy*dy <= r2){
                	changed = true;
                	flushRun();
            	} else {
                	run.push(p);
            	}
        	});
        	flushRun();
    	});

    	if(changed){
        	window.allDrawings = rebuilt;
        	window.renderDrawings();
        	markProjectDirty();
    	}
	}

	drawLayer.addEventListener("pointerdown", (e)=>{
    	if(!window.__drawModeActive) return;
    	e.preventDefault();
    	e.stopPropagation();
    	try { drawLayer.setPointerCapture(e.pointerId); } catch(err) {}

    	if(eraserMode){
        	isErasing = true;
        	updateEraserCursor(e.clientX, e.clientY);
        	eraserCursor.style.display = "block";
        	eraseNear(toLocalXY(e.clientX, e.clientY));
        	return;
    	}
    	const pos = toLocalXY(e.clientX, e.clientY);
    	currentPoints = [[pos.x, pos.y]];
    	currentPath = document.createElementNS(svgNS, "path");
    	currentPath.setAttribute("d", pointsToD(currentPoints));
    	currentPath.setAttribute("fill", "none");
    	currentPath.setAttribute("stroke", drawColor);
    	currentPath.setAttribute("stroke-width", drawWidth);
    	currentPath.setAttribute("stroke-linecap", "round");
    	currentPath.setAttribute("stroke-linejoin", "round");
    	drawLayer.appendChild(currentPath);
	});

	drawLayer.addEventListener("pointermove", (e)=>{
    	if(!window.__drawModeActive) return;
    	if(eraserMode){
        	updateEraserCursor(e.clientX, e.clientY);
        	eraserCursor.style.display = "block";
        	if(isErasing) eraseNear(toLocalXY(e.clientX, e.clientY));
        	return;
    	}
    	if(!currentPath) return;
    	const pos = toLocalXY(e.clientX, e.clientY);
    	currentPoints.push([pos.x, pos.y]);
    	currentPath.setAttribute("d", pointsToD(currentPoints));
	});

	function endStroke(){
    	if(currentPath && currentPoints && currentPoints.length >= 2){
        	window.allDrawings.push({
            	points: currentPoints,
            	color: drawColor,
            	width: drawWidth
        	});
        	markProjectDirty();
    	}
    	currentPath = null;
    	currentPoints = null;
    	isErasing = false;
	}
	drawLayer.addEventListener("pointerup", endStroke);
	drawLayer.addEventListener("pointercancel", endStroke);
	drawLayer.addEventListener("pointerleave", (e)=>{
    	if(eraserMode && !isErasing) eraserCursor.style.display = "none";
	});

	window.addEventListener("resize", ()=>{
    	if(window.__drawModeActive) resizeDrawLayer();
	});


	//

	// =====================================================
	// 模組四：擲骰工具（給 Gamebook／互動小說作者測試隨機分歧、事件表用）
	// =====================================================
	const dicePanel = document.createElement("div");
	dicePanel.id = "dice-roller-panel";
	dicePanel.innerHTML =
    	'<div style="font-weight:bold;margin-bottom:8px;">🎲 擲骰工具</div>' +
    	'<div class="dice-grid">' +

        	'<button type="button" data-d="6">d6</button>' +
        	'<button type="button" data-d="8">d8</button>' +
        	'<button type="button" data-d="10">d10</button>' +

        	'<button type="button" data-d="20">d20</button>' +
        	'<button type="button" data-d="100">d100</button>' +
        	'<button type="button" id="dice-custom-btn">自訂</button>' +
    	'</div>' +
    	'<div id="dice-roller-result">—</div>' +
    	'<div id="dice-roller-history"></div>';
	document.body.appendChild(dicePanel);

	const diceHistory = [];
	function rollDice(sides){
    	const result = 1 + Math.floor(Math.random() * sides);
    	document.getElementById("dice-roller-result").textContent = "d" + sides + " → " + result;
    	diceHistory.unshift("d" + sides + ": " + result);
    	diceHistory.length = Math.min(diceHistory.length, 8);

function makeDraggable(panelId, headerId){

	const panel = document.getElementById(panelId);
	const header = document.getElementById(headerId);

	if(!panel || !header) return;


	let dragging = false;

	let offsetX = 0;
	let offsetY = 0;



	header.addEventListener(
    	"pointerdown",
    	function(e){


        	// 如果點到按鈕，不啟動拖曳
        	if(e.target.tagName === "BUTTON")
            	return;


        	dragging = true;


        	const rect =
        	panel.getBoundingClientRect();


        	offsetX =
        	e.clientX - rect.left;


        	offsetY =
        	e.clientY - rect.top;



        	// 解除定位限制

        	panel.style.right="auto";
        	panel.style.bottom="auto";



        	header.setPointerCapture(
            	e.pointerId
        	);


        	document.body.style.userSelect="none";


    	}
	);




window.addEventListener(

	"pointermove",

	function(e){


    	if(!dragging)

        	return;


    	e.preventDefault();



    	let left = e.clientX - offsetX;

    	let top  = e.clientY - offsetY;



    	// ===== 邊緣安全距離 =====

    	const edgeSafe = window.innerWidth <= 700 ? 16 : 12;



    	// ===== 左右限制 =====

    	const minLeft = edgeSafe;


    	const maxLeft = Math.max(

        	minLeft,

        	window.innerWidth -

        	panel.offsetWidth -

        	edgeSafe

    	);



    	// ===== 上下限制 =====

    	const minTop = edgeSafe;


    	const maxTop = Math.max(

        	minTop,

        	window.innerHeight -

        	panel.offsetHeight -

        	edgeSafe

    	);



    	// ===== 套用限制 =====

    	left = Math.max(

        	minLeft,

        	Math.min(left, maxLeft)

    	);



    	top = Math.max(

        	minTop,

        	Math.min(top, maxTop)

    	);



    	panel.style.left =

        	left + "px";



    	panel.style.top =

        	top + "px";


	},

	{

    	passive:false

	}

);


	window.addEventListener(
    "pointerup",
    function(e){


        if(!dragging)
            return;


        dragging=false;


        document.body.style.userSelect="";


        try{

            header.releasePointerCapture(
                e.pointerId
            );

        }catch(err){}



        // ============================

    }
);

	);

// =============================================
// 操作歷史：復原 / 重做
// 採用「快照」設計 —— 不用替每一種操作（打字、拖曳、刪頁、生成分歧…）
// 各自寫一套「怎麼復原」的邏輯，而是每隔一小段時間就把當下整個專案
// 狀態記一筆快照，復原/重做就是把畫布切換回某一筆快照。
// 好處是不管使用者做了什麼操作，通通「無痛」自動被記錄，不用另外手動存點。
// =============================================
(function(){

	const HISTORY_LIMIT = 60;   // 最多保留幾筆快照，避免無限占記憶體
	const DEBOUNCE_MS = 900;	// 停止操作後多久才真的記一筆快照

	let historyStack = [];
	let historyIndex = -1;
	let isRestoring = false;
	let debounceTimer = null;
	let observer = null;

	function serializeState(){
    	// 集中化資料中心啟用後，歷史快照會自動包含所有已註冊的功能欄位。
    	// 未來新增功能不必再回來手動補這個快照物件。
    	if(window.ProjectDataCenter && typeof window.ProjectDataCenter.serialize === "function"){
        	return JSON.stringify(
            	window.ProjectDataCenter.serialize({ source: "history-snapshot" })
        	);
    	}

    	// 相容保底：若資料中心尚未載入，保留原有的核心快照格式。
    	return JSON.stringify({
        	pages: pages.map(p => ({
            	id: p.id,
            	title: p.title,
            	text: p.text,
            	note: p.note || "",
            	groupId: p.groupId || null,
            	groupColor: p.groupColor || null,
            	options: JSON.parse(JSON.stringify(p.options || [])),
            	x: p.x,
            	y: p.y
        	})),
        	notes: JSON.parse(JSON.stringify(window.allNotes || [])),
        	drawings: JSON.parse(JSON.stringify(window.allDrawings || [])),
        	currentPageId: currentPage ? currentPage.id : null
    	});
	}

	function updateButtons(){
    	const undoBtn = document.getElementById("historyUndoBtn");
    	const redoBtn = document.getElementById("historyRedoBtn");
    	if(undoBtn) undoBtn.disabled = historyIndex <= 0;
    	if(redoBtn) redoBtn.disabled = historyIndex >= historyStack.length - 1;
	}

	function pushSnapshot(){
    	if(isRestoring) return;
    	if(typeof pages === "undefined") return;

    	const snap = serializeState();

    	if(historyIndex >= 0 && historyStack[historyIndex] === snap) return;

    	historyStack = historyStack.slice(0, historyIndex + 1);
    	historyStack.push(snap);

    	if(historyStack.length > HISTORY_LIMIT){
        	historyStack.shift();
    	}

    	historyIndex = historyStack.length - 1;
    	updateButtons();
	}

	function scheduleSnapshot(){
    	if(isRestoring) return;
    	clearTimeout(debounceTimer);
    	debounceTimer = setTimeout(pushSnapshot, DEBOUNCE_MS);
	}

	function observeCanvas(){
    	const flowCanvasEl = document.getElementById("flowCanvas");
    	if(!flowCanvasEl) return;
    	observer = new MutationObserver(() => {
        	if(isRestoring) return;
        	scheduleSnapshot();
    	});
    	observer.observe(flowCanvasEl, {
        	childList: true,
        	subtree: true,
        	attributes: true,
        	attributeFilter: ["style"]
    	});
	}

	function restoreState(snap){
    	if(!snap) return;

    	isRestoring = true;
    	if(observer) observer.disconnect();
    	clearTimeout(debounceTimer);

    	try{
        	const data = JSON.parse(snap);

        	if(typeof window.importProjectData === "function"){
            	// 資料中心會自動讀取所有已註冊欄位；舊快照仍可正常相容。
            	window.importProjectData(data, {
                	source: "history-restore",
                	resetMissing: true
            });
        	}

        	const selectedPageId =
            	data.editorSelection && data.editorSelection.currentPageId
                	? data.editorSelection.currentPageId
                	: data.currentPageId;
        	if(selectedPageId){
            	const p = pages.find(pp => pp.id === selectedPageId);
            	if(p) selectPage(p);
        }

        	projectChanged = true;
        	if(typeof window.markDirty === "function") window.markDirty();

    	} finally {
        	setTimeout(() => {
            	isRestoring = false;
            	observeCanvas();
        	}, 150);
    	}
	}

	window.undoHistory = function(){
    	if(historyIndex <= 0) return;

    	clearTimeout(debounceTimer);
    	pushSnapshot();

    	historyIndex--;
    	restoreState(historyStack[historyIndex]);
    	updateButtons();
	};

	window.redoHistory = function(){
    	if(historyIndex >= historyStack.length - 1) return;
    	historyIndex++;
    	restoreState(historyStack[historyIndex]);
    	updateButtons();
	};

	const header = document.querySelector("header");
	if(header){

    	const tag = e.target.tagName;

    	const key = e.key.toLowerCase();

    	if((e.ctrlKey || e.metaKey) && !e.shiftKey && key === "z"){
        	if(typing) return;

    	){

        	e.preventDefault();
        	window.redoHistory();
    	}
	});

	setTimeout(() => {
    	pushSnapshot();
    	updateButtons();

(function () {

	"use strict";


	// ============================================================
	// 可調整大小的浮動視窗設定
	//
	// panelId:
	//   外層浮動視窗（調整寬度）
	//
	// contentId:
	//   內容區塊（調整高度）
	//
	// minWidth / minHeight:
	//   最小尺寸限制，避免縮到壞掉
	//
	// 新增浮動視窗時，只需要在這裡增加設定即可
	// ============================================================

	const PANELS = [

    	{
        	panelId: "editorFloat",
        	contentId: "editorPanel",
        	minWidth: 320,
        	minHeight: 160
    	},

    	{
        	panelId: "previewFloat",
        	contentId: "previewPanel",
        	minWidth: 280,
        	minHeight: 120
    	},

    	{
        	panelId: "permFloat",
        	contentId: "permBody",
        	minWidth: 260,
        	minHeight: 80
    	}

	];



	// ============================================================
	// 建立右下角縮放把手
	// ============================================================

	function createResizeHandle() {

    	const handle = document.createElement("div");

    	handle.className = "__pixiv-resize-handle";
    	handle.title = "拖曳調整視窗大小";


    	// 全部使用 inline style
    	// 不修改 style.css

    	Object.assign(handle.style, {

        	position: "absolute",

        	right: "2px",

        	bottom: "2px",

        	width: "16px",

        	height: "16px",

        	cursor: "nwse-resize",

        	touchAction: "none",

        	zIndex: "10",

        	opacity: "0.55",

        	background:
            	"linear-gradient(135deg, transparent 0 42%, currentColor 42% 54%, transparent 54% 66%, currentColor 66% 78%, transparent 78% 100%)",

        	color: "#000"

    	});



    	handle.addEventListener(
        	"pointerenter",
        	function () {

            	handle.style.opacity = "1";

        	}
    	);


    	handle.addEventListener(
        	"pointerleave",
        	function () {

            	handle.style.opacity = "0.55";

        	}
    	);


    	return handle;

	}




	// ============================================================
	// 讓指定浮動視窗支援 resize
	// ============================================================

	function makeResizable(
    	panelId,
    	contentId,
    	minWidth,
    	minHeight
	) {


    	const panel =
        	document.getElementById(panelId);


    	const content =
        	document.getElementById(contentId);



    	if (!panel || !content) return;



    	// 避免重複加入

    	if (
        	panel.querySelector(
            	".__pixiv-resize-handle"
        	)
    	) {

        	return;

    	}




    	// 確保縮小時可以捲動

    	const currentOverflow =
        	getComputedStyle(content).overflowY;


    	if (currentOverflow === "visible") {

        	content.style.overflow = "auto";

    	}




    	const handle = createResizeHandle();

    	panel.appendChild(handle);




    	let resizing = false;

    	let startX = 0;

    	let startY = 0;

    	let startWidth = 0;

    	let startContentHeight = 0;





    	// --------------------------------------------------------
    	// 開始縮放
    	// --------------------------------------------------------

    	handle.addEventListener(
        	"pointerdown",
        	function (e) {


            	resizing = true;


            	startX = e.clientX;

            	startY = e.clientY;


            	startWidth =
                	panel.getBoundingClientRect().width;


            	startContentHeight =
                	content.getBoundingClientRect().height;



            	handle.setPointerCapture(
                	e.pointerId
            	);


            	document.body.style.userSelect =
                	"none";


            	e.preventDefault();

        	}
    	);






    	// --------------------------------------------------------
    	// 縮放中
    	// --------------------------------------------------------

    	handle.addEventListener(
        	"pointermove",
        	function (e) {


            	if (!resizing) return;



            	const dx =
                	e.clientX - startX;


            	const dy =
                	e.clientY - startY;




            	const maxWidth =
                	window.innerWidth * 0.9;


			const maxContentHeight =
				panelId === "editorFloat"
				?
				Math.max(
					minHeight,
					window.innerHeight-
					panel.getBoundingClientRect().top-
					52
				)
				:
                	window.innerHeight * 0.85;




            	const newWidth =
                	Math.min(
                    	maxWidth,
                    	Math.max(
                        	minWidth,
                        	startWidth + dx
                    	)
                	);



            	const newContentHeight =
                	Math.min(
                    	maxContentHeight,
                    	Math.max(
                        	minHeight,
                        	startContentHeight + dy
                    	)
                	);





            	panel.style.width =
                	newWidth + "px";


            	content.style.height =
                	newContentHeight + "px";


            	content.style.maxHeight =
                	newContentHeight + "px";


        	}
    	);







    	// --------------------------------------------------------
    	// 結束縮放
    	// --------------------------------------------------------

    	function stopResize(e) {


        	if (!resizing) return;


        	resizing = false;


        	document.body.style.userSelect =
            	"";



        	try {

            	handle.releasePointerCapture(
                	e.pointerId
            	);

        	}

        	catch (err) {}

    	}




    	handle.addEventListener(
        	"pointerup",
        	stopResize
    	);


    	handle.addEventListener(
        	"pointercancel",
        	stopResize
    	);

	}






	// ============================================================
	// 初始化
	// ============================================================

	function init() {


    	PANELS.forEach(
        	function (p) {


            	makeResizable(
                	p.panelId,
                	p.contentId,
                	p.minWidth,
                	p.minHeight
            	);


        	}
    	);

	}





	// 頁面載入後執行

	if (
    	document.readyState === "complete" ||
    	document.readyState === "interactive"
	) {

    	init();

	}


	window.addEventListener(
    	"load",
    	init
	);






	// ============================================================
	// 保險機制
	// 防止浮動視窗稍後才建立
	// ============================================================

	let retries = 0;


	const retryTimer =
    	setInterval(
        	function () {


            	init();



            	retries++;


            	if (retries > 20) {

                	clearInterval(
                    	retryTimer
                	);

            	}


        	},
        	500
    	);



})();

        }

        listeners.get(type).add(handler);
        return function unsubscribe(){ off(type, handler); };
    }

    function off(type, handler){
        const set = listeners.get(type);
        if(!set) return false;
        const removed = set.delete(handler);
        if(set.size === 0) listeners.delete(type);

    }

        const payload = {
            type,
            detail,
            core: api,
            time: Date.now()
        };

        const set = listeners.get(type);
        if(set){
            [...set].forEach(handler => {
                try{ handler(payload); }
                catch(error){ console.error("[GamebookCore hook error]", type, error); }
            });
        }

        try{
            document.dispatchEvent(new CustomEvent("gamebook:" + type, {
                detail: payload
            }));
        }catch(error){
            console.warn("[GamebookCore] CustomEvent 發送失敗", error);
        }

        if(typeof name !== "string" || !name.trim()){
            throw new TypeError("外掛名稱必須是非空字串");
        }
        if(!plugin || (typeof plugin !== "object" && typeof plugin !== "function")){
            throw new TypeError("外掛必須是物件或函式");
        }
        if(plugins.has(name)){
            console.warn("[GamebookCore] 外掛已存在，將覆蓋：", name);
            unregisterPlugin(name);
        }

        const record = { name, plugin, cleanup: null };
        plugins.set(name, record);

        try{
            const init = typeof plugin === "function" ? plugin : plugin.init;
            if(typeof init === "function"){
                const cleanup = init(api);
                if(typeof cleanup === "function") record.cleanup = cleanup;
            }
            emit("plugin:registered", { name, plugin });
        }catch(error){
            plugins.delete(name);
            console.error("[GamebookCore] 外掛初始化失敗：" + name, error);
            throw error;
        }

            linesCanvas: document.querySelector("#linesCanvas"),
            titleInput,
            noteInput,
            textInput,
            optionsBox,
            previewText,
            htmlPreview: document.querySelector("#htmlPreview"),
            editorFloat: document.querySelector("#editorFloat"),
            previewFloat: document.querySelector("#previewFloat")
        },

        // 資料查詢
        getPageById,
        getPageNumber,
        getPageByNumber(number){ return pages[Number(number) - 1] || null; },
        indexOfPage(page){ return pages.indexOf(page); },

        // 安全操作
        createPage,
        removePage,
        selectPage(pageOrId){
            const page = typeof pageOrId === "string" ? getPageById(pageOrId) : pageOrId;
            if(!page) return false;
            selectPage(page);
            emit("page:selected", { page, source: "GamebookCore" });
            return true;
        },
        createFlowNode,
        drawLines,
        renderOptions,
        refreshNodeBadges,
        updatePreview,
        generatePixiv,
        createPageIndex,
        notifyChange,
        changeLanguage,
        t,

        // 儲存／匯入介面的延遲存取，避免載入順序限制
        get dataCenter(){ return window.ProjectDataCenter || null; },
        get storage(){ return window.safeStorage || null; },

        // 外掛與事件
        on,
        once(type, handler){
            const unsubscribe = on(type, event => {
                unsubscribe();
                handler(event);
            });
            return unsubscribe;
        },
        off,
        emit,
        registerPlugin,
        unregisterPlugin,
        hasPlugin(name){ return plugins.has(name); },
        getPlugin(name){ return plugins.get(name)?.plugin || null; },
        listPlugins(){ return [...plugins.keys()]; },

        // 等候後載入的全域功能
        whenAvailable(name, callback, timeout = 10000){
            const started = Date.now();
            return new Promise((resolve, reject) => {
                const check = () => {
                    if(window[name]){
                        if(typeof callback === "function") callback(window[name], api);
                        resolve(window[name]);
                        return;
                    }
                    if(Date.now() - started >= timeout){
                        reject(new Error("等待全域功能逾時：" + name));
                        return;
                    }
                    setTimeout(check, 30);
                };
                check();
            });
        }
    };

    // 舊式外掛相容入口：避免未來又要盤查 lexical scope
    window.GamebookCore = api;
    window.GamebookPages = pages;
    window.GamebookAPI = api;
    window.getGamebookCurrentPage = () => currentPage;

    // 宣告核心就緒
    queueMicrotask(() => {
        emit("core:ready", { version: api.version });
        document.documentElement.dataset.gamebookCoreReady = "1";
        console.info("[GamebookCore] 擴充橋接層已啟用", api);
    });

})();

// ---------- 共用：在 textarea 選取範圍前後插入標籤 ----------
function insertAroundSelection(textarea, before, after){
	if(!textarea) return;

	const start = textarea.selectionStart;
	const end = textarea.selectionEnd;
	const val = textarea.value;
	const sel = val.substring(start, end);

	textarea.value =
		val.substring(0, start) +
		before + sel + after +
		val.substring(end);

	textarea.focus();
	textarea.selectionStart = start + before.length;
	textarea.selectionEnd = start + before.length + sel.length;

	// 觸發既有的 input 監聽（同步資料/預覽），不需碰原始邏輯
	textarea.dispatchEvent(new Event("input", { bubbles:true }));
}

// 額外排版按鈕清單（正文區與原始碼模式共用）
const EXTRA_FORMAT_TAGS = [
	{ label:"H1",     before:"[h1:",     after:"]" },
	{ label:"H2",     before:"[h2:",     after:"]" },
	{ label:"H3",     before:"[h3:",     after:"]" },
	{ label:"底線",    before:"[u:",      after:"]" },
	{ label:"刪除線",  before:"[s:",      after:"]" },
	{ label:"引用",    before:"[quote:",  after:"]" },
	{ label:"清單",    before:"[list]\n", after:"\n[/list]" },
	{ label:"分隔線",  before:"",         after:"\n[hr]\n" },

];

		});
		wrap.appendChild(btn);
	});

}

// ---------- 2. Pixiv 小說預覽 ----------
function escapeHtml(str){
	return str
		.replace(/&/g, "&amp;")
		.replace(/</g, "&lt;")
		.replace(/>/g, "&gt;");
}

function renderPixivNovelText(text){
	if(!text) return "";

	let html = escapeHtml(text);

	// [chapter:標題] → 標題字體
	html = html.replace(
		/\[chapter:(.*?)\]/g,
		'<div class="novel-chapter-title">$1</div>'
	);

	// [newpage] → 分頁線
	html = html.replace(
		/\[newpage\]/g,
		'<hr class="novel-divider">'
	);

	// [jump:n] → 前往下一頁提示
	html = html.replace(
		/\[jump:(.*?)\]/g,
		'<div class="novel-jump">➜ 前往第 $1 頁</div>'
	);

	// 標題
	html = html.replace(/\[h1:(.*?)\]/g, "<h1>$1</h1>");
	html = html.replace(/\[h2:(.*?)\]/g, "<h2>$1</h2>");
	html = html.replace(/\[h3:(.*?)\]/g, "<h3>$1</h3>");

	// 基本文字樣式
	html = html.replace(/\[b:(.*?)\]/g, "<strong>$1</strong>");
	html = html.replace(/\[i:(.*?)\]/g, "<em>$1</em>");
	html = html.replace(/\[u:(.*?)\]/g, "<u>$1</u>");
	html = html.replace(/\[s:(.*?)\]/g, "<del>$1</del>");

	// 顏色 / 字級
	html = html.replace(/\[color:(.*?):(.*?)\]/g, '<span style="color:$1">$2</span>');
	html = html.replace(/\[size:(\d+):(.*?)\]/g, '<span style="font-size:$1px">$2</span>');

	// 引用 / 分隔線
	html = html.replace(/\[quote:([\s\S]*?)\]/g, "<blockquote>$1</blockquote>");
	html = html.replace(/\[hr\]/g, "<hr>");

	// 連結 / 圖片 / Pixiv插畫
	html = html.replace(/\[link:(.*?)\|(.*?)\]/g, '<a href="$2" target="_blank">$1</a>');
	html = html.replace(/\[img:(.*?)\]/g, '<img src="$1">');
	html = html.replace(
		/\[pixivimage:(\d+)\]/g,
		'<div class="pixiv-image-link"><a href="https://www.pixiv.net/artworks/$1" target="_blank">Pixiv插畫 $1</a></div>'
	);

	// Ruby
	html = html.replace(/\[\[rb:(.*?) > (.*?)\]\]/g, "<ruby>$1<rt>$2</rt></ruby>");

	// 清單
	html = html.replace(/\[list\]([\s\S]*?)\[\/list\]/g, function(match, content){
		const items = content
			.trim()
			.split(/\n/)
			.map(x=>x.trim())
			.filter(Boolean)
			.map(x=>"<li>" + x.replace(/^[-*]\s*/, "") + "</li>")
			.join("");
		return "<ul>" + items + "</ul>";
	});

	// 換行（最後處理）
	html = html.replace(/\n/g, "<br>");

	return html;
}
window.renderPixivNovelText = renderPixivNovelText;

<script>
(function(){
	"use strict";

	// ---------- 分頁：把長卷切成一頁一頁，模擬 Galgame 閱讀感 ----------
	// 沒按按鈕以前看不到下一頁；抵達某頁後，前面的頁面會隱藏起來
	var pages = [];
	var currentIndex = 0;

	function paginateNovel(){
		var container = document.querySelector(".pixiv-novel-preview");
		if(!container) return [];

		var children = Array.prototype.slice.call(container.childNodes);
		var result = [];
		var current = document.createElement("div");
		current.className = "novel-page-section";

		children.forEach(function(node){
			// 用原本代表 [newpage] 的分隔線來切頁，不需要更動 renderPixivNovelText()
			if(node.nodeType === 1 && node.classList && node.classList.contains("novel-divider")){
				result.push(current);
				current = document.createElement("div");
				current.className = "novel-page-section";
				return;
			}
			current.appendChild(node);
		});
		result.push(current);

		container.innerHTML = "";
		result.forEach(function(pageEl, idx){
			pageEl.dataset.pageIndex = idx;

			var nav = document.createElement("div");
			nav.className = "novel-nav";

			if(idx > 0){
				var prevBtn = document.createElement("button");
				prevBtn.type = "button";
				prevBtn.className = "novel-nav-btn";
				prevBtn.textContent = "◀ 上一頁";
				prevBtn.addEventListener("click", function(){ goToPage(idx - 1); });
				nav.appendChild(prevBtn);
			}

			var indicator = document.createElement("span");
			indicator.className = "novel-nav-page-indicator";
			indicator.textContent = "第 " + (idx + 1) + " / " + result.length + " 頁";
			nav.appendChild(indicator);

			if(idx < result.length - 1){
				var nextBtn = document.createElement("button");
				nextBtn.type = "button";
				nextBtn.className = "novel-nav-btn";
				nextBtn.textContent = "▶ 下一頁";
				nextBtn.addEventListener("click", function(){ goToPage(idx + 1); });
				nav.appendChild(nextBtn);
			}

			pageEl.appendChild(nav);
			container.appendChild(pageEl);
		});

		// 內文裡的「➜ 前往第 N 頁」提示，用事件代理統一處理點擊
		// （委派到整個小說容器，不管頁面怎麼被搬移／重建都不會失效）
		container.addEventListener("click", function(e){
			var jumpEl = e.target.closest ? e.target.closest(".novel-jump[data-target-page]") : null;
			if(!jumpEl) return;

			var targetIndex = parseInt(jumpEl.getAttribute("data-target-page"), 10) - 1;
			if(isNaN(targetIndex)) return;

			goToPage(targetIndex);
		});

		return result;
	}

	function goToPage(index){
		if(!pages.length) return;
		if(index < 0) index = 0;
		if(index > pages.length - 1) index = pages.length - 1;

		pages.forEach(function(p, i){
			p.style.display = (i === index) ? "" : "none";
		});

		currentIndex = index;

		var container = document.querySelector(".pixiv-novel-preview");
		if(container) container.scrollTop = 0;
	}

	// ---------- 書籤（存檔點／讀取點）：記錄「頁碼」而不是捲動位置 ----------
	var STORAGE_KEY = "PixivNovelPreview_Bookmarks_${novelHash}";
	var bookmarks = [];

	function loadBookmarks(){
		try{
			return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
		}catch(e){
			return [];
		}
	}

	function saveBookmarks(){
		try{
			localStorage.setItem(STORAGE_KEY, JSON.stringify(bookmarks));
		}catch(e){
			alert("書籤儲存失敗，可能是瀏覽器封鎖了本機儲存空間");
		}
	}

	function escapeHtmlLocal(str){
		return String(str)
			.replace(/&/g,"&amp;")
			.replace(/</g,"&lt;")
			.replace(/>/g,"&gt;");
	}

	function currentPageSnippet(){
		var page = pages[currentIndex];
		var title = page ? page.querySelector(".novel-chapter-title") : null;
		return title ? title.textContent : ("第 " + (currentIndex + 1) + " 頁");
	}

	function addBookmark(){
		var defaultName = currentPageSnippet();
		var name = prompt("請輸入書籤名稱（可當作存檔點名稱）：", defaultName);
		if(name === null) return;

		bookmarks.unshift({
			id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
			label: name.trim() || defaultName,
			pageIndex: currentIndex,
			snippet: currentPageSnippet(),
			createdAt: new Date().toLocaleString()
		});

		saveBookmarks();
		renderBookmarkList();
		panel.classList.add("open");
	}

	function goToBookmark(id){
		var bm = null;
		for(var i=0;i<bookmarks.length;i++){
			if(bookmarks[i].id === id){ bm = bookmarks[i]; break; }
		}
		if(!bm) return;
		goToPage(bm.pageIndex || 0);
	}

	function deleteBookmark(id){
		if(!confirm("確定要刪除這個書籤嗎？")) return;
		bookmarks = bookmarks.filter(function(b){ return b.id !== id; });
		saveBookmarks();
		renderBookmarkList();
	}

	function renderBookmarkList(){
		toggleBtn.textContent = "📑 書籤 (" + bookmarks.length + ")";

		if(!bookmarks.length){
			listEl.innerHTML = '<div class="px-bookmark-empty">尚未建立任何書籤，可當作存檔點／讀取點使用</div>';
			return;
		}

		listEl.innerHTML = bookmarks.map(function(bm){
			return '<div class="px-bookmark-item">' +
				'<div class="px-bookmark-label">' + escapeHtmlLocal(bm.label) + '</div>' +
				(bm.snippet ? '<div class="px-bookmark-snippet">' + escapeHtmlLocal(bm.snippet) + '</div>' : '') +
				'<div class="px-bookmark-snippet">' + bm.createdAt + '</div>' +
				'<div class="px-bookmark-actions">' +
					'<button class="px-bookmark-go" data-id="' + bm.id + '">前往</button>' +
					'<button class="px-bookmark-del" data-id="' + bm.id + '">刪除</button>' +
				'</div>' +
			'</div>';
		}).join("");

		var goButtons = listEl.querySelectorAll(".px-bookmark-go");
		for(var i=0;i<goButtons.length;i++){
			goButtons[i].addEventListener("click", function(e){ goToBookmark(e.target.getAttribute("data-id")); });
		}
		var delButtons = listEl.querySelectorAll(".px-bookmark-del");
		for(var j=0;j<delButtons.length;j++){
			delButtons[j].addEventListener("click", function(e){ deleteBookmark(e.target.getAttribute("data-id")); });
		}
	}

	var bar = document.createElement("div");
	bar.className = "px-bookmark-bar";
